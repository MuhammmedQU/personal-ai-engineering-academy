title: "AI Məhsul Kəşfi, Qərəzsiz Müsahibələr (The Mom Test), MVP və Unit Economics"
summary: "\"Problem axtaran AI wrapper\" tələsindən qaçmağı, The Mom Test qaydaları ilə real istifadəçi ağrısını tapmağı, ölçülə bilən MVP çərçivəsi qurmağı və hər aktiv istifadəçiyə düşən aylıq LLM/infrastruktur xərcini (unit economics) hesablamağı öyrənəcəksən."
level: foundation
estimated_minutes: [45, 65]
prerequisites: []
next: product-validation-iteration
skills: [product-discovery, product-mvp-economics]
objectives:
  - "Konkret, yüksək sürtünməli istifadəçi problemini 'texnologiya naminə AI wrapper' ideyasından ayırmaq"
  - "İstifadəçi müsahibələrində yönləndirici gələcək suallar əvəzinə keçmiş davranış və mövcud workaround sualları (The Mom Test) vermək"
  - "MVP əhatə dairəsini (scope), açıq non-goal siyahısını və ölçülə bilən uğur meyarını müəyyənləşdirmək"
  - "Aktiv istifadəçi başına aylıq inference və infrastruktur xərcini (unit economics) və marjanı hesablamaq"
why_it_matters: |
  AI startaplarının və daxili şirkət layihələrinin əksəriyyəti modelin zəifliyinə görə yox, **heç kimin pul və ya vaxt ödəmək istəmədiyi bir şeyi qurduğuna** və ya **unit economics-in mənfiyə getdiyinə** görə bağlanır.

  Dostlarından *"Sənədləri xülasələşdirən AI qururuq, işlədərsən?"* soruşanda hamı nəzakətlə *"Əlbəttə, əla fikirdir!"* deyir — amma məhsul çıxanda heç kim qeydiyyatdan keçmir. Digər tərəfdən, istifadəçidən ayda $\$10$ abunə haqqı alıb, arxada hər istifadəçi üçün $\$24$ LLM API pulu ödəyən məhsul nə qədər çox böyüyərsə, bir o qədər tez müflis olur.
terms:
  - term: The Mom Test
    definition: "İnsanların sənə nəzakət xətrinə yalan danışa bilməyəcəyi müsahibə üsulu: gələcək fərziyyələr ('İşlədərdinmi?') əvəzinə yalnız keçmiş faktlar və mövcud həllər soruşulur."
  - term: Workaround (Mövcud dolama həll)
    definition: "İstifadəçinin problemi həll etmək üçün hazırda Excel, əl işi, freelancer və ya başqa alətlərlə sərf etdiyi real vaxt və pul. Workaround yoxdursa, problem kifayət qədər ağrılı olmaya bilər."
  - term: MVP (Minimum Viable Product)
    definition: "İstifadəçiyə əsas dəyəri verən və hipotezi real davranışla ölçməyə kifayət edən ən kiçik işlək məhsul versiyası."
  - term: Build vs Buy vs API
    definition: "Sıfırdan öz modelini öyrətmək (Build), hazır SaaS almaq (Buy) və ya hazır LLM API üzərində iş axını qurmaq (API) qərarı."
  - term: Unit Economics
    definition: "Məhsulun tək bir vahidi (məs. 1 aktiv istifadəçi və ya 1 emal olunmuş sənəd) üzrə gəlir ilə birbaşa xərclərin (LLM inference + server + dəstək) fərqi."
  - term: Gross Margin (Ümumi marja)
    definition: "$\\frac{\\text{Revenue} - \\text{COGS}}{\\text{Revenue}}$. Burada COGS (Cost of Goods Sold) birbaşa xidmət xərcləridir (tokenlər, GPU/hosting)."
sections:
  - id: problem-discovery-economics
    kind: explanation
    title: "Problem Kəşfi, The Mom Test, MVP Çərçivəsi və Unit Economics"
    body: |
      ### 1. "AI Wrapper" tələsi vs Yüksək sürtünməli problem
      *"Gəlin hüquqşünaslar üçün AI çatbot quraq"* — bu, problem deyil, qeyri-müəyyən arzu siyahısıdır. Yaxşı məhsul kəşfi konkret, təkrarlanan və bahalı bir darboğazdan başlayır:
      - **Zəif ifadə:** *"HR-lar üçün AI köməkçi."*
      - **Güclü problem ifadəsi:** *"50+ işçisi olan şirkətlərdə HR mütəxəssisi hər ay əmək müqaviləsi əlavələrini Word-də əl ilə yoxlamağa 18 saat sərf edir və rəqəm səhvləri cərimə riski yaradır."*

      ### 2. The Mom Test: İstifadəçi müsahibəsində 3 Qızıl Qayda
      Rob Fitzpatrick-in *The Mom Test* yanaşmasına görə, hətta öz anan belə səni incitməmək üçün ideyana *"Çox gözəldir!"* deyəcək. Ona görə:
      1. **Öz ideyandan yox, onların həyatından danış:** *"Belə bir AI qursaq alarsan?"* sualı qadağandır.
      2. **Ümumi fikirləri yox, keçmişdəki son konkret hadisəni soruş:** *"Adətən müqavilələri necə yoxlayırsan?"* əvəzinə *"Keçən həftə sonuncu müqaviləni hazırlayanda addım-addım nə etdin? Nə qədər vaxt apardı?"*
      3. **Mövcud workaround və büdcəni axtar:** Əgər insan problemdən şikayətlənir, amma onu həll etmək üçün indiyə qədər heç bir cəhd etməyibsə (nə Excel cədvəli qurub, nə kiməsə pul ödəyib), sabah sənin məhsuluna da pul ödəməyəcək.

      ### 3. MVP Scope və Build vs Buy vs API
      MVP-də məqsəd ən mürəkkəb arxitekturanı qurmaq deyil, ən az mühəndis saatı ilə istifadəçi dəyərini sübut etməkdir:
      - **İlk gündən öz modelini öyrətmə (No premature fine-tuning):** Əvvəlcə hazır LLM API + sadə deterministik workflow ilə 10 real müştərinin problemini həll et.
      - **Non-goals (Nəyi ETMƏYƏCƏYİK):** MVP-də çoxdilli interfeys, mobil tətbiq, SSO, xüsusi fine-tuned model kimi şeyləri açıq şəkildə `non-goals` siyahısına sal.
      - **Ölçülə bilən uğur meyarı:** *"İstifadəçilər bəyəndi"* metrik deyil. *"İstifadəçilərin 60%-i ilk həftədə ən azı 5 sənəd emal etdi və redaktə vaxtı 20 dəqiqədən 3 dəqiqəyə düşdü"* — bu, mühəndis metrikasıdır.

      ### 4. AI Məhsulunun Unit Economics riyaziyyatı
      Klassik SaaS-da əlavə 1 istifadəçinin marjinal xərci sıfıra yaxındır. AI məhsulunda isə hər sorğu real pul (token + GPU) xərcləyir!

      Ayda $U$ aktiv istifadəçi, hər istifadəçinin orta hesabla $Q$ sorğusu (retry və sistem promptları daxil!), hər sorğuda $N_{\text{in}}$ giriş və $N_{\text{out}}$ çıxış tokeni varsa:

      $$\text{Cost}_{\text{query}} = \frac{N_{\text{in}}}{10^6} \cdot p_{\text{in}} + \frac{N_{\text{out}}}{10^6} \cdot p_{\text{out}}$$

      $$\text{Cost}_{\text{total}} = U \cdot Q \cdot \text{Cost}_{\text{query}} + \text{Cost}_{\text{fixed\_infra}}$$

      $$\text{Cost}_{\text{per\_user}} = \frac{\text{Cost}_{\text{total}}}{U}$$

      Sağlam abunə qiyməti ($\text{Price}_{\text{user}}$) $\text{Cost}_{\text{per\_user}}$-dən ən azı **3–5 dəfə böyük** olmalıdır (65%–80% gross margin), çünki ağır istifadəçilər (power users), uğursuz retry-lar və ödəniş komissiyaları marjanı yeyir.
  - id: painkiller-vs-vitamin-analogy
    kind: analogy
    title: "Mental model: ağrıkəsici vs vitamin və limitsiz restoran bileti"
    body: |
      - **Vitamin vs Ağrıkəsici:** Vitamin (*"Gündəlik motivasiya mətnləri yazan AI"*) xoşdur, amma almasan da həyat davam edir. Ağrıkəsici (*"Hər gün 3 saat aparan faktura üzləşdirməsini 2 dəqiqəyə endirən alət"*) isə dərhal hiss olunan ağrını kəsir və büdcəsi hazırdır.
      - **Unit Economics = Limitsiz (All-you-can-eat) suşi restoranı:** Giriş biletini $\$15$ qoymusan, amma hər müştəri orta hesabla $\$22$-lıq balıq yeyirsə, qapıda növbə nə qədər uzansa, bir o qədər tez batacaqsan. Hər boşqabın (sorğunun) maya dəyərini əvvəlcədən hesablamalı və ya kvota qoymalısan.
  - id: discovery-to-mvp-diagram
    kind: diagram
    title: "İdeyadan Ölçülə Bilən MVP-yə Qərar Axını"
    body: |
      ```mermaid
      flowchart LR
