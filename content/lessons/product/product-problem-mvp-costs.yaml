exercises:
  - id: ex-prodmvp-unit-cost
    type: code
    title: "estimate_monthly_unit_cost funksiyasını yaz"
    prompt: |
      AI məhsulunun aylıq xərcini və 1 aktiv istifadəçiyə düşən maya dəyərini hesablayan `estimate_monthly_unit_cost` funksiyasını yaz:

      ```python
      def estimate_monthly_unit_cost(
          users: int,
          queries_per_user: int,
          avg_in_tokens: int,
          avg_out_tokens: int,
          price_in_per_1m: float,
          price_out_per_1m: float,
          fixed_infra_usd: float,
      ) -> dict[str, float]:
      ```

      **Müqavilə:**
      1. `users <= 0` olarsa və ya digər parametrlərdən hər hansı biri mənfi (`< 0`) olarsa, `ValueError` qaldır.
      2. Aylıq ümumi sorğu sayı: `total_queries = users * queries_per_user`.
      3. Bir sorğunun LLM xərci: `(avg_in_tokens / 1_000_000) * price_in_per_1m + (avg_out_tokens / 1_000_000) * price_out_per_1m`.
      4. `llm_cost_usd = total_queries * cost_per_query`.
      5. `total_usd = llm_cost_usd + fixed_infra_usd`.
      6. `cost_per_user_usd = total_usd / users`.
      7. Bu lüğəti qaytar:
         `{"llm_cost_usd": round(float(llm_cost_usd), 2), "total_usd": round(float(total_usd), 2), "cost_per_user_usd": round(float(cost_per_user_usd), 4)}`
    skills: [product-mvp-economics, product-discovery]
    category: python
    difficulty: 1
    hints:
      - "Əvvəlcə `if users <= 0: raise ValueError(...)` və `if any(x < 0 for x in [...]): raise ValueError(...)` yoxla."
      - "1 milyon tokenə bölmək üçün `1_000_000.0` istifadə et."
      - "Yuvarlaqlaşdırma tələblərinə diqqət et: `llm_cost_usd` və `total_usd` üçün `2`, `cost_per_user_usd` üçün `4` onluq rəqəm."
