      ```

      Kod yazmaq (`F`) yalnız problem (`B-C`) və iqtisadiyyat (`E`) təsdiqləndikdən sonra başlayır.
  - id: worked-unit-economics
    kind: worked_example
    title: "Aylıq Unit Economics və Qiymət Qərarı nümunəsi"
    body: |
      Tutaq ki, mühasiblər üçün müqavilə yoxlayan B2B AI aləti planlaşdırırsan:
      - Aktiv istifadəçi sayı: $U = 200$ mühasib
      - Hər istifadəçi ayda orta hesabla $Q = 150$ sorğu göndərir (ümumi $30\,000$ sorğu)
      - Hər sorğuda (RAG konteksti + retry əmsalı daxil): $N_{\text{in}} = 4\,000$ token, $N_{\text{out}} = 500$ token
      - Model qiyməti: $p_{\text{in}} = \$2.50 / 10^6$, $p_{\text{out}} = \$10.00 / 10^6$
      - Sabit aylıq server və baza xərci: $\text{Cost}_{\text{fixed}} = \$120.00$

      **1. Bir sorğunun LLM xərci:**

      $$\text{Cost}_{\text{query}} = \frac{4000}{10^6} \times 2.50 + \frac{500}{10^6} \times 10.00 = 0.010 + 0.005 = \$0.015$$

      **2. Aylıq ümumi LLM xərci:**

      $$\text{Cost}_{\text{LLM}} = 200 \times 150 \times 0.015 = \$450.00$$

      **3. Ümumi aylıq xərc və 1 istifadəçiyə düşən maya dəyəri:**

      $$\text{Cost}_{\text{total}} = 450.00 + 120.00 = \$570.00$$

      $$\text{Cost}_{\text{per\_user}} = \frac{570.00}{200} = \$2.85 / \text{istifadəçi}$$

      **Biznes nəticəsi:** İstifadəçi başına maya dəyəri $\$2.85$-dır. Əgər aylıq abunəni $\$19$ təyin etsən (ayda 150 sorğu limiti ilə), gross margin $\frac{19 - 2.85}{19} \approx 85\%$ olur — bu, sağlam və dayanıqlı modeldir.
  - id: code-unit-cost-calculator
    kind: code
    title: "Kod: Aylıq Unit Economics Kalkulyatoru"
    body: |
      ```python
      def estimate_monthly_unit_cost(
          users: int,
          queries_per_user: int,
          avg_in_tokens: int,
          avg_out_tokens: int,
          price_in_per_1m: float,
          price_out_per_1m: float,
          fixed_infra_usd: float,
      ) -> dict[str, float]:
          """AI məhsulunun aylıq LLM və infrastruktur xərcini və istifadəçi başına maya dəyərini hesablayır."""
          if users <= 0:
              raise ValueError("users must be a positive integer")

          numeric_params = [
              queries_per_user,
              avg_in_tokens,
              avg_out_tokens,
              price_in_per_1m,
              price_out_per_1m,
              fixed_infra_usd,
          ]
          if any(x < 0 for x in numeric_params):
              raise ValueError("counts, prices, and infra costs cannot be negative")

          total_queries = users * queries_per_user
          cost_per_query = (
              (avg_in_tokens / 1_000_000.0) * price_in_per_1m
              + (avg_out_tokens / 1_000_000.0) * price_out_per_1m
          )
          llm_cost_usd = total_queries * cost_per_query
          total_usd = llm_cost_usd + fixed_infra_usd
          cost_per_user_usd = total_usd / users

          return {
              "llm_cost_usd": round(float(llm_cost_usd), 2),
              "total_usd": round(float(total_usd), 2),
              "cost_per_user_usd": round(float(cost_per_user_usd), 4),
          }


      print(
          estimate_monthly_unit_cost(
              users=200,
              queries_per_user=150,
              avg_in_tokens=4000,
              avg_out_tokens=500,
              price_in_per_1m=2.50,
              price_out_per_1m=10.00,
              fixed_infra_usd=120.0,
          )
      )
      # {'llm_cost_usd': 450.0, 'total_usd': 570.0, 'cost_per_user_usd': 2.85}
      ```
  - id: common-mistakes
    kind: mistakes
    title: "Ən çox edilən səhvlər"
    body: |
      **1. Yönləndirici fərziyyə sualları vermək ("Belə AI qursaq işlədərsən?")**
      İnsanlar gələcək barədə nikbin yalan danışırlar. Yalnız keçmişdə baş vermiş faktlar, hazırda xərclənən saatlar və mövcud workaround-lar həqiqi sübutdur.

      **2. İstifadəçi dəyərini sübut etməmiş model fine-tune etmək və ya mürəkkəb mikroservis qurmaq**
      Heç bir müştərinin işlətmədiyi məhsul üçün 3 həftə GPU-da model fine-tune etmək ən bahalı vaxt itkisidir. Əvvəlcə hazır API + sadə interfeyslə dəyəri sübut et.

      **3. Qiymət qoyarkən yalnız istifadəçinin yazdığı 20 sözdən ibarət sualı hesablamaq**
      Real sorğuda 20 sözlük sualın arxasında 1500 tokenlik system prompt, 3000 tokenlik RAG konteksti, çoxaddımlı tool calling və uğursuz retry-lar dayanır. Xərci həmişə tam sorğu zənciri üzrə hesabla.

      **4. Sabit aylıq qiymətlə (10 USD/ay) tam "limitsiz" (unlimited) istifadə vermək**
      Avtomatik skript qoşan tək bir "power user" ayda 500 USD-lik token işlədib bütün digər müştərilərin gəlirini sıfırlaya bilər. Həmişə aydın kvota (rate limit / fair-use cap) və ya pilləli tarif tətbiq et.
  - id: tradeoffs
    kind: tradeoffs
    title: "Mühəndislik və Məhsul seçimləri"
    body: |
      - **Hazır API vs Open-Weights Self-Hosting:** Aşağı və orta trafikdə (ayda bir neçə min sorğu) hazır API (OpenAI, Anthropic, Gemini) yalnız işlətdiyin token qədər pul alır. 24/7 işləyən xüsusi GPU serveri (300–1500 USD/ay) isə gecə heç kim sorğu göndərməyəndə də pul yazır. Self-hosting yalnız yüksək, sabit trafikdə və ya sərt data-rezidentlik (məlumatın ölkədən/şirkətdən çıxmaması) tələbində sərfəli olur.
      - **Dəqiqlik vs Xərc (Model Routing):** Sorğuların 80%-i sadədir və ucuz kiçik modellə həll olunur; yalnız 20% mürəkkəb sorğuları bahalı böyük modelə yönləndirmək (model routing) keyfiyyəti saxlayaraq unit cost-u 60%–75% azalda bilər.
