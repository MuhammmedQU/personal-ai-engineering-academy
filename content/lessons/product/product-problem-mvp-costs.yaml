          text: "Mobil tətbiq, SSO və 12 dildə tərcümə hazır olana qədər heç bir müştəriyə göstərməmək"
          feedback: "Bunlar MVP üçün klassik non-goal-lardır."
      answer: b
      explanation: "MVP mərhələsində əsas risk 'modeli qura bilərikmi?' yox, 'bu problemi həll edən məhsulu istifadə edib pul ödəyəcəklərmi?' sualıdır. Hazır API bu riski ən sürətli və ucuz yoxlamaq yoludur."
