          avg_in_tokens: int,
          avg_out_tokens: int,
          price_in_per_1m: float,
          price_out_per_1m: float,
          fixed_infra_usd: float,
      ) -> dict[str, float]:
          # TODO: aylıq LLM xərci, ümumi xərc və istifadəçi başına xərci hesabla
          pass
    tests:
      - name: "200 istifadəçili B2B ssenarisini dəqiq hesablayır"
        code: |
          res = estimate_monthly_unit_cost(
              users=200,
              queries_per_user=150,
              avg_in_tokens=4000,
              avg_out_tokens=500,
              price_in_per_1m=2.50,
              price_out_per_1m=10.00,
              fixed_infra_usd=120.0,
          )
          assert res == {
              "llm_cost_usd": 450.0,
              "total_usd": 570.0,
              "cost_per_user_usd": 2.85,
          }, f"Alınan: {res}"
      - name: "Sıfır sorğu olduqda yalnız sabit infrastruktur xərci bölünür"
        code: |
          res = estimate_monthly_unit_cost(100, 0, 1000, 200, 2.0, 8.0, 50.0)
          assert res == {"llm_cost_usd": 0.0, "total_usd": 50.0, "cost_per_user_usd": 0.5}
      - name: "Səhv və ya mənfi parametrlər ValueError qaldırır"
        code: |
          for bad_args in [
              (0, 10, 100, 100, 1.0, 1.0, 10.0),
              (-5, 10, 100, 100, 1.0, 1.0, 10.0),
              (10, -1, 100, 100, 1.0, 1.0, 10.0),
              (10, 10, 100, 100, 1.0, 1.0, -20.0),
          ]:
              try:
                  estimate_monthly_unit_cost(*bad_args)
                  assert False, f"ValueError qaldırılmalı idi: {bad_args}"
              except ValueError:
                  pass
    solution: |
      def estimate_monthly_unit_cost(
          users: int,
          queries_per_user: int,
          avg_in_tokens: int,
          avg_out_tokens: int,
          price_in_per_1m: float,
          price_out_per_1m: float,
          fixed_infra_usd: float,
      ) -> dict[str, float]:
          if users <= 0:
              raise ValueError("users must be > 0")
          if any(
              x < 0
              for x in [
                  queries_per_user,
                  avg_in_tokens,
                  avg_out_tokens,
                  price_in_per_1m,
                  price_out_per_1m,
                  fixed_infra_usd,
              ]
          ):
              raise ValueError("parameters cannot be negative")

          total_queries = users * queries_per_user
          per_query = (
              (avg_in_tokens / 1_000_000.0) * price_in_per_1m
              + (avg_out_tokens / 1_000_000.0) * price_out_per_1m
          )
          llm_cost = total_queries * per_query
          total = llm_cost + fixed_infra_usd
          per_user = total / users

          return {
              "llm_cost_usd": round(float(llm_cost), 2),
              "total_usd": round(float(total), 2),
              "cost_per_user_usd": round(float(per_user), 4),
          }
    explanation: |
      Funksiya əvvəlcə biznes baxımından mənasız girişləri (`users <= 0`, mənfi qiymət/token) rədd edir, sonra həm dəyişən LLM xərcini, həm də sabit infrastruktur yükünü birləşdirərək 1 istifadəçinin maya dəyərini tapır.
  - id: ex-prodmvp-margin-numeric
    type: numeric
    title: "İstifadəçi başına aylıq maya dəyərini (Unit Cost) hesabla"
    prompt: |
      Bir AI startapının **500 aktiv istifadəçisi** var.
      - Hər istifadəçi ayda **100 sorğu** göndərir.
      - Hər sorğunun orta LLM xərci **0.02 USD** (2 sent) təşkil edir.
      - Aylıq sabit server və verilənlər bazası xərci **250 USD**-dir.

      1 aktiv istifadəçiyə düşən ümumi aylıq maya dəyəri (`cost_per_user_usd`) neçə ABŞ dollarıdır?
    skills: [product-mvp-economics]
    category: math
    difficulty: 1
    answer: 2.5
    tolerance: 0.01
    unit: "USD"
    hints:
      - "Bir istifadəçinin aylıq LLM xərci: 100 sorğu × 0.02 USD = 2.00 USD."
      - "Bir istifadəçiyə düşən sabit server xərci: 250 USD / 500 istifadəçi = 0.50 USD."
      - "Cəmi = 2.00 + 0.50"
    explanation: "500 istifadəçinin ümumi LLM xərci $500 \\times 100 \\times 0.02 = \\$1000$. Sabit xərclə birlikdə ümumi xərc $\\$1000 + \\$250 = \\$1250$. İstifadəçi başına maya dəyəri $\\$1250 / 500 = \\$2.50$."
  - id: ex-prodmvp-mom-test-audit
    type: multi
    title: "Problem Discovery: 'The Mom Test' meyarlarına uyğun müsahibə suallarını seç"
    prompt: |
      Hüquqşünaslar üçün müqavilə yoxlayan AI aləti qurmaq istəyirsən. Müştəri müsahibəsində **qərəzsiz, keçmiş faktlara əsaslanan** (The Mom Test qaydalarına uyğun) suallar hansılardır? Doğru olanların hamısını seç.
    skills: [product-discovery]
    category: concept
    difficulty: 1
    hints:
      - "Gələcək fərziyyələr ('Alardınızmı?', 'Bəyənərdinizmi?') haqqında suallar yalançı kompliment yaradır."
      - "Keçmişdə baş vermiş konkret hadisəni, sərf olunan vaxtı və hazırda ödənilən pulu soruşan sualları seç."
    options:
      - id: a
        text: "Keçən həftə sonuncu müqaviləni yoxlayanda hansı addımlar nə qədər vaxtınızı aldı və hansı alətlərdən istifadə etdiniz?"
        feedback: "Doğrudur! Keçmişdə baş vermiş konkret iş axınını və real vaxt sərfini öyrənir."
      - id: b
        text: "Biz süni intellektlə müqavilə yoxlayan möhtəşəm tətbiq qururuq — hazır olanda ayda 50 USD ödəyib alardınızmı?"
        feedback: "Xeyr — bu həm yönləndirici tərifdir (pitch), həm də gələcək fərziyyə soruşur."
      - id: c
        text: "Bu problemi həll etmək üçün indiyə qədər hansı proqramları sınamısınız və ya nə qədər büdcə ayırmısınız?"
        feedback: "Doğrudur! Əgər müştəri indiyə qədər heç bir həll axtarmayıbsa, problem onun üçün prioritet olmaya bilər."
      - id: d
        text: "Sizcə süni intellekt gələcəkdə hüquq sahəsini dəyişəcəkmi?"
        feedback: "Xeyr — ümumi fəlsəfi fikir soruşur, konkret məhsul ehtiyacını sübut etmir."
    answers: [a, c]
    explanation: "'The Mom Test' qaydasına görə yalnız keçmiş davranış, mövcud iş axını və artıq xərclənən vaxt/büdcə haqqında suallar real problem siqnalı verir."
