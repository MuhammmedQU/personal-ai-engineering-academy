    - id: q-prodmvp-build-vs-api
      type: mcq
      title: "MVP mərhələsində Build vs API qərarı"
      prompt: "Yeni yaranmış 2 nəfərlik komanda müştəri rəylərini mövzulara ayıran B2B məhsul ideyasını ilk 15 müştəri ilə yoxlamaq istəyir. Ən rasional ilk texniki addım hansıdır?"
      skills: [product-discovery, product-mvp-economics]
      category: llm-architecture
      options:
        - id: a
          text: "İlk 3 ay ərzində 50,000 sətir data toplayıb sıfırdan öz 7B parametrli modelini fine-tune etmək və GPU klasteri icarəyə götürmək"
          feedback: "Xeyr — hələ müştəri dəyəri təsdiqlənməmiş ağır model öyrətmək və 24/7 GPU saxlamaq büdcəni və vaxtı yandırır."
        - id: b
          text: "Hazır LLM API + strukturlaşdırılmış JSON çıxışı ilə 1 həftəyə minimal MVP qurub, 15 müştərinin real istifadəsini və ödəmə istəyini ölçmək"
          feedback: "Doğrudur. Hazır API ilkin sabit xərci sıfıra endirir və hipotezi günlər içində real istifadəçilərlə yoxlamağa imkan verir."
