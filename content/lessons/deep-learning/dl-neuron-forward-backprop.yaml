          # TODO: max(0.0, z)
          pass


      def neuron_forward_and_grads(
          x: float, w: float, b: float, y_true: float
      ) -> tuple[float, float, float]:
          # TODO: (loss, grad_w, grad_b) hesabla və qaytar
          pass
    tests:
      - name: Aktiv ReLU zonasında (z > 0) loss və gradientlər
        code: |
          loss, gw, gb = neuron_forward_and_grads(x=2.0, w=1.5, b=0.5, y_true=5.0)
          assert abs(loss - 2.25) < 1e-9, f"loss 2.25 olmalı idi, alınan {loss}"
          assert abs(gw - (-6.0)) < 1e-9, f"grad_w -6.0 olmalı idi, alınan {gw}"
          assert abs(gb - (-3.0)) < 1e-9, f"grad_b -3.0 olmalı idi, alınan {gb}"
      - name: Ölü ReLU zonasında (z <= 0) gradientlər sıfırlanır
        code: |
          assert relu(-4.5) == 0.0 and relu(3.2) == 3.2
          loss, gw, gb = neuron_forward_and_grads(x=2.0, w=-2.0, b=1.0, y_true=5.0)
          # z = -3.0 -> a = 0.0 -> loss = (0 - 5)^2 = 25.0, amma ReLU'(-3) = 0 olduğu üçün grad=0
          assert abs(loss - 25.0) < 1e-9, f"loss 25.0 olmalı idi, alınan {loss}"
          assert gw == 0.0 and gb == 0.0, f"z <= 0 üçün gradientlər 0 olmalıdır: {(gw, gb)}"
      - name: Proqnoz hədəfə tam bərabər olduqda loss=0 və grad=0
        code: |
          loss, gw, gb = neuron_forward_and_grads(x=3.0, w=2.0, b=-1.0, y_true=5.0)
          assert abs(loss) < 1e-9 and abs(gw) < 1e-9 and abs(gb) < 1e-9
    solution: |
      def relu(z: float) -> float:
          return float(z) if z > 0.0 else 0.0


      def neuron_forward_and_grads(
          x: float, w: float, b: float, y_true: float
      ) -> tuple[float, float, float]:
          z = w * x + b
          a = relu(z)
          loss = (a - y_true) ** 2
          dL_da = 2.0 * (a - y_true)
          da_dz = 1.0 if z > 0.0 else 0.0
          dL_dz = dL_da * da_dz
          grad_w = dL_dz * x
          grad_b = dL_dz
          return loss, grad_w, grad_b
    explanation: |
      Funksiya PyTorch-un `autograd` mühərrikinin tək neyron üçün etdiyi işi açıq şəkildə icra edir: əvvəlcə irəli keçiddə $z, a, L$ hesablanır, sonra lokal törəmələr sağdan sola bir-birinə vurulur.
