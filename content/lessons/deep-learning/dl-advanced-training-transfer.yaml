id: dl-advanced-training-transfer
track: deep-learning
module: dl-architectures
title: "Advanced PyTorch — Transfer Learning, LR Warmup, Gradient Clipping və Sabit Training"
summary: "Müasir dərin neyron şəbəkələri və Transformer-ləri real GPU məhdudiyyətləri altında necə öyrətməyi mənimsəyəcəksən: Transfer Learning və backbone dondurma, Linear Warmup + Cosine Annealing, Gradient Norm Clipping, Gradient Accumulation, Mixed Precision (AMP) və Early Stopping + Checkpointing."
level: advanced
estimated_minutes: [55, 75]
prerequisites: [dl-attention-transformers]
next: null
skills: [dl-training-loop, dl-architectures, dl-backprop]
objectives:
  - "Pretrained modeli yeni tapşırığa uyğunlaşdırarkən backbone-u dondurmaq (`requires_grad = False`), yeni head öyrətmək və kiçik learning rate ilə fine-tuning aparmaq"
  - "Gradient Norm Clipping düsturunu ($\\mathbf{g} \\leftarrow \\mathbf{g} \\cdot \\frac{c}{\\max(c, \\|\\mathbf{g}\\|_2)}$) həm əllə, həm də kodda tətbiq etmək"
  - "Linear Warmup + Cosine Annealing cədvəlini, Gradient Accumulation ilə effektiv batch ölçüsünü ($B_{\\text{eff}} = B_{\\text{micro}} \\times K$) və Mixed Precision (`torch.amp.autocast`) mexanizmini qurmaq"
  - "Validation loss üzərində Early Stopping və yalnız ən yaxşı modeli (`best_val_loss`) saxlayan Checkpointing məntiqini yazmaq"
why_it_matters: |
  Real mühəndislikdə heç kim milyonlarla parametrli görmə və ya dil modelini kiçik şirkət datası üzərində sıfırdan (təsadüfi çəkilərlə) öyrətmir — bu həm minlərlə dollar GPU xərci tələb edər, həm də bir neçə min nümunədə dərhal overfit olar. Bunun əvəzinə **Transfer Learning (Fine-Tuning)** tətbiq edilir.

  Bundan əlavə, böyük modelləri öyrədərkən üç klassik maneə çıxır:
  1. İlk addımlarda qradiyentlər partlayır və loss `NaN` olur (**Warmup** və **Gradient Clipping** lazımdır).
  2. Böyük batch ölçüsü tək GPU-nun VRAM yaddaşına yerləşmir (**Gradient Accumulation** və **Mixed Precision / BF16** lazımdır).
  3. Model gecə boyu öyrənərkən 8-ci epoxada ən yaxşı nəticəni verib 20-ci epoxada pozulur (**Best Checkpointing** və **Early Stopping** lazımdır).
terms:
  - term: Transfer Learning & Fine-Tuning
    definition: "Böyük ümumi datada əvvəlcədən öyrədilmiş (pretrained) modelin gövdəsini (backbone) götürüb, yalnız sonuncu təsnifat/reqressiya başlığını (head) yeni hədəf tapşırığa uyğunlaşdırmaq."
  - term: Backbone Freezing
    definition: "Pretrained qatların parametrlərində `param.requires_grad = False` təyin edərək həmin çəkilərin qradiyent hesabını və yenilənməsini dayandırmaq."
  - term: Gradient Norm Clipping
    definition: "Qradiyent vektorunun $L_2$ norması verilmiş $c$ (`max_norm`) həddini aşdıqda, vektorun istiqamətini saxlayıb uzunluğunu $c$-yə qədər kiçiltmək: $\\mathbf{g} \\leftarrow \\mathbf{g} \\cdot \\frac{c}{\\max(c, \\|\\mathbf{g}\\|_2)}$."
  - term: Learning Rate Warmup
    definition: "Training-in ilk $N_{\\text{warmup}}$ addımında learning rate-i $0$-dan hədəf $\\eta_{\\max}$ dəyərinə qədər xətti artırmaq; Adam/Transformer-in ilk addımlarda dağılmasının qarşısını alır."
  - term: Gradient Accumulation
    definition: "`optimizer.step()` və `zero_grad()` çağırmazdan əvvəl $K$ ardıcıl micro-batch üzrə `loss.backward()` çağıraraq qradiyentləri toplamaq; VRAM artırmadan böyük batch-i simulyasiya edir."
  - term: Mixed Precision (AMP — Automatic Mixed Precision)
    definition: "Matris vurmalarını sürətli və az yaddaş tutan 16-bit (`float16` / `bfloat16`) formatında, həssas cəmləmə və çəki yeniləmələrini isə 32-bit (`float32`) formatında aparmaq."
  - term: Early Stopping & Best Checkpointing
    definition: "Hər epoxada validation loss-u izləyərək yalnız yeni minimum tapıldıqda model çəkilərini diskə yazmaq və $p$ (`patience`) epoxa ərzində yaxşılaşma olmadıqda training-i dayandırmaq."
sections:
  - id: transfer-clipping-and-amp
    kind: explanation
    title: "Transfer Learning, Warmup, Gradient Clipping və VRAM optimallaşdırması"
    body: |
      ### 1. Transfer Learning və 2 Mərhələli Fine-Tuning Strategiyası

      Təsəvvür et ki, əlində yalnız $1\,500$ tibbi rentgen şəkli və ya $2\,000$ Azərbaycan dilində müştəri rəyi var. Sıfırdan 100 milyon parametrli model öyrətsən, model 2 epoxaya bütün datanı əzbərləyəcək.

      **Düzgün Transfer Learning ardıcıllığı:**
      1. **Pretrained modeli yüklə** (məsələn, ImageNet-də öyrədilmiş `ResNet` / `ViT` və ya böyük mətndə öyrədilmiş `RoBERTa`).
      2. **Backbone-u dondur (`requires_grad = False`):** Gövdə artıq kənarları, formaları və ya dil sintaksisini bilir.
      3. **Sonuncu qatı (Task Head) dəyiş və öyrət:** Köhnə 1000-sinifli çıxış qatını öz tapşırığının sinif sayına uyğun yeni təsadüfi `nn.Linear(d_model, num_classes)` ilə əvəz et. Yalnız bu yeni başlığı orta learning rate ($\eta \approx 10^{-3}$) ilə bir neçə epoxa öyrət.
      4. **(İxtiyari) Unfreeze & Fine-Tune:** Başlıq sabitləşdikdən sonra gövdənin son bloklarını aç (`requires_grad = True`) və **çox kiçik learning rate** ($\eta \approx 10^{-5}$) ilə bütün modeli incə tənzimlə.

      > **Niyə əvvəlcə dondururuq?** Yeni başlığın çəkiləri başlanğıcda tam təsadüfidir və böyük xəta qradiyentləri yaradır. Gövdəni dondurmasan, bu təsadüfi qradiyentlər ilk addımlardaca gövdədəki qiymətli pretrained bilikləri dağıdar (**catastrophic forgetting**).

      ---

      ### 2. Learning Rate Schedules: Linear Warmup + Cosine Annealing

      Transformer-ləri `AdamW` optimizatoru ilə öyrədərkən ilk addımlarda birbaşa yüksək learning rate vermək təhlükəlidir: training-in 1-ci addımında `AdamW`-nin ikinci moment təxmini ($v_t$ — qradiyentlərin kvadratlarının hərəkətli ortası) hələ formalaşmayıb və LayerNorm statistikaları qeyri-sabitdir.

      Buna görə iki mərhələli cədvəl istifadə olunur:
      - **Linear Warmup ($t \le T_{\text{warmup}}$):** Learning rate sıfırdan $\eta_{\max}$-a qədər xətti qalxır:
        $$\eta_t = \eta_{\max} \cdot \frac{t}{T_{\text{warmup}}}$$
      - **Cosine Annealing ($t > T_{\text{warmup}}$):** $\eta_t$ kosinus əyrisi ilə hamar şəkildə $\eta_{\min}$-ə enir.

      ---

      ### 3. Gradient Norm Clipping: Partlayan qradiyentlərin cilovlanması

      Bəzi çətin batch-lərdə loss kəskin sıçrayır və qradiyent vektoru $\mathbf{g}$ həddindən artıq böyüyür (**exploding gradients**). Tək bir belə addım modelin həftələrlə öyrəndiyi çəkiləri poza bilər.

      **Gradient Norm Clipping** (`torch.nn.utils.clip_grad_norm_`) bütün parametrlərin qradiyentlərini vahid $\mathbf{g}$ vektoru kimi götürür, onun $L_2$ normasını ($\|\mathbf{g}\|_2 = \sqrt{\sum_i g_i^2}$) hesablayır və norma $c$ (`max_norm`, adətən `1.0`) həddini aşdıqda vektoru kiçildir:

      $$\mathbf{g}_{\text{clipped}} = \mathbf{g} \cdot \frac{c}{\max(c, \|\mathbf{g}\|_2)}$$

      Simvollar:
      - $\mathbf{g}$ — orijinal qradiyent vektoru
      - $\|\mathbf{g}\|_2 = \sqrt{\sum_i g_i^2}$ — qradiyentin Evklid ($L_2$) uzunluğu
      - $c > 0$ — icazə verilən maksimum norma həddi (`max_norm`)
      - Diqqət et: Əgər $\|\mathbf{g}\|_2 \le c$ olarsa, kəsr $\frac{c}{c} = 1$ olur və qradiyent **dəyişmir**. Əgər $\|\mathbf{g}\|_2 > c$ olarsa, qradiyentin **istiqaməti qorunur**, uzunluğu isə tam $c$-yə bərabərləşir!

      ---

      ### 4. Gradient Accumulation, Mixed Precision (AMP) və Early Stopping

      - **Gradient Accumulation:** Tutaq ki, sabit öyrənmə üçün $B_{\text{eff}} = 64$ batch ölçüsü lazımdır, amma GPU yaddaşına (VRAM) yalnız $B_{\text{micro}} = 16$ yerləşir. PyTorch-da `loss.backward()` qradiyentləri `.grad` sahəsinə **toplayır (+=)**. Ona görə hər micro-batch-də loss-u $K = 4$-ə bölüb `backward()` çağırırıq, `optimizer.step()` və `optimizer.zero_grad()` əməliyyatlarını isə yalnız **hər 4 addımdan bir** icra edirik!
      - **Mixed Precision (`torch.amp.autocast`):** Matris vurmalarını `bfloat16` / `float16` ilə icra edərək aktivasiya yaddaşını $\sim 2\times$ azaldır və Tensor Core GPU-larda sürəti $2\text{--}3\times$ artırır.
      - **Checkpointing & Early Stopping:** Sonuncu epoxanın modeli həmişə ən yaxşı model deyil. Yalnız `val_loss < best_val_loss` olduqda `torch.save(model.state_dict(), "best.pt")` çağırırıq; ardıcıl `patience` epoxa ərzində yeni rekord qırılmazsa, dövrü dayandırırıq.
  - id: surgery-and-speed-limit-analogy
    kind: analogy
    title: "Mental model: Təcrübəli cərrahın komandası və dağ yolunda sürət həddi"
    body: |
      - **Transfer Learning (Backbone Freezing):**
        Xəstəxanaya 20 illik təcrübəsi olan baş həkim (**pretrained backbone**) və yeni məzun olmuş stajor (**təsadüfi task head**) gəlir. İlk həftə baş həkimin biliklərini dəyişməyə çalışmırsan (**freeze**) — yalnız stajora baş həkimin hesabatlarını oxuyub düzgün yekun qərar çıxarmağı öyrədirsən. Stajor işi öyrənəndən sonra hər ikisi birlikdə incə uyğunlaşma (**low-LR fine-tuning**) keçir.

      - **Gradient Norm Clipping:**
        Sükanın istiqaməti (**qradiyentin yönü**) avtomobilin hara dönəcəyini, qaz pedalının sıxılması (**qradiyentin norması $\|\mathbf{g}\|_2$**) isə nə qədər irəli atılacağını göstərir. Dağ döngəsində birdən ayağın qaza ilişsə ($\|\mathbf{g}\|_2 = 50$), avtomobil uçuruma düşər. **Gradient Clipping** sükanın bucağına toxunmur, sadəcə sürəti maksimum təhlükəsiz həddə ($c = 1.0$) endirir.
  - id: advanced-training-loop-diagram
    kind: diagram
    title: "Production-səviyyəli PyTorch Training və Checkpointing Axını"
    body: |
      ```mermaid
      flowchart TD
        START["Pretrained Model: Backbone Freeze, Head Trainable"] --> FWD["Autocast (BF16/FP16): loss = criterion(model(x), y) / accum_steps"]
        FWD --> BWD["loss.backward() (qradiyentlər toplanır)"]
        BWD --> ACC{"step % accum_steps == 0?"}
        ACC -- "Xeyr" --> FWD
        ACC -- "Bəli" --> CLIP["clip_grad_norm_(model.parameters(), max_norm=1.0)"]
        CLIP --> OPT["optimizer.step() -> scheduler.step() -> optimizer.zero_grad()"]
        OPT --> VAL["Epoch sonu: Validation Loss hesabla"]
        VAL --> BEST{"val_loss < best_loss?"}
        BEST -- "Bəli" --> SAVE["best_loss = val_loss; bad_epochs = 0; torch.save(best.pt)"]
        BEST -- "Xeyr" --> INC["bad_epochs += 1"]
        INC --> STOP{"bad_epochs >= patience?"}
        STOP -- "Bəli" --> END["Early Stop! best.pt çəkilərini geri yüklə"]
        STOP -- "Xeyr" --> FWD
        SAVE --> FWD
      ```

      Bu sxem müasir LLM və CV fine-tuning skriptlərinin (Hugging Face `Trainer`, PyTorch Lightning) daxildə icra etdiyi standart skeletdir.
  - id: worked-clipping-and-early-stop
    kind: worked_example
    title: "Addım-addım rəqəmlərlə: Gradient Norm Clipping və Early Stopping"
    body: |
      ### Hissə A: Gradient Norm Clipping hesabı

      Tutaq ki, modelin iki parametrinin qradiyent vektoru $\mathbf{g} = [3.0, -4.0]$ alınıb və icazə verilən maksimum norma həddi $c = 2.5$-dir.

      1. **Orijinal $L_2$ normanı hesablayırıq:**
         $$\|\mathbf{g}\|_2 = \sqrt{3.0^2 + (-4.0)^2} = \sqrt{9 + 16} = \sqrt{25} = 5.0$$
      2. **Həddi yoxlayırıq:** $\|\mathbf{g}\|_2 = 5.0 > c = 2.5$ olduğu üçün kiçiltmə əmsalı (scale factor) tapılır:
         $$\text{scale} = \frac{c}{\|\mathbf{g}\|_2} = \frac{2.5}{5.0} = 0.5$$
      3. **Kəsilmiş (clipped) qradiyent vektoru:**
         $$\mathbf{g}_{\text{clipped}} = 0.5 \cdot [3.0, -4.0] = [1.5, -2.0]$$
      4. **Yoxlama:** Yeni vektorun norması $\sqrt{1.5^2 + (-2.0)^2} = \sqrt{2.25 + 4.0} = \sqrt{6.25} = 2.5 = c$, istiqaməti isə orijinal vektorla eynidir!

      *(Əgər $c = 10.0$ olsaydı, $\|\mathbf{g}\|_2 = 5.0 \le 10.0$ olduğu üçün $\mathbf{g}_{\text{clipped}} = [3.0, -4.0]$ olduğu kimi qalacaqdı.)*

      ---

      ### Hissə B: Early Stopping və Patience izlənməsi

      Tutaq ki, `patience = 3` seçmişik və 6 epoxa üzrə validation loss tarixçəsi belədir:
      `val_losses = [0.90, 0.75, 0.60, 0.62, 0.61, 0.65]`

      | Epoxa | `val_loss` | Cari ən yaxşı (`best_loss`) | Yaxşılaşma oldu? | `bad_epochs` sayğacı | Qərar |
      |---|---|---|---|---|---|
      | 1 | `0.90` | `0.90` | Bəli (ilk) | `0` | `best.pt` saxla |
      | 2 | `0.75` | `0.75` | Bəli (`0.75 < 0.90`) | `0` | `best.pt` yenilə |
      | 3 | `0.60` | `0.60` | Bəli (`0.60 < 0.75`) | `0` | `best.pt` yenilə |
      | 4 | `0.62` | `0.60` | Xeyr (`0.62 >= 0.60`) | `1` | Davam et |
      | 5 | `0.61` | `0.60` | Xeyr (`0.61 >= 0.60`) | `2` | Davam et |
      | 6 | `0.65` | `0.60` | Xeyr (`0.65 >= 0.60`) | `3` (`== patience`) | **EARLY STOP!** (Epoxa 3-dəki `best.pt` götürülür) |

      Diqqət et: 5-ci epoxada loss `0.62`-dən `0.61`-ə düşsə də, **rekord olan `0.60`-dan yaxşı olmadığı üçün** `bad_epochs` sıfırlanmır, `2` olur!
  - id: advanced-pytorch-code
    kind: code
    title: "Kod: Saf Python-da Clipping & Early Stopping və PyTorch Fine-Tuning Şablonu"
    body: |
      Əvvəlcə qradiyent normasının kəsilməsi və early stopping qərarını saf Python-da yazaq:

      ```python
      import math


      def clip_grad_norm(grads: list[float], max_norm: float) -> tuple[list[float], float]:
          """Clip gradient vector by L2 norm without mutating input."""
          if max_norm <= 0:
              raise ValueError("max_norm must be positive")
          l2_norm = math.sqrt(sum(g * g for g in grads))
          if l2_norm > max_norm and l2_norm > 0.0:
              scale = max_norm / l2_norm
              return [g * scale for g in grads], l2_norm
          return list(grads), l2_norm


      def should_early_stop(val_losses: list[float], patience: int) -> bool:
          """Return True if no improvement over running minimum for `patience` epochs."""
          if not val_losses:
              return False
          best = val_losses[0]
          bad_epochs = 0
          for loss in val_losses[1:]:
              if loss < best:
                  best = loss
                  bad_epochs = 0
              else:
                  bad_epochs += 1
                  if bad_epochs >= patience:
                      return True
          return False
      ```

      **PyTorch-da Transfer Learning + AMP + Gradient Accumulation + Clipping Şablonu:**

      ```python
      import torch
      import torch.nn as nn

      # 1. Backbone-u dondur, yalnız yeni head-i aktiv saxla
      for param in model.backbone.parameters():
          param.requires_grad = False
      model.head = nn.Linear(in_features=768, out_features=2)

      # Yalnız requires_grad=True olan parametrləri optimizatora ötür
      trainable_params = [p for p in model.parameters() if p.requires_grad]
      optimizer = torch.optim.AdamW(trainable_params, lr=3e-4, weight_decay=0.01)

      accum_steps = 4
      max_norm = 1.0
      optimizer.zero_grad()

      for step, (inputs, targets) in enumerate(train_loader, start=1):
          # 2. Mixed Precision forward pass
          with torch.amp.autocast(device_type="cuda", dtype=torch.bfloat16):
              logits = model(inputs)
              # Qradiyentlər toplanacağı üçün loss-u accum_steps-ə bölürük
              loss = criterion(logits, targets) / accum_steps

          loss.backward()

          # 3. Hər accum_steps addımdan bir qradiyenti kəs və çəkiləri yenilə
          if step % accum_steps == 0:
              torch.nn.utils.clip_grad_norm_(trainable_params, max_norm=max_norm)
              optimizer.step()
              scheduler.step()
              optimizer.zero_grad()
      ```
  - id: advanced-training-mistakes
    kind: mistakes
    title: "Ən çox edilən səhvlər və gizli bug-lar"
    body: |
      **1. Gradient Accumulation zamanı loss-u `accum_steps`-ə bölməyi unutmaq**
      `loss.backward()` qradiyentləri topladığı üçün 4 micro-batch üzrə bölmədən toplasan, effektiv qradiyent $4\times$ böyüyür — bu isə gizlicə learning rate-i $4\times$ artırmaq deməkdir! **Düzəliş:** `loss = raw_loss / accum_steps` yaz.

      **2. `clip_grad_norm_`-u `optimizer.step()`-dən SONRA çağırmaq**
      `optimizer.step()` artıq çəkiləri partlamış qradiyentlərlə yenilədikdən sonra qradiyenti kəsməyin heç bir mənası yoxdur! **Düzəliş:** Sıra həmişə belə olmalıdır: `loss.backward()` $\to$ `clip_grad_norm_()` $\to$ `optimizer.step()` $\to$ `optimizer.zero_grad()`.

      **3. Early Stopping-də əvvəlki epoxaya nisbətən kiçik azalmanı "rekord" saymaq**
      Əgər loss tarixçəsi `0.50 -> 0.80 -> 0.79 -> 0.78 -> 0.77` olarsa, loss hər addımda əvvəlki epoxadan azalsa da, **heç biri `0.50` rekordunu yeniləmir**. `bad_epochs` həmişə bütün tarixçədəki **qlobal minimum (`best_loss`)** ilə müqayisə edilməlidir.

      **4. Early Stopping dayandıqda sonuncu (overfit olmuş) epoxanın çəkilərini saxlamaq**
      `patience=5` bitəndə model artıq 5 epoxadır ki, pisləşir. Dayananda cari yaddaşdakı modeli yox, diskə yazılmış `best_model.pt` çəkilərini geri yükləməlisən (`model.load_state_dict(torch.load("best.pt"))`).
  - id: training-tradeoffs
    kind: tradeoffs
    title: "Mühəndis seçimləri: Full Fine-Tuning vs Freeze vs LoRA (PEFT)"
    body: |
      | Yanaşma | Öyrədilən parametr payı | VRAM tələbi | Overfitting riski | Nə vaxt seçməli? |
      |---|---|---|---|---|
      | **Linear Probing (Backbone Frozen)** | $< 1\%$ (yalnız son qat) | Çox aşağı | Çox aşağı | Çox kiçik dataset ($< 2\,000$ nümunə), sürətli baseline |
      | **Full Fine-Tuning** | $100\%$ (bütün model) | Çox yüksək (bütün model üçün optimizer state) | Yüksək (kiçik datada) | Kifayət qədər böyük domain datası və güclü GPU olduqda |
      | **PEFT / LoRA (Low-Rank Adaptation)** | $0.1\% \text{--} 2\%$ (kiçik ranklı $A \cdot B$ adapterləri) | Aşağı | Aşağı | Milyardlarla parametrli LLM-ləri tək GPU-da öyrədəndə |

      **Praktik qayda:** Həmişə əvvəlcə dondurulmuş backbone üzərində yalnız yeni başlığı (Linear Probing) öyrədib sürətli və ucuz baseline al; yalnız bundan sonra son blokları açaraq və ya LoRA ilə tam fine-tuning-ə keç.
