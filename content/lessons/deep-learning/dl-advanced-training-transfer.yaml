      explanation: "$\\|\\mathbf{g}\\|_2 = \\sqrt{36 + 64} = 10.0$. Kiçiltmə əmsalı $= 5.0 / 10.0 = 0.5$. Kəsilmiş vektor $[6.0 \\times 0.5, 8.0 \\times 0.5] = [3.0, 4.0]$, deməli 1-ci komponent $3.0$ olur."
    - id: q-dladv-effective-batch
      type: numeric
      title: "Gradient Accumulation ilə effektiv batch ölçüsü"
      prompt: |
        GPU yaddaşına hər addımda yalnız `micro_batch_size = 8` nümunə yerləşir.
        Əgər `gradient_accumulation_steps = 6` təyin etsək (hər 6 `backward()` addımından bir `optimizer.step()` çağırsaq), **effektiv batch ölçüsü ($B_{\text{eff}}$)** neçə olar?
      skills: [dl-training-loop]
      category: math
      answer: 48
      tolerance: 0.01
      hints:
        - "Effektiv batch ölçüsü bir `optimizer.step()` yeniləməsində iştirak edən bütün nümunələrin cəmidir."
        - "$B_{\\text{eff}} = B_{\\text{micro}} \\times K = 8 \\times 6$."
      explanation: "6 ardıcıl micro-batch (hər birində 8 nümunə) toplanıb tək bir çəki yeniləməsi etdiyi üçün effektiv batch ölçüsü $8 \\times 6 = 48$ olur."
    - id: q-dladv-clip-order
      type: mcq
      title: "Gradient Clipping harada çağırılmalıdır?"
      prompt: "PyTorch training dövründə `torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm)` funksiyası hansı iki əməliyyatın **arasında** çağırılmalıdır?"
      skills: [dl-training-loop, dl-backprop]
      category: production
      options:
        - id: a
          text: "`loss.backward()`-dan SONRA və `optimizer.step()`-dən ƏVVƏL"
          feedback: "Doğru! Qradiyentlər əvvəlcə `backward()` ilə hesablanmalı, sonra kəsilməli, sonda isə `optimizer.step()` kəsilmiş qradiyentlərlə çəkiləri yeniləməlidir."
        - id: b
          text: "`optimizer.step()`-dən SONRA və `optimizer.zero_grad()`-dan ƏVVƏL"
          feedback: "Yanlış — `optimizer.step()` artıq çəkiləri yeniləyib; bundan sonra qradiyenti kəsmək heç nəyi dəyişmir."
        - id: c
          text: "Forward pass-dan ƏVVƏL, hələ loss hesablanmamış"
          feedback: "Yanlış — `backward()` çağırılmamış `.grad` sahələrində cari batch-in qradiyenti yoxdur."
      answer: a
      explanation: "Qradiyentlər `loss.backward()` zamanı yaranır və `optimizer.step()` zamanı çəkilərə tətbiq edilir; ona görə clipping məhz bu ikisinin arasında icra edilməlidir."
    - id: q-dladv-why-freeze-first
      type: mcq
      title: "Niyə Transfer Learning-də əvvəlcə backbone dondurulur?"
      prompt: "Pretrained modelə yeni, təsadüfi çəkilərlə başladılmış təsnifat başlığı (`head`) əlavə etdikdə, niyə ilk epoxalarda gövdəni (`backbone`) dondurmaq (`requires_grad = False`) tövsiyə olunur?"
      skills: [dl-architectures, dl-training-loop]
      category: concept
      options:
        - id: a
          text: "Yeni başlığın təsadüfi çəkilərindən qaynaqlanan böyük başlanğıc qradiyentlərinin gövdədəki faydalı pretrained təsvirləri dağıtmasının (catastrophic forgetting) qarşısını almaq üçün"
          feedback: "Doğru! Təsadüfi başlıq ilk addımlarda çox böyük loss və xaotik qradiyent yaradır; gövdəni dondurmaq onu bu şokdan qoruyur."
        - id: b
          text: "Çünki PyTorch eyni anda 2-dən çox qatın qradiyentini hesablaya bilmir"
          feedback: "Xeyr — PyTorch yüzlərlə qatın qradiyentini hesablaya bilir."
        - id: c
          text: "Modelin inference zamanı diskdə tutduğu fayl ölçüsünü azaltmaq üçün"
          feedback: "Xeyr — `requires_grad = False` parametrləri silmir, onların sayını və fayl ölçüsünü dəyişmir."
      answer: a
      explanation: "Dondurulmuş backbone həm təsadüfi başlığın yaratdığı dağıdıcı qradiyentlərdən qorunur, həm də aktivasiya/qradiyent yaddaşına qənaət edərək başlığın sürətlə uyğunlaşmasını təmin edir."
exercises:
  - id: ex-dladv-clip-and-early-stop
    type: code
    title: "Gradient Norm Clipping və Early Stopping funksiyalarını yaz"
    prompt: |
      Standart Python (`math.sqrt`) ilə iki mühüm training köməkçi funksiyasını implementasiya et:

      1. `clip_grad_norm(grads: list[float], max_norm: float) -> tuple[list[float], float]`:
         - Əgər `max_norm <= 0` olarsa, `ValueError` qaldırır.
         - `grads` vektorunun Evklid ($L_2$) normasını hesablayır: $\|\mathbf{g}\|_2 = \sqrt{\sum g_i^2}$.
         - Əgər $\|\mathbf{g}\|_2 > \text{max\_norm}$ olarsa, hər elementi $\frac{\text{max\_norm}}{\|\mathbf{g}\|_2}$ əmsalına vurub yeni list qaytarır; əks halda `grads`-in dəyişməmiş kopyasını qaytarır.
         - Input `grads` list-ini **dəyişdirməməlidir** (mutate etmə).
         - Qaytarılan dəyər: `(clipped_grads, original_l2_norm)`.

      2. `should_early_stop(val_losses: list[float], patience: int) -> bool`:
         - Epoxalar üzrə `val_losses` siyahısını soldan sağa izləyir.
         - Yeni ciddi daha kiçik minimum (`loss < best_loss`) tapıldıqda `best_loss` yenilənir və uğursuz epoxa sayğacı (`bad_epochs`) `0`-a düşür.
         - Əgər `loss >= best_loss` olarsa, `bad_epochs` `1` artır.
         - Sayğac hər hansı nöqtədə `bad_epochs >= patience` həddinə çatarsa dərhal `True`, siyahı bitənə qədər çatmazsa (və ya siyahı boşdursa) `False` qaytarır.
    skills: [dl-training-loop, dl-backprop]
    category: python
    difficulty: 2
    hints:
      - "`l2_norm = math.sqrt(sum(g * g for g in grads))` hesabla. `l2_norm > max_norm` olduqda `scale = max_norm / l2_norm` ilə yeni list yarat."
      - "`should_early_stop` üçün `if not val_losses: return False`, sonra `best = val_losses[0]` və `bad = 0` götürüb `val_losses[1:]` üzərində dövr qur."
      - "`loss < best` olduqda `best = loss; bad = 0`, əks halda `bad += 1` və `if bad >= patience: return True` yoxla."
    starter_code: |
      import math


      def clip_grad_norm(grads: list[float], max_norm: float) -> tuple[list[float], float]:
          # TODO: max_norm <= 0 olduqda ValueError; (clipped_grads, original_l2_norm) qaytar
          return [], 0.0


      def should_early_stop(val_losses: list[float], patience: int) -> bool:
          # TODO: ardıcıl `patience` epoxa ərzində best_loss yenilənmədikdə True qaytar
          return False
    tests:
      - name: "clip_grad_norm: norma həddi aşdıqda kiçildir, aşmadıqda qoruyur"
        code: |
          raw = [3.0, -4.0]
          clipped, norm = clip_grad_norm(raw, max_norm=2.5)
          assert abs(norm - 5.0) < 1e-9, f"Orijinal norma 5.0 olmalıdır, alınan: {norm}"
          assert abs(clipped[0] - 1.5) < 1e-9 and abs(clipped[1] - (-2.0)) < 1e-9
          assert raw == [3.0, -4.0], "Input list mutasiya olunmamalıdır"

          clipped2, norm2 = clip_grad_norm([3.0, -4.0], max_norm=10.0)
          assert abs(norm2 - 5.0) < 1e-9
          assert clipped2 == [3.0, -4.0]
      - name: "clip_grad_norm: sıfır vektor və max_norm <= 0 yoxlaması"
        code: |
          c_zero, n_zero = clip_grad_norm([0.0, 0.0], max_norm=1.0)
          assert c_zero == [0.0, 0.0] and n_zero == 0.0
          raised = False
          try:
              clip_grad_norm([1.0], 0.0)
          except ValueError:
              raised = True
          assert raised, "max_norm <= 0 olduqda ValueError qaldırılmalıdır"
      - name: "should_early_stop: patience həddi və rekord yenilənməsi"
        code: |
          assert should_early_stop([0.90, 0.75, 0.60, 0.62, 0.61, 0.65], patience=3) is True
          assert should_early_stop([0.90, 0.75, 0.60, 0.62, 0.61], patience=3) is False
          assert should_early_stop([0.80, 0.85, 0.70, 0.75, 0.76], patience=2) is True
          assert should_early_stop([], patience=2) is False
    solution: |
      import math


      def clip_grad_norm(grads: list[float], max_norm: float) -> tuple[list[float], float]:
          if max_norm <= 0:
              raise ValueError("max_norm must be positive")
          l2_norm = math.sqrt(sum(g * g for g in grads))
          if l2_norm > max_norm and l2_norm > 0.0:
              scale = max_norm / l2_norm
              return [g * scale for g in grads], l2_norm
          return list(grads), l2_norm


      def should_early_stop(val_losses: list[float], patience: int) -> bool:
          if not val_losses:
              return False
          best = val_losses[0]
          bad_epochs = 0
          for loss in val_losses[1:]:
              if loss < best:
                  best = loss
                  bad_epochs = 0
              else:
                  bad_epochs += 1
                  if bad_epochs >= patience:
                      return True
          return False
    explanation: |
      `clip_grad_norm` $L_2$ normanı tapır və yalnız norma `max_norm`-dan böyük olduqda bütün komponentləri `max_norm / l2_norm` nisbətində kiçildir. `should_early_stop` isə indiyə qədərki ən kiçik `best` dəyəri izləyərək ardıcıl neçə epoxada rekord yenilənmədiyini sayır.
  - id: ex-dladv-transfer-order
    type: order
    title: "Transfer Learning və Fine-Tuning addımlarını düzgün ardıcıllıqla düz"
    prompt: |
      Kiçik domain datası üzərində pretrained modeli **Transfer Learning** ilə təhlükəsiz öyrətmək və ən yaxşı modeli seçmək üçün addımları **1-cidən sonuncuya** doğru sırala.
    skills: [dl-architectures, dl-training-loop]
    category: production
    difficulty: 2
    hints:
      - "Əvvəlcə pretrained model yüklənməli və gövdəsi (backbone) dondurulmalıdır ki, təsadüfi yeni başlıq onu pozmasın."
      - "Yeni başlığı öyrətdikdən sonra gövdəni açıb çox kiçik learning rate ilə fine-tune edirik, sonda isə ən yaxşı validation checkpoint-i yükləyirik."
    items:
      - id: step1
        text: "Pretrained modeli yüklə, backbone parametrlərini dondur (`requires_grad = False`) və çıxış qatını yeni Task Head ilə əvəz et"
      - id: step2
        text: "Yalnız yeni Task Head-i orta learning rate ilə bir neçə epoxa öyrət ki, təsadüfi çəkilər uyğunlaşsın"
      - id: step3
        text: "Backbone-un son bloklarını aç (`requires_grad = True`) və çox kiçik learning rate + warmup + gradient clipping ilə incə tənzimlə (fine-tune)"
      - id: step4
        text: "Early stopping dayandıqda ən aşağı validation loss göstərmiş checkpoint-i (`best.pt`) geri yüklə və test dəstində yoxla"
    answer: [step1, step2, step3, step4]
    explanation: |
      Bu 4 addımlı protokol (`Freeze & Replace Head` $\to$ `Warmup New Head` $\to$ `Low-LR Unfreeze Fine-Tune` $\to$ `Restore Best Checkpoint`) həm catastrophic forgetting-in, həm də son epoxadakı overfitting-in qarşısını alır.
