        Qradiyent vektoru $\mathbf{g} = [6.0, 8.0]$ və icazə verilən maksimum norma həddi `max_norm` $c = 5.0$-dir.
        Gradient Norm Clipping tətbiq edildikdən sonra vektorun **1-ci komponentinin ($g_0$)** yeni dəyəri neçə olacaq?
