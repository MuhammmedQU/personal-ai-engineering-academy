        - $Q \in \mathbb{R}^{10 \times 64}$
        - $K \in \mathbb{R}^{10 \times 64}$
        - $V \in \mathbb{R}^{10 \times 32}$

        Diqqət çəkiləri matrisi $A = \text{softmax}\!\left(\frac{QK^T}{\sqrt{d_k}}\right)$ və yekun çıxış $\text{Out} = A V$ matrislərinin ölçüləri (shapes) uyğun olaraq necədir?
      skills: [dl-architectures, matrices-shapes]
