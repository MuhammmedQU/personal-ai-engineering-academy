      options:
        - id: a
          text: "A: (64, 64) və Out: (64, 32)"
          feedback: "Xeyr — $Q (10 \\times 64)$ ilə $K^T (64 \\times 10)$ vurulduqda $64$ ölçüsü ixtisar olunur."
        - id: b
          text: "A: (10, 10) və Out: (10, 32)"
          feedback: "Doğru! $QK^T \\to (10, 64) \\times (64, 10) = (10, 10)$, sonra $A V \\to (10, 10) \\times (10, 32) = (10, 32)$."
        - id: c
          text: "A: (10, 64) və Out: (10, 64)"
          feedback: "Xeyr — $A$ matrisi hər tokenin digər tokenlərə diqqətini göstərən $(T, T) = (10, 10)$ kvadrat matrisdir."
