    - id: q-dlatt-why-sqrt-dk
      type: mcq
      title: "Niyə kökaltı d_k-ya bölürük?"
      prompt: "Scaled Dot-Product Attention düsturunda $QK^T$ hasilini $\\sqrt{d_k}$-ya bölməyin əsas riyazi məqsədi nədir?"
      skills: [dl-architectures, dl-forward-pass]
      category: concept
      options:
        - id: a
          text: "Böyük $d_k$ ölçülərində skalyar hasilin dispersiyasını sabit saxlamaq ki, softmax doyma (saturation) bölgəsinə düşüb qradiyentləri sıfırlamasın"
          feedback: "Doğru! Böyük skalyar hasillər softmax-ı 0 və 1 uclarına sıxışdırır, bu da backpropagation zamanı qradiyenti öldürür."
        - id: b
          text: "Matris vurmasının hesablama mürəkkəbliyini $O(T^2)$-dən $O(T)$-yə endirmək"
          feedback: "Xeyr — skalyar ədədə bölmək matris vurmasının asimptotik mürəkkəbliyini dəyişmir."
        - id: c
          text: "Gələcək tokenləri maskalamaq (causal masking)"
          feedback: "Xeyr — gələcək tokenlər $\\sqrt{d_k}$ ilə yox, yuxarı üçbucağa $-\\infty$ yazmaqla maskalanır."
      answer: a
      explanation: "$d_k$ artdıqca $q \\cdot k$ hasilinin dispersiyası $d_k$ qədər böyüyür. $\\sqrt{d_k}$-ya bölmək dispersiyanı yenidən $1$-ə qaytarır və softmax qradiyentlərini sağlam saxlayır."
    - id: q-dlatt-causal-mask
      type: mcq
      title: "Causal Masking necə tətbiq olunur?"
      prompt: "Avtoreqressiv (GPT tipli) Transformer-də $i$-ci tokenin gələcək $j > i$ tokenlərindən məlumat almaması üçün **Causal Mask** harada və necə tətbiq edilir?"
      skills: [dl-architectures, dl-forward-pass]
      category: llm-architecture
      options:
        - id: a
          text: "Softmax-dan ƏVVƏL, $j > i$ mövqelərindəki score dəyərlərinə $-\\infty$ (və ya çox kiçik mənfi ədəd, məs. `-1e9`) yazmaqla"
          feedback: "Doğru! $\\exp(-\\infty) = 0$ olduğu üçün softmax həmin mövqelərə tam $0.0$ çəki verir və qalan keçmiş mövqelərin cəmi $1.0$ olur."
        - id: b
          text: "Softmax-dan ƏVVƏL, $j > i$ mövqelərinə `0.0` yazmaqla"
          feedback: "Yanlış — $\\exp(0.0) = 1.0 > 0$ olduğu üçün gələcək tokenlər sıfırlanmır, əksinə müsbət diqqət çəkisi alır!"
        - id: c
          text: "Yekun $A V$ matris vurmasından sonra çıxış vektorunun yarısını silməklə"
          feedback: "Xeyr — $A V$ vurmasından sonra artıq gələcək tokenlərin dəyərləri keçmiş tokenlərlə qarışmış olur."
      answer: a
      explanation: "Softmax-da $0$ çəkisi almaq üçün giriş logit-i $0$ yox, $-\\infty$ olmalıdır ($\\exp(-\\infty) = 0$, halbuki $\\exp(0) = 1$)."
    - id: q-dlatt-block-components
