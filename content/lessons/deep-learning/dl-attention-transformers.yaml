exercises:
  - id: ex-dlatt-scaled-attention
    type: code
    title: "Saf Python-da Scaled Dot-Product Attention (normal və causal) yaz"
    prompt: |
      Yalnız Python standart kitabxanasından (`math.exp`, `math.sqrt`) istifadə edərək iki funksiyanı implementasiya et:

      1. `softmax_rows(matrix: list[list[float]]) -> list[list[float]]`:
         - 2D matrisin **hər bir sətrinə** müstəqil olaraq rəqəmsal dayanıqlı softmax ($\exp(x_j - \max) / \sum \exp(x_r - \max)$) tətbiq edir və yeni 2D list qaytarır.

      2. `scaled_dot_product_attention(Q, K, V, causal=False) -> list[list[float]]`:
         - `Q` və `K` ölçüsü `(seq_len, d_k)`, `V` ölçüsü `(seq_len, d_v)` olan 2D float siyahılarıdır.
         - $S_{i,j} = \frac{Q_i \cdot K_j}{\sqrt{d_k}}$ hesablayır.
         - Əgər `causal=True` olarsa, $j > i$ olan bütün gələcək mövqelərin diqqət çəkisi sıfır olmalıdır (bunun üçün softmax-dan əvvəl həmin mövqelərə `-1e9` və ya `-math.inf` yaza bilərsən).
         - Sətirlər üzrə softmax tətbiq edib alınan $(T \times T)$ çəki matrisini $V$ $(T \times d_v)$ matrisinə vuraraq $(T \times d_v)$ ölçülü yeni 2D list qaytarır.
    skills: [dl-architectures, matrices-shapes, dl-forward-pass]
    category: llm-architecture
    difficulty: 3
    hints:
      - "`softmax_rows` içində hər `row` üçün `m = max(row)`, `exps = [math.exp(v - m) for v in row]` və `s = sum(exps)` hesabla."
      - "`scale = math.sqrt(len(Q[0]))` tap. Hər `(i, j)` cütü üçün `causal and j > i` doğrudursa score-u `-1e9` (və ya `-math.inf`) et, əks halda `sum(Q[i][r] * K[j][r] for r in range(d_k)) / scale`."
      - "Yekun çıxışda `i`-ci sətir və `col`-cu sütun elementi `sum(weights[i][j] * V[j][col] for j in range(seq_len))` ifadəsidir."
    starter_code: |
      import math


      def softmax_rows(matrix: list[list[float]]) -> list[list[float]]:
          # TODO: hər sətir üzrə rəqəmsal dayanıqlı softmax hesabla
          return []


      def scaled_dot_product_attention(
          Q: list[list[float]],
          K: list[list[float]],
          V: list[list[float]],
          causal: bool = False,
      ) -> list[list[float]]:
          # TODO: softmax((Q @ K^T) / sqrt(d_k)) @ V (causal=True olduqda j > i maskalanır)
          return []
    tests:
      - name: "softmax_rows: sətir cəmləri 1.0 və rəqəmsal dayanıqlılıq"
        code: |
          sm = softmax_rows([[2.0, 2.0], [1000.0, 1000.0]])
          assert abs(sm[0][0] - 0.5) < 1e-7 and abs(sm[0][1] - 0.5) < 1e-7
          assert abs(sm[1][0] - 0.5) < 1e-7 and abs(sm[1][1] - 0.5) < 1e-7
      - name: "Worked example yoxlaması (causal=False)"
        code: |
          Q = [[2.0, 0.0, 0.0, 0.0], [0.0, 2.0, 0.0, 0.0]]
          K = [[2.0, 0.0, 0.0, 0.0], [2.0, 2.0, 0.0, 0.0]]
          V = [[10.0, 0.0], [0.0, 20.0]]
          out = scaled_dot_product_attention(Q, K, V, causal=False)
          assert len(out) == 2 and len(out[0]) == 2
          assert abs(out[0][0] - 5.0) < 1e-6 and abs(out[0][1] - 10.0) < 1e-6
          assert abs(out[1][0] - 1.192029) < 1e-4 and abs(out[1][1] - 17.61594) < 1e-4
      - name: "Causal Masking (causal=True): 0-cı token gələcək 1-ci tokeni görmür"
        code: |
          Q = [[2.0, 0.0, 0.0, 0.0], [0.0, 2.0, 0.0, 0.0]]
          K = [[2.0, 0.0, 0.0, 0.0], [2.0, 2.0, 0.0, 0.0]]
          V = [[10.0, 0.0], [0.0, 20.0]]
          out_causal = scaled_dot_product_attention(Q, K, V, causal=True)
          # 0-cı token yalnız özünə (j=0) baxa bilər -> çıxışı V[0] = [10.0, 0.0] olmalıdır
          assert abs(out_causal[0][0] - 10.0) < 1e-6, f"Alınan: {out_causal[0]}"
          assert abs(out_causal[0][1] - 0.0) < 1e-6, f"Alınan: {out_causal[0]}"
          # 1-ci token həm j=0, həm j=1-ə baxa bilir
          assert abs(out_causal[1][0] - 1.192029) < 1e-4
    solution: |
      import math


      def softmax_rows(matrix: list[list[float]]) -> list[list[float]]:
          result: list[list[float]] = []
          for row in matrix:
              max_val = max(row)
              exps = [math.exp(x - max_val) for x in row]
              total = sum(exps)
              result.append([e / total for e in exps])
          return result


      def scaled_dot_product_attention(
          Q: list[list[float]],
          K: list[list[float]],
          V: list[list[float]],
          causal: bool = False,
      ) -> list[list[float]]:
          seq_len = len(Q)
          d_k = len(Q[0])
          d_v = len(V[0])
          scale = math.sqrt(d_k)

          scores: list[list[float]] = []
          for i in range(seq_len):
              row: list[float] = []
              for j in range(seq_len):
                  if causal and j > i:
                      row.append(-math.inf)
                  else:
                      dot = sum(Q[i][r] * K[j][r] for r in range(d_k))
                      row.append(dot / scale)
              scores.append(row)

          weights = softmax_rows(scores)
          output: list[list[float]] = []
          for i in range(seq_len):
              out_row = [
                  sum(weights[i][j] * V[j][col] for j in range(seq_len))
                  for col in range(d_v)
              ]
              output.append(out_row)
          return output
    explanation: |
      `softmax_rows` hər sətirdən həmin sətrin maksimumunu çıxaraq `math.exp` daşmasının (overflow) qarşısını alır. `scaled_dot_product_attention` isə $QK^T / \sqrt{d_k}$ hesablayır, `causal=True` olduqda $j > i$ xanalarına $-\infty$ qoyur ($\exp(-\infty) = 0.0$) və alınan diqqət çəkilərini $V$ matrisinə vurur.
  - id: ex-dlatt-scale-factor-numeric
    type: numeric
    title: "Miqyaslanmış diqqət balının (Scaled Score) hesablanması"
    prompt: |
      Bir Transformer modelində hər attention başının ölçüsü $d_k = 64$-dür.
      Əgər $i$-ci sorğu vektoru ilə $j$-ci açar vektorunun xam skalyar hasili $q_i \cdot k_j = 24$ olarsa, softmax-a daxil olmazdan əvvəl **miqyaslanmış bal** ($\frac{q_i \cdot k_j}{\sqrt{d_k}}$) neçəyə bərabər olar?
    skills: [dl-architectures, dl-forward-pass]
    category: math
    difficulty: 1
    answer: 3.0
    tolerance: 0.01
    hints:
      - "Əvvəlcə $\\sqrt{d_k} = \\sqrt{64}$ dəyərini tap."
      - "Xam skalyar hasili ($24$) həmin ədədə böl."
    explanation: "$\\sqrt{d_k} = \\sqrt{64} = 8$. Miqyaslanmış bal $= \\frac{24}{8} = 3.0$."
