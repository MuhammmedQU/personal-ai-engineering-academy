id: math-derivatives-gradient-descent
track: math
module: calculus-optimization
title: Törəmə, Chain Rule və Gradient Descent — model səhvindən necə öyrənir?
summary: Törəməni "həssaslıq ölçüsü" kimi başa düşəcəksən, mürəkkəb funksiyanın törəməsini Chain Rule ilə açacaqsan və Gradient Descent yeniləmə qaydası ilə modelin çəkisini addım-addım necə optimallaşdırdığını hesablayacaqsan.
level: foundation
estimated_minutes: [50, 65]
prerequisites: [math-matrices-shapes]
next: math-probability-bayes
skills: [derivatives-chain-rule, gradient-descent]
objectives:
  - Törəməni (derivative) və xüsusi törəməni (partial derivative) funksiyanın girişindəki kiçik dəyişikliyin çıxışa təsiri (slope/sensitivity) kimi izah etmək
  - "Chain Rule ($\\frac{dL}{dw} = \\frac{dL}{d\\hat{y}} \\cdot \\frac{d\\hat{y}}{dw}$) ilə tək neyronun kvadratik xəta (squared error) qradientini çıxarmaq"
  - "Gradient Descent yeniləmə düsturunu ($w_{t+1} = w_t - \\eta \\frac{\\partial L}{\\partial w}$) kiçik rəqəmlərlə addım-addım tətbiq etmək"
  - Learning rate ($\eta$) həddən artıq kiçik və ya böyük seçildikdə nə baş verdiyini (yavaş öyrənmə vs divergence) diaqnoz etmək
why_it_matters: |
  100 parametrli sadə xətti reqressiyadan 70 milyard parametrli LLM-ə qədər bütün müasir süni intellekt modelləri **eyni bir mexanizmlə** öyrənir:
  1. Model proqnoz verir ($\hat{y}$).
  2. Proqnozla həqiqi cavab arasındakı səhv — **Loss** ($L$) hesablanır.
  3. **Chain Rule** (Backpropagation) hər çəkinin bu səhvə nə qədər səbəb olduğunu ($\frac{\partial L}{\partial w}$) tapır.
  4. **Gradient Descent** çəkini səhvi azaldan istiqamətə doğru kiçik bir addım ($\eta$) sürüşdürür.

  Training zamanı loss-un `NaN`-a partlamasının və ya yerində saymasının səbəbini anlamaq üçün bu dörd addımın riyaziyyatını əl ilə izləməyi bacarmalısan.
terms:
  - term: Derivative (törəmə)
    definition: "$f'(w) = \\frac{df}{dw}$; $w$ dəyişəni çox kiçik artdıqda $f(w)$-nin hansı istiqamətdə və nə qədər sürətlə dəyişdiyini göstərən meyl (slope)."
  - term: Partial derivative ($\frac{\partial L}{\partial w_i}$)
    definition: Çoxdəyişənli funksiyada digər bütün parametrləri sabit saxlayıb yalnız bir parametrə ($w_i$) nəzərən alınan törəmə.
  - term: Gradient ($\nabla L$)
    definition: Bütün parametrlər üzrə xüsusi törəmələrdən ibarət vektor; funksiyanın **ən sürətli artım** istiqamətini göstərir.
  - term: Chain rule (zəncir qaydası)
    definition: "İç-içə funksiyanın törəməsi qaydası: $\\frac{dL}{dw} = \\frac{dL}{d\\hat{y}} \\cdot \\frac{d\\hat{y}}{dw}$ (backpropagation-ın riyazi əsası)."
  - term: Gradient descent
    definition: Loss funksiyasını minimuma endirmək üçün parametrləri qradientin **əks** istiqamətində yeniləyən optimallaşdırma alqoritmi.
  - term: Learning rate ($\eta$ / `lr`)
    definition: Qradient istiqamətində atılan addımın böyüklüyünü tənzimləyən müsbət hiperparametr (məsələn, $0.01$ və ya $0.1$).
sections:
  - id: derivative-chain-gd
    kind: explanation
    title: Törəmə, Chain Rule və Gradient Descent Düsturu
    body: |
      **1. Törəmə = Həssaslıq (Meyl / Slope):**
      Əgər $f(w) = w^2$ funksiyasında $w = 3$ nöqtəsindəyiksə, törəmə $\frac{df}{dw} = 2w = 6$-dır. Bu o deməkdir ki:
      - İşarə **müsbətdir (`+6`):** $w$-ni artırsaq funksiya artacaq, **azaltsaq funksiya azalacaq**.
      - Əgər $w = -3$ olsaydı, törəmə $-6$ (mənfi) olardı: funksiyanı azaltmaq üçün $w$-ni **artırmaq** (sağa getmək) lazım gələrdi.

      **2. Chain Rule (Zəncir Qaydası):**
      Sadə bir modeli nəzərdən keçirək: proqnoz $\hat{y} = w \cdot x$, səhv (loss) isə kvadratik fərqdir:

      $$L(w) = (\hat{y} - y)^2 = (w x - y)^2$$

      Simvollar:
      - $x$ — giriş əlaməti (feature)
      - $y$ — həqiqi hədəf cavab (target label)
      - $w$ — modelin öyrənilən çəkisi (weight)
      - $\hat{y} = w x$ — modelin proqnozu
      - $L$ — kvadratik səhv (squared error loss)

      $w$ dəyişdikdə əvvəlcə $\hat{y}$ dəyişir, $\hat{y}$ dəyişdikdə isə $L$ dəyişir. **Chain Rule** bu zənciri iki sadə hissənin hasilinə ayırır:

      $$\frac{dL}{dw} = \frac{dL}{d\hat{y}} \cdot \frac{d\hat{y}}{dw} = 2(\hat{y} - y) \cdot x = 2(wx - y)x$$

      **3. Gradient Descent Yeniləmə Qaydası:**
      Törəmə səhvin **artdığı** tərəfi göstərdiyi üçün, səhvi **azaltmaq** məqsədilə törəmənin əksi istiqamətində (`-` işarəsi ilə) addım atırıq:

      $$w_{t+1} = w_t - \eta \, \frac{dL}{dw}$$

      Simvollar:
      - $w_t$ — cari addımdakı çəki
      - $w_{t+1}$ — yenilənmiş yeni çəki
      - $\eta$ (`lr`) — learning rate (addım ölçüsü, məsələn $0.1$)
      - $\frac{dL}{dw}$ — cari $w_t$ nöqtəsində loss-un çəkiyə görə törəməsi (qradienti)
  - id: foggy-mountain-analogy
    kind: analogy
    title: "Mental model: dumanlı dağdan dərəyə enmək"
    body: |
      Təsəvvür et ki, qatı dumanda dağın yamacındasan və ən aşağıdakı dərəyə (**minimum Loss**) düşmək istəyirsən:

      - Gözünlə uzağı görmürsən, amma ayağının altındakı torpağın meylini (**törəmə / gradient**) hiss edirsən.
      - Ayağının altında sağ tərəf yuxarı qalxırsa (`gradient > 0`), aşağı düşmək üçün **sola** (`- gradient`) addım atırsan.
      - **Learning rate ($\eta$)** sənin addımının uzunluğudur:
        - $\eta$ həddən artıq kiçikdirsə ($0.00001$): qarışqa addımları ilə gedirsən, dərəyə çatmaq günlərlə çəkir.
        - $\eta$ həddən artıq böyükdürsə ($10.0$): nəhəng sıçrayışla dərənin üstündən qarşı yamacın daha yüksək nöqtəsinə tullanırsan və hər addımda daha yuxarı sovrulursan (**divergence / partlayış**).
  - id: chain-rule-gd-diagram
    kind: diagram
    title: Forward Pass (irəli) və Backward Pass (Chain Rule)
    body: |
      ```mermaid
      flowchart LR
        subgraph Forward["1. Forward Pass (Hesablama)"]
          W["w, x"] --> Yhat["ŷ = w * x"]
          Yhat --> Loss["L = (ŷ - y)²"]
        end
        subgraph Backward["2. Backward Pass (Chain Rule)"]
          DL["dL/dŷ = 2(ŷ - y)"] --> DW["dL/dw = dL/dŷ * dŷ/dw = 2(wx - y)x"]
          DW --> Upd["w_new = w - η * dL/dw"]
        end
      ```
  - id: worked-gd-table
    kind: worked_example
    title: Kiçik rəqəmlərlə 3 addımlıq Gradient Descent cədvəli
    body: |
      Verilib: giriş $x = 2$, həqiqi hədəf $y = 6$ (deməli ideal çəki $w^* = 3$ olmalıdır, çünki $3 \cdot 2 = 6$).
      Başlanğıc təxminimiz $w_0 = 1.0$, learning rate isə $\eta = 0.1$-dir.
      Düsturlar: $\hat{y} = 2w$, $L = (\hat{y} - 6)^2$, qradient $\frac{dL}{dw} = 2(\hat{y} - 6) \cdot 2 = 4(\hat{y} - 6)$, yeniləmə $w_{t+1} = w_t - 0.1 \cdot \frac{dL}{dw}$.

      | Addım ($t$) | Cari $w_t$ | Proqnoz $\hat{y} = 2w_t$ | Loss $L = (\hat{y}-6)^2$ | Qradient $\frac{dL}{dw} = 4(\hat{y}-6)$ | Yeni $w_{t+1} = w_t - 0.1 \cdot \frac{dL}{dw}$ |
      |---|---|---|---|---|---|
      | $t = 0$ | $1.00$ | $2.00$ | $(-4)^2 = \mathbf{16.00}$ | $4(-4) = -16.0$ | $1.0 - 0.1(-16.0) = \mathbf{2.60}$ |
      | $t = 1$ | $2.60$ | $5.20$ | $(-0.8)^2 = \mathbf{0.64}$ | $4(-0.8) = -3.2$ | $2.6 - 0.1(-3.2) = \mathbf{2.92}$ |
      | $t = 2$ | $2.92$ | $5.84$ | $(-0.16)^2 = \mathbf{0.0256}$ | $4(-0.16) = -0.64$ | $2.92 - 0.1(-0.64) = \mathbf{2.984}$ |

      Möhtəşəm nəticəyə bax:
      - Cəmi 3 addımda Loss **$16.0$-dan $0.0256$-ya** düşdü!
      - Çəki $w$ isə $1.0$-dan başlayıb həqiqi hədəf olan **$3.0$-a** ($2.60 \rightarrow 2.92 \rightarrow 2.984$) yaxınlaşdı.
      - Diqqət et: hədəfə yaxınlaşdıqca qradient özü kiçilir ($-16 \rightarrow -3.2 \rightarrow -0.64$), ona görə addımlar təbii şəkildə yavaşlayır və minimumda dayanır.
  - id: code-walkthrough
    kind: code
    title: Kod — Gradient Descent addımı və öyrənmə dövrü
    body: |
      ```python
      def gradient_descent_step(w: float, x: float, y: float, lr: float) -> tuple[float, float, float]:
          """Perform one gradient descent step for L = (w * x - y)**2.

          Returns (new_w, loss, grad_w) where loss and grad_w are evaluated at current `w`.
          """
          if lr <= 0:
              raise ValueError("learning rate lr must be positive")
          y_hat = w * x
          error = y_hat - y
          loss = float(error ** 2)
          grad_w = float(2.0 * error * x)       # Chain rule: dL/dy_hat * dy_hat/dw
          new_w = float(w - lr * grad_w)
          return new_w, loss, grad_w


      w = 1.0
      for step in range(3):
          w, loss, grad = gradient_descent_step(w, x=2.0, y=6.0, lr=0.1)
          print(f"step={step}: loss={loss:.4f}, grad={grad:.2f} -> new_w={w:.3f}")
      ```
  - id: common-mistakes
    kind: mistakes
    title: Ən çox edilən səhvlər
    body: |
      **1. Yeniləmə düsturunda `-` əvəzinə `+` yazmaq (`w + lr * grad`)**
      Qradient funksiyanın **artdığı** istiqaməti göstərir. Üstəgəl yazsan Gradient Ascent etmiş olursan və loss hər addımda sonsuzluğa doğru böyüyür!

      **2. Chain rule-da daxili törəməni ($\cdot x$) unutmaq**
      $L = (wx - y)^2$ üçün yalnız $2(wx - y)$ yazıb $\frac{d(wx - y)}{dw} = x$ vuruğunu unutmaq qradienti tamamilə səhv hesablayır (xüsusən $x$ mənfi olduqda hətta işarə də tərsinə çevrilir!).

      **3. Həddən artıq böyük Learning Rate seçmək**
      Yuxarıdakı nümunədə ($x=2, y=6, w_0=1$) əgər $\eta = 0.3$ seçsən:
      - $t=0$: $w_1 = 1 - 0.3(-16) = 5.8$ (hədəf $3$-ü ötüb keçdi — **overshooting**!)
      - $t=1$: $\hat{y} = 11.6$, $\text{grad} = 4(5.6) = 22.4 \rightarrow w_2 = 5.8 - 0.3(22.4) = -0.92$ (daha da uzağa!).
      Loss azalmaq əvəzinə $16 \rightarrow 31.36 \rightarrow 61.46 \rightarrow \infty$ kimi partlayır.
  - id: tradeoffs
    kind: tradeoffs
    title: Engineering trade-offs
    body: |
      - **Full-Batch vs Stochastic (SGD) vs Mini-Batch Gradient Descent:** Qradienti bütün 1 milyon sətir üzərində hesablayıb 1 addım atmaq (Full-Batch) çox dəqiqdir, amma həddən artıq yavaşdır və GPU yaddaşına sığmır. Tək 1 nümunə ilə addım atmaq (SGD) sürətlidir, amma çox küylüdür (noisy). Praktikada `32`–`512` nümunəlik **Mini-Batch** qızıl ortadır.
      - **Sabit $\eta$ vs Learning Rate Schedule & Adam:** Real LLM və DL təlimində sabit $\eta$ əvəzinə hər parametr üçün addımı avtomatik tənzimləyən **AdamW** optimizatoru və təlimin sonunda $\eta$-nı tədricən azaldan **Cosine Annealing** cədvəli istifadə olunur.
mastery_criteria:
  - Kvadratik loss üçün Chain Rule ilə çəki qradientini kağız üzərində və kodda çıxara bilirsən
  - Verilmiş başlanğıc çəki və learning rate üçün növbəti çəki dəyərini dəqiq hesablaya bilirsən
  - Loss-un artması və ya NaN olması halında learning rate ilə bağlı səbəbi izah edə bilirsən
quiz:
  pass_threshold: 0.75
  questions:
    - id: q-mathgd-direction
      type: mcq
      title: Qradientin işarəsi və çəkinin yenilənmə istiqaməti
      prompt: "Cari $w = 4.0$ nöqtəsində loss funksiyasının törəməsi $\\frac{dL}{dw} = -5.0$ (mənfi) çıxıb. Learning rate $\\eta = 0.1$ olduqda Gradient Descent addımından sonra yeni $w$ necə dəyişəcək?"
      skills: [gradient-descent, derivatives-chain-rule]
      category: math
      options:
        - id: a
          text: "$w$ azalacaq və $3.5$ olacaq"
          feedback: "Diqqət: $w - \\eta \\cdot (-5.0) = 4.0 - (-0.5) = 4.5$."
        - id: b
          text: "$w$ artacaq və $4.5$ olacaq"
          feedback: Doğru. Törəmə mənfidirsə, sağa getdikcə loss azalır; $4.0 - 0.1(-5.0) = 4.5$.
        - id: c
          text: "$w$ dəyişməyəcək ($4.0$ qalacaq)"
          feedback: Yalnız törəmə 0.0 olduqda çəki dəyişmir.
      answer: b
      explanation: "$w_{t+1} = w_t - \\eta \\frac{dL}{dw} = 4.0 - 0.1 \\cdot (-5.0) = 4.0 + 0.5 = 4.5$. Mənfi meyl funksiyanın sağa doğru azaldığını göstərir."
    - id: q-mathgd-chain-calc
      type: numeric
      title: Chain Rule ilə qradienti hesabla
      prompt: "$L(w) = (w x - y)^2$ funksiyasında $w = 2.0$, $x = 3.0$, $y = 4.0$ verilib. Bu nöqtədə $\\frac{dL}{dw} = 2(wx - y)x$ törəməsinin dəyərini hesabla."
      skills: [derivatives-chain-rule]
      category: math
      answer: 12
      tolerance: 0.01
      hints:
        - "Əvvəlcə proqnoz fərqini tap: $w x - y = 2(3) - 4 = 2$."
        - "Sonra $2 \\cdot (wx - y) \\cdot x = 2 \\cdot 2 \\cdot 3$ hesabla."
      explanation: "$\\hat{y} = 2 \\cdot 3 = 6$. Xəta $\\hat{y} - y = 6 - 4 = 2$. Qradient $\\frac{dL}{dw} = 2(2)(3) = 12$."
    - id: q-mathgd-lr-too-high
      type: mcq
      title: Learning rate həddən artıq böyük seçildikdə
      prompt: Modelin təlimi zamanı Loss dəyəri hər addımda azalmaq əvəzinə `10 -> 45 -> 210 -> 1400 -> inf (NaN)` kimi sürətlə böyüyür. Ən ehtimal olunan səbəb nədir?
      skills: [gradient-descent]
      category: debug
      options:
        - id: a
          text: Learning rate ($\eta$) həddən artıq kiçikdir
          feedback: Kiçik learning rate zamanı loss çox yavaş azalar, amma partlamaz.
        - id: b
          text: Learning rate ($\eta$) həddən artıq böyükdür (minimumun üzərindən aşaraq divergence baş verir)
          feedback: Doğru. Böyük addım minimum dərəni ötüb qarşı yamacın daha yüksək nöqtəsinə düşür və rəqslər böyüyərək partlayır.
        - id: c
          text: Model artıq qlobal minimuma çatıb
          feedback: Minimumda qradient sıfıra yaxınlaşır və loss sabit aşağı dəyərdə qalır.
      answer: b
      explanation: Həddən artıq böyük $\eta$ (learning rate) və ya yeniləmədə səhvən `+` işarəsi yazılması loss-un eksponensial artıb `NaN` olmasına (divergence) gətirib çıxarır.
exercises:
  - id: ex-mathgd-step-fn
    type: code
    title: gradient_descent_step funksiyasını yaz
    prompt: |
      $L(w) = (w \cdot x - y)^2$ kvadratik loss funksiyası üçün bir Gradient Descent addımı atan `gradient_descent_step(w: float, x: float, y: float, lr: float) -> tuple[float, float, float]` funksiyasını yaz:

      1. Əgər `lr <= 0` olarsa → `ValueError` qaldır.
      2. Cari `w` nöqtəsindəki `loss = (w * x - y) ** 2` dəyərini hesabla.
      3. Chain Rule ilə `grad_w = 2 * (w * x - y) * x` qradientini hesabla.
      4. Yeni çəkini `new_w = w - lr * grad_w` düsturu ilə tap.
      5. `(new_w, loss, grad_w)` üçlüyünü (tuple) `float` dəyərlərlə qaytar.
    skills: [derivatives-chain-rule, gradient-descent]
    category: math
    difficulty: 1
    hints:
      - "`error = w * x - y` köməkçi dəyişəni həm `loss = error ** 2`, həm də `grad_w = 2.0 * error * x` üçün işi sadələşdirir."
      - "`if lr <= 0: raise ValueError(...)` yoxlamasını əvvəldə yaz."
    starter_code: |
      def gradient_descent_step(
          w: float, x: float, y: float, lr: float
      ) -> tuple[float, float, float]:
          # TODO: (new_w, loss, grad_w) hesabla və qaytar
          return w, 0.0, 0.0
    tests:
      - name: Dərsdəki nümunə (w=1.0, x=2.0, y=6.0, lr=0.1)
        code: |
          import math
          new_w, loss, grad = gradient_descent_step(1.0, 2.0, 6.0, 0.1)
          assert math.isclose(loss, 16.0, abs_tol=1e-6)
          assert math.isclose(grad, -16.0, abs_tol=1e-6)
          assert math.isclose(new_w, 2.6, abs_tol=1e-6)
      - name: Ardıcıl 20 addımda həqiqi hədəfə (w=3.0, loss=0.0) yığılır
        code: |
          import math
          w = 0.0
          for _ in range(25):
              w, loss, _ = gradient_descent_step(w, x=2.0, y=6.0, lr=0.1)
          assert math.isclose(w, 3.0, abs_tol=1e-4), f"w={w} 3.0-a yığılmadı"
          assert math.isclose(loss, 0.0, abs_tol=1e-6)
      - name: Mənfi və ya sıfır learning rate ValueError verir
        code: |
          for bad_lr in [0.0, -0.05]:
              try:
                  gradient_descent_step(1.0, 2.0, 6.0, bad_lr)
                  assert False, f"lr={bad_lr} üçün ValueError gözlənilirdi"
              except ValueError:
                  pass
    solution: |
      def gradient_descent_step(
          w: float, x: float, y: float, lr: float
      ) -> tuple[float, float, float]:
          if lr <= 0:
              raise ValueError("lr must be positive")
          error = w * x - y
          loss = float(error ** 2)
          grad_w = float(2.0 * error * x)
          new_w = float(w - lr * grad_w)
          return new_w, loss, grad_w
    explanation: |
      `error = w * x - y` həm forward pass-dakı loss-u (`error**2`), həm də backward pass-dakı qradienti (`2 * error * x`) birbaşa verir.
  - id: ex-mathgd-numeric-update
    type: numeric
    title: Bir Gradient Descent addımından sonra yeni çəkini tap
    prompt: |
      $L(w) = (w x - y)^2$ modelində başlanğıc çəki $w_0 = 4.0$, giriş $x = 1.0$, həqiqi cavab $y = 1.0$ və learning rate $\eta = 0.25$ verilib.
      1. $\frac{dL}{dw} = 2(w_0 x - y)x$ qradientini hesabla.
      2. $w_1 = w_0 - \eta \frac{dL}{dw}$ düsturu ilə bir addımdan sonrakı yeni $w_1$ dəyərini tap.
    skills: [derivatives-chain-rule, gradient-descent]
    category: math
    difficulty: 2
    answer: 2.5
    tolerance: 0.01
    hints:
      - "$w_0 x - y = 4.0(1.0) - 1.0 = 3.0$."
      - "$\\frac{dL}{dw} = 2(3.0)(1.0) = 6.0$."
      - "$w_1 = 4.0 - 0.25 \\cdot 6.0 = 4.0 - 1.5 = 2.5$."
    explanation: |
      Qradient $\frac{dL}{dw} = 2(4 \cdot 1 - 1) \cdot 1 = 6.0$. Yeniləmə: $w_1 = 4.0 - 0.25 \cdot 6.0 = 4.0 - 1.5 = 2.5$.
