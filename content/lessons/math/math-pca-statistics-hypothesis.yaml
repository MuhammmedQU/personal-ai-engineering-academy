exercises:
  - id: ex-mathstat-ci-and-pca
    type: code
    title: "95% Confidence Interval və PCA Komponent Seçicisini implementasiya et"
    prompt: |
      Python standart kitabxanasından (`math`) istifadə edərək aşağıdakı iki funksiyanı yaz:

      **1. `confidence_interval_95(samples: list[float]) -> tuple[float, float, float]`**
      - Seçmədəki elementlərin sayı 2-dən azdırsa (`len(samples) < 2`), `ValueError` qaldır.
      - Seçmə ortalamasını ($\bar{x}$), **qərəzsiz** standart meyli ($s = \sqrt{\frac{1}{n-1}\sum (x_i - \bar{x})^2}$) və standart xətanı ($\text{SE} = s / \sqrt{n}$) hesabla.
      - `(mean, lower, upper)` tuple-nı qaytar, burada `lower = mean - 1.96 * se` və `upper = mean + 1.96 * se`.

      **2. `pca_components_for_variance(eigenvalues: list[float], target_ratio: float) -> int`**
      - Əgər `eigenvalues` boşdursa, içində mənfi ədəd varsa, cəmi `<= 0`-dırsa və ya `not (0.0 < target_ratio <= 1.0)` olarsa, `ValueError` qaldır.
      - Xüsusi ədədləri azalan sırada sırala (input qarışıq sırada verilə bilər!).
      - Kumulyativ izah olunan dispersiya nisbətinin (`cumulative / total_variance`) ən azı `target_ratio`-ya çatması üçün lazım olan **minimum** komponent sayını ($k \in \{1, \dots, d\}$) qaytar (üzən nöqtə xətası üçün `cumulative / total + 1e-12 >= target_ratio` müqayisəsindən istifadə et).
    skills: [statistics-basics, matrices-shapes, ml-algorithms]
    category: math
    difficulty: 2
    hints:
      - "`confidence_interval_95` üçün: `n = len(samples)`, `mean = sum(samples) / n`, `var = sum((x - mean) ** 2 for x in samples) / (n - 1)`, `se = math.sqrt(var) / math.sqrt(n)`."
      - "`pca_components_for_variance` üçün əvvəlcə doğrulamaları et: `if not eigenvalues or any(x < 0 for x in eigenvalues) or sum(eigenvalues) <= 0 or not (0.0 < target_ratio <= 1.0): raise ValueError(...)`."
      - "`sorted_eigs = sorted(eigenvalues, reverse=True)` üzərində `for k, val in enumerate(sorted_eigs, start=1):` ilə cəmi topla və `(cum / total) + 1e-12 >= target_ratio` olduqda `return k`."
    starter_code: |
      import math

      def confidence_interval_95(samples: list[float]) -> tuple[float, float, float]:
          # TODO: (mean, lower, upper) hesabla (n-1 məxrəci ilə)
          return (0.0, 0.0, 0.0)

      def pca_components_for_variance(eigenvalues: list[float], target_ratio: float) -> int:
          # TODO: target_ratio üçün lazım olan minimum top komponent sayını qaytar
          return 0
    tests:
      - name: "confidence_interval_95: [10, 12, 14, 16] üçün dəqiq ortalama və 95% CI"
        code: |
          mean, lo, hi = confidence_interval_95([10.0, 12.0, 14.0, 16.0])
          assert abs(mean - 13.0) < 1e-9, f"mean səhvdir: {mean}"
          assert abs(lo - 10.46965318) < 1e-4, f"lower səhvdir (n-1 istifadə etdiyinə əmin ol): {lo}"
          assert abs(hi - 15.53034682) < 1e-4, f"upper səhvdir: {hi}"
      - name: "pca_components_for_variance: sıralı və qarışıq eigenvalues üçün minimum k"
        code: |
          eigs = [1.0, 5.0, 0.4, 3.0, 0.6]  # cəm = 10.0, sıralı: [5.0, 3.0, 1.0, 0.6, 0.4]
          assert pca_components_for_variance(eigs, 0.50) == 1
          assert pca_components_for_variance(eigs, 0.80) == 2
          assert pca_components_for_variance(eigs, 0.90) == 3
          assert pca_components_for_variance(eigs, 0.95) == 4
      - name: "Səhv input-lar üçün ValueError qaldırır"
        code: |
          for bad_samples in ([], [42.0]):
              raised = False
              try:
                  confidence_interval_95(bad_samples)
              except ValueError:
                  raised = True
              assert raised, f"samples={bad_samples} üçün ValueError qaldırılmalıdır"

          for bad_eigs, bad_target in (([], 0.9), ([1.0, -0.5], 0.8), ([2.0, 1.0], 0.0), ([2.0, 1.0], 1.5)):
              raised = False
              try:
                  pca_components_for_variance(bad_eigs, bad_target)
              except ValueError:
                  raised = True
              assert raised, f"eigs={bad_eigs}, target={bad_target} üçün ValueError qaldırılmalıdır"
    solution: |
      import math

      def confidence_interval_95(samples: list[float]) -> tuple[float, float, float]:
          n = len(samples)
          if n < 2:
              raise ValueError("At least 2 samples are required")
          mean = sum(samples) / n
          variance = sum((x - mean) ** 2 for x in samples) / (n - 1)
          se = math.sqrt(variance) / math.sqrt(n)
          margin = 1.96 * se
          return (mean, mean - margin, mean + margin)

      def pca_components_for_variance(eigenvalues: list[float], target_ratio: float) -> int:
          if not eigenvalues or not (0.0 < target_ratio <= 1.0):
              raise ValueError("Invalid eigenvalues or target_ratio")
          if any(x < 0 for x in eigenvalues):
              raise ValueError("Eigenvalues must be non-negative")
          total = sum(eigenvalues)
          if total <= 0:
              raise ValueError("Total variance must be positive")
          sorted_eigs = sorted(eigenvalues, reverse=True)
          cumulative = 0.0
          for k, val in enumerate(sorted_eigs, start=1):
              cumulative += val
              if (cumulative / total) + 1e-12 >= target_ratio:
                  return k
          return len(sorted_eigs)
    explanation: |
      `confidence_interval_95` Bessel düzəlişli ($n-1$) dispersiyadan standart xətanı ($\text{SE} = s/\sqrt{n}$) tapır. `pca_components_for_variance` isə xüsusi ədədləri azalan sırada toplayaraq hədəf dispersiya payına çatan ilk $k$ indeksini qaytarır.
  - id: ex-mathstat-evr-numeric
    type: numeric
    title: "Kumulyativ Explained Variance Ratio hesabla"
    prompt: |
      4 ölçülü datasetin kovariasiya matrisinin xüsusi ədədləri (eigenvalues) belədir:

      $$\lambda = [6.0,\; 2.5,\; 1.0,\; 0.5]$$

      İlk **2 baş komponentin** ($k = 2$) saxladığı **kumulyativ izah olunan dispersiya nisbətini** ($\text{Cumulative EVR}_2 = \frac{\lambda_1 + \lambda_2}{\sum_{j=1}^4 \lambda_j}$) onluq kəsr şəklində (`0` ilə `1` arasında) hesabla.
    skills: [matrices-shapes, ml-algorithms]
    category: math
    difficulty: 1
    answer: 0.85
    tolerance: 0.001
    hints:
      - "Əvvəlcə bütün xüsusi ədədlərin cəmini tap: $6.0 + 2.5 + 1.0 + 0.5$."
      - "İlk 2 xüsusi ədədin cəmini ($6.0 + 2.5$) ümumi cəmə böl."
    explanation: |
      Ümumi dispersiya $= 6.0 + 2.5 + 1.0 + 0.5 = 10.0$. İlk iki komponentin dispersiya cəmi $= 6.0 + 2.5 = 8.5$. Kumulyativ EVR $= \frac{8.5}{10.0} = 0.85$ (85%).
