exercises:
  - id: ex-mlunsup-kmeans-step
    type: code
    title: "KMeans-in bir tam Lloyd addımını (kmeans_step) implementasiya et"
    prompt: |
      `kmeans_step(points, centroids)` funksiyasını yaz:

      - **Input:**
        - `points: list[list[float]]` — $n$ ədəd $d$-ölçülü nöqtə.
        - `centroids: list[list[float]]` — $K$ ədəd $d$-ölçülü cari klaster mərkəzi.
      - **Output:** `(assignments, new_centroids)` tuple-ı:
        1. `assignments: list[int]` — hər nöqtə üçün ən yaxın mərkəzin indeksi (`0 .. K-1`). Məsafə Evklid məsafəsi ilə ölçülür. Əgər iki mərkəzə məsafə tam bərabərdirsə, **daha kiçik indeksi** seç.
        2. `new_centroids: list[list[float]]` — hər klasterə düşən nöqtələrin koordinat üzrə ədədi ortası. Əgər hər hansı klasterə **0 nöqtə** düşübsə, həmin klaster üçün **köhnə mərkəzin kopyasını** saxla.
      - Input list-ləri dəyişdirmə (mutate etmə).
    skills: [ml-algorithms, vectors-dot-product]
    category: python
    difficulty: 2
    hints:
      - "İki nöqtə arasındakı kvadratik Evklid məsafəsi `sum((a - b) ** 2 for a, b in zip(pt, c))` məsafə sırasını qoruyur (`math.sqrt` yazsan da olar)."
      - "`min(range(len(centroids)), key=lambda idx: dist(pt, centroids[idx]))` Python-da bərabərlik zamanı avtomatik ən kiçik `idx`-i qaytarır."
      - "Hər klaster üçün nöqtələri topla; siyahı boşdursa `list(centroids[idx])`, əks halda hər koordinat `d` üzrə `sum(p[d] for p in cluster) / len(cluster)` hesabla."
    starter_code: |
      def kmeans_step(
          points: list[list[float]],
          centroids: list[list[float]],
      ) -> tuple[list[int], list[list[float]]]:
          # TODO: 1) hər nöqtəni ən yaxın mərkəzə təyin et
          # TODO: 2) hər klasterin yeni mərkəzini (boş klasterdə köhnə mərkəzi) hesabla
          return [], []
    tests:
      - name: "2D nöqtələrdə standart təyinat və mərkəz yeniləməsi"
        code: |
          pts = [[1.0, 1.0], [1.0, 3.0], [5.0, 5.0], [7.0, 5.0]]
          cents = [[1.0, 1.0], [5.0, 5.0]]
          assign, new_c = kmeans_step(pts, cents)
          assert assign == [0, 0, 1, 1], f"Gözlənilən [0, 0, 1, 1], alınan {assign}"
          assert new_c == [[1.0, 2.0], [6.0, 5.0]], f"Gözlənilən [[1.0, 2.0], [6.0, 5.0]], alınan {new_c}"
      - name: "Boş qalan klaster öz köhnə mərkəzini qoruyur"
        code: |
          pts = [[0.0, 0.0], [2.0, 0.0]]
          cents = [[1.0, 0.0], [100.0, 100.0]]
          assign, new_c = kmeans_step(pts, cents)
          assert assign == [0, 0], f"Alınan: {assign}"
          assert new_c[0] == [1.0, 0.0], f"Klaster 0 mərkəzi: {new_c[0]}"
          assert new_c[1] == [100.0, 100.0], f"Boş klaster köhnə mərkəzi saxlamalıdır: {new_c[1]}"
      - name: "Bərabər məsafədə kiçik indeks seçilir və input mutasiya olunmur"
        code: |
          pts = [[5.0, 0.0]]
          cents = [[0.0, 0.0], [10.0, 0.0]]
          cents_copy = [list(c) for c in cents]
          assign, new_c = kmeans_step(pts, cents)
          assert assign == [0], f"Bərabər məsafədə kiçik indeks (0) seçilməlidir, alınan: {assign}"
          assert new_c == [[5.0, 0.0], [10.0, 0.0]]
          assert cents == cents_copy, "Input centroids dəyişdirilməməlidir"
    solution: |
      def kmeans_step(
          points: list[list[float]],
          centroids: list[list[float]],
      ) -> tuple[list[int], list[list[float]]]:
          k = len(centroids)
          dim = len(centroids[0]) if centroids else 0
          assignments: list[int] = []
          clusters: list[list[list[float]]] = [[] for _ in range(k)]

          for pt in points:
              best_idx = min(
                  range(k),
                  key=lambda idx: sum((a - b) ** 2 for a, b in zip(pt, centroids[idx])),
              )
              assignments.append(best_idx)
              clusters[best_idx].append(pt)

          new_centroids: list[list[float]] = []
          for idx, members in enumerate(clusters):
              if not members:
                  new_centroids.append(list(centroids[idx]))
              else:
                  m = len(members)
                  new_centroids.append([sum(p[d] for p in members) / m for d in range(dim)])

          return assignments, new_centroids
    explanation: |
      Funksiya əvvəlcə hər nöqtədən bütün mərkəzlərə kvadratik Evklid məsafəsini hesablayıb ən yaxın klasterə təyin edir, sonra isə hər klasterin nöqtələrini koordinat üzrə ortalayır. Boş qalan klasterlərdə sıfıra bölmə baş verməməsi üçün köhnə mərkəzin kopyası saxlanılır.
  - id: ex-mlunsup-scaling-mcq
    type: mcq
    title: "Diaqnostika: Niyə KMeans yalnız gəlir sütununa baxdı?"
    prompt: |
      Bir pərakəndə satış komandası müştəriləri iki xüsusiyyətə görə $K = 3$ seqmentə ayırmaq üçün `KMeans(n_clusters=3).fit(X)` işlədir:
      - `annual_income_azn`: İllik gəlir (`6 000 .. 120 000 AZN`)
      - `monthly_visits`: Aylıq mağaza ziyarəti sayı (`1 .. 12 dəfə`)

      Nəticələri yoxlayanda görürlər ki, klasterlər müştəriləri **yalnız illik gəlirə** görə (aşağı, orta, yüksək gəlir) bölüb; aylıq ziyarət sayının klasterlərə heç bir təsiri olmayıb.

      Bu problemin kök səbəbi və düzgün həlli nədir?
    skills: [ml-algorithms, vectors-dot-product]
    category: debug
    difficulty: 1
    hints:
      - "İki müştəri arasındakı Evklid məsafəsində $(60000 - 50000)^2$ ilə $(12 - 1)^2$ hədlərini müqayisə et."
      - "KMeans-dən əvvəl hansı preprocessing addımı unudulub?"
    options:
      - id: a
        text: "KMeans maksimum 1 xüsusiyyətlə işləyə bilir; 2 xüsusiyyət üçün Random Forest istifadə edilməlidir"
        feedback: "Xeyr — KMeans istənilən sayda ($d$) ədədi xüsusiyyətlə işləyir."
      - id: b
        text: "Ölçü vahidləri miqyaslanmayıb (`StandardScaler` yoxdur): minlərlə AZN fərqi Evklid məsafəsində `1..12` ziyarət fərqini tamamilə üstələyir. KMeans-dən əvvəl `StandardScaler` tətbiq edilməlidir"
        feedback: "Doğru! $10\\,000^2 = 10^8$ olduğu halda $11^2 = 121$-dir. Standartlaşdırma olmadan məsafə yalnız gəliri görür."
      - id: c
        text: "`n_clusters=3` əvəzinə `n_clusters=100` seçilməlidir ki, ziyarət sayı da nəzərə alınsın"
        feedback: "Xeyr — $K$-nı artırmaq iki sütun arasındakı $10^6$ dəfəlik miqyas fərqini aradan qaldırmır."
      - id: d
        text: "`monthly_visits` sütunu tam ədəd olduğu üçün KMeans onu avtomatik silir"
        feedback: "Xeyr — KMeans tam ədədləri də float kimi məsafə hesabına daxil edir."
    answer: b
    explanation: |
      Evklid məsafəsi bütün koordinat fərqlərinin kvadratlarını birbaşa toplayır. Sütunlar `StandardScaler` ilə ($\mu=0, \sigma=1$) eyni miqyasa gətirilmədikdə, böyük ədədi diapazona malik sütun məsafəni təkbaşına müəyyən edir.
