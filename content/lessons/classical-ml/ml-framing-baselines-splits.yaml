exercises:
  - id: ex-mlfbs-chronological-and-baseline
    type: code
    title: Xronoloji split və majority baseline funksiyalarını yaz
    prompt: |
      İki pure-Python funksiyası implementasiya et:

      1. `train_val_test_split_chronological(items, train_ratio, val_ratio)`:
         - `items` list-ini sırasını **dəyişmədən** `(train, val, test)` tuple-na bölür.
         - `train_end = int(len(items) * train_ratio)` və `val_end = train_end + int(len(items) * val_ratio)` indekslərindən istifadə et.
         - Input list-dən kəsilmiş yeni dilimlər (slices) qaytarır.
         - Əgər `train_ratio <= 0` və ya `val_ratio <= 0` və ya `train_ratio + val_ratio >= 1.0` olarsa, `ValueError` qaldır.

      2. `majority_class_baseline(y_train, n_preds)`:
         - `y_train` içində ən çox təkrarlanan sinfi tapır və uzunluğu `n_preds` olan `[best_class, ...]` list-i qaytarır.
         - Əgər iki sinfin sayı bərabərdirsə (tie), **daha kiçik ədədi** seç (məsələn, `0` və `1` bərabərdirsə `0`).
         - Əgər `y_train` boşdursa və ya `n_preds < 0` olarsa, `ValueError` qaldır.
    skills: [ml-problem-framing, ml-data-splitting]
    category: python
    difficulty: 2
    hints:
      - "Nisbət yoxlaması: `if train_ratio <= 0 or val_ratio <= 0 or (train_ratio + val_ratio) >= 1.0: raise ValueError(...)`."
      - "`from collections import Counter` ilə tezlikləri say, sonra `min(counts.keys(), key=lambda k: (-counts[k], k))` ilə ən çox təkrarlanan (bərabərlikdə ən kiçik) sinfi seç."
    starter_code: |
      from collections import Counter


      def train_val_test_split_chronological(
          items: list, train_ratio: float, val_ratio: float
      ) -> tuple[list, list, list]:
          # TODO: nisbətləri yoxla və (train, val, test) qaytar
          pass


      def majority_class_baseline(y_train: list[int], n_preds: int) -> list[int]:
          # TODO: y_train-də ən çox rast gəlinən sinfi n_preds dəfə qaytar
          pass
    tests:
      - name: Xronoloji split 10 elementi 60/20/20 bölür
        code: |
          data = list(range(10))
          tr, va, te = train_val_test_split_chronological(data, 0.6, 0.2)
          assert tr == [0, 1, 2, 3, 4, 5], f"train səhvdir: {tr}"
          assert va == [6, 7], f"val səhvdir: {va}"
          assert te == [8, 9], f"test səhvdir: {te}"
      - name: Yanlış nisbətlərdə ValueError qaldırır
        code: |
          for bad in [(0.0, 0.2), (0.5, -0.1), (0.8, 0.2), (0.9, 0.3)]:
              try:
                  train_val_test_split_chronological([1, 2, 3], bad[0], bad[1])
                  assert False, f"{bad} üçün ValueError qaldırılmalı idi"
              except ValueError:
                  pass
      - name: Majority baseline əsas və bərabərlik (tie) halları
        code: |
          assert majority_class_baseline([1, 0, 1, 1, 0], 3) == [1, 1, 1]
          assert majority_class_baseline([1, 0, 1, 0], 2) == [0, 0], "tie halında kiçik etiket seçilməlidir"
          assert majority_class_baseline([2, 2], 0) == []
      - name: Boş y_train və mənfi n_preds üçün ValueError
        code: |
          try:
              majority_class_baseline([], 3)
              assert False, "boş y_train üçün ValueError gözlənilirdi"
          except ValueError:
              pass
          try:
              majority_class_baseline([1, 0], -1)
              assert False, "mənfi n_preds üçün ValueError gözlənilirdi"
          except ValueError:
              pass
    solution: |
      from collections import Counter


      def train_val_test_split_chronological(
          items: list, train_ratio: float, val_ratio: float
      ) -> tuple[list, list, list]:
          if train_ratio <= 0 or val_ratio <= 0 or (train_ratio + val_ratio) >= 1.0:
              raise ValueError("Invalid split ratios")
          n = len(items)
          train_end = int(n * train_ratio)
          val_end = train_end + int(n * val_ratio)
          return items[:train_end], items[train_end:val_end], items[val_end:]


      def majority_class_baseline(y_train: list[int], n_preds: int) -> list[int]:
          if not y_train:
              raise ValueError("y_train cannot be empty")
          if n_preds < 0:
              raise ValueError("n_preds must be non-negative")
          counts = Counter(y_train)
          best_class = min(counts.keys(), key=lambda c: (-counts[c], c))
          return [best_class] * n_preds
    explanation: |
      `train_val_test_split_chronological` ardıcıllığı qoruyaraq kəsim nöqtələrini hesablayır, `majority_class_baseline` isə yalnız `y_train` tezliklərindən istifadə edib deterministik baseline proqnozu yaradır.
