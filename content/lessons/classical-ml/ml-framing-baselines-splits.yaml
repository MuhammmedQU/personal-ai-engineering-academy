  - id: ex-mlfbs-frame-churn
    type: explain
    title: "Problem Framing: Abunə ləğvi (Churn) məsələsini rəsmiləşdir"
    prompt: |
      Mobil musiqi tətbiqinin məhsul meneceri sənə deyir:
      *"İstifadəçilər premium abunəni ləğv edir. ML modeli quraq ki, kimlərin gedəcəyini əvvəlcədən bilək və onlara hədiyyə təklif edək."*

      Bu qeyri-müəyyən istəyi 4 bənddə formal ML spesifikasiyasına çevir:
      1. Müşahidə vahidi, proqnoz anı ($t_0$) və hədəf dəyişəni ($y$ + prediction horizon)
      2. Proqnoz anında icazəli olan ən azı 3 giriş əlaməti ($X$)
      3. İlk gün quracağın sadə baseline (majority və ya heuristic)
      4. Train/Val/Test split strategiyası və səbəbi
    skills: [ml-problem-framing, ml-data-splitting]
    category: concept
    difficulty: 2
    hints:
      - "Hədəf üçün zaman pəncərəsi seç: məsələn, növbəti 14 və ya 30 gün ərzində abunəni yeniləməmək."
      - "Əlamətlər yalnız $t_0$ tarixinə qədərki davranışlardan (dinləmə saatı, son giriş tarixi, ödəniş uğursuzluğu) ibarət olmalıdır."
    rubric:
      - "Hədəf dəyişənini ($y \\in \\{0, 1\\}$) konkret prediction horizon (məs. növbəti 30 gün) ilə təyin edir"
      - "Proqnoz anında ($t_0$) məlum olan ən azı 3 tarixi əlamət ($X$) sadalayır"
      - "Aydın bir baseline (majority class və ya 'son 7 gündə aktiv olmayıbsa churn=1' kimi heuristic) təklif edir"
      - "Zaman kəsiyinə görə (time-based/cohort) və ya sinif disbalansını nəzərə alan split strategiyasını əsaslandırır"
    model_answer: |
      1. **Müşahidə vahidi və Hədəf ($y$):** Hər sətir $t_0$ tarixində aktiv premium abunəçidir. $y = 1$ əgər istifadəçi $[t_0, t_0 + 30\text{ gün}]$ pəncərəsində abunəsini ləğv edərsə, əks halda $y = 0$ (binary classification).
      2. **Əlamətlər ($X$):** $t_0$-dan əvvəlki son 7 və 30 gündə dinlənilən dəqiqə sayı, son 7 gündə əvvəlki aya nisbətən aktivlik azalması, tətbiqə son girişdən keçən gün sayı, dəstək xidmətinə şikayət sayı.
      3. **Baseline:** Majority class baseline (hamıya $y=0$) və sadə heuristic baseline: *"Son 10 gündə heç musiqi dinləməyibsə $\hat{y}=1$, əks halda $0$"*.
      4. **Split strategiyası:** Mövsümi təsirləri və tətbiq yeniləmələrini nəzərə almaq üçün **xronoloji (time-based cohort) split** — məsələn, sentyabr kohortu train, oktyabr kohortu validation, noyabr kohortu test.
    explanation: Yaxşı problem framing ML layihəsinin yarısıdır — horizon və $t_0$ dəqiq təyin ediləndə sonrakı data leakage riskləri də avtomatik görünür.
