    tests:
      - name: Train üzərində fit və həm train, həm test üzərində apply
        code: |
          mu, sigma = fit_standardizer([2.0, 4.0, 6.0])
          assert abs(mu - 4.0) < 1e-9, f"mean 4.0 olmalı idi, alınan {mu}"
          assert abs(sigma - math.sqrt(8.0 / 3.0)) < 1e-9, f"std səhvdir: {sigma}"

          tr_scaled = apply_standardizer([2.0, 4.0, 6.0], mu, sigma)
          assert abs(tr_scaled[1] - 0.0) < 1e-9
          assert abs(tr_scaled[0] + tr_scaled[2]) < 1e-9

          # Test-dəki böyük outlier train-in mu və sigma-sını dəyişmir!
          te_scaled = apply_standardizer([100.0], mu, sigma)
          expected_te = (100.0 - 4.0) / math.sqrt(8.0 / 3.0)
          assert abs(te_scaled[0] - expected_te) < 1e-6
      - name: std == 0 olduqda sıfıra bölmə baş vermir
        code: |
          mu, sigma = fit_standardizer([5.0, 5.0, 5.0])
          assert mu == 5.0 and sigma == 0.0
          assert apply_standardizer([5.0, 10.0], mu, sigma) == [0.0, 0.0]
      - name: Boş train_values üçün ValueError və input mutasiya olunmur
        code: |
          try:
              fit_standardizer([])
              assert False, "Boş train_values üçün ValueError qaldırılmalı idi"
          except ValueError:
              pass
          raw = [1.0, 2.0]
          out = apply_standardizer(raw, 1.5, 0.5)
          assert raw == [1.0, 2.0] and out is not raw
    solution: |
      import math


      def fit_standardizer(train_values: list[float]) -> tuple[float, float]:
          if not train_values:
              raise ValueError("train_values cannot be empty")
          n = len(train_values)
          mean = sum(train_values) / n
          variance = sum((x - mean) ** 2 for x in train_values) / n
          return mean, math.sqrt(variance)


      def apply_standardizer(
          values: list[float], mean: float, std: float
      ) -> list[float]:
          if std == 0:
              return [0.0 for _ in values]
          return [(x - mean) / std for x in values]
    explanation: |
      `fit_standardizer` və `apply_standardizer` funksiyalarının ayrılması `scikit-learn`-dəki `fit()` və `transform()` dizaynının nüvəsidir: test və production datası heç vaxt `fit_standardizer`-ə daxil olmur.
  - id: ex-mldlk-diagnose-code
    type: multi
    title: "Debug: Bu ML pipeline-dakı 3 leakage səhvini tap"
    prompt: |
      Bir namizəd texniki müsahibədə aşağıdakı kodu təqdim edib:

      ```python
      # Sətir 1: Bütün datanı standartlaşdır
      X_scaled = scaler.fit_transform(df[["age", "income", "refund_issued_amount"]])
      y = df["churned"]

      # Sətir 2: Sinif balansını düzəltmək üçün azlıq sinfini kopyala
      X_bal, y_bal = oversample_minority(X_scaled, y)

      # Sətir 3: Train və Test-ə böl (müştərilərin aylıq sətirləri var, user_id nəzərə alınmır)
      X_train, X_test, y_train, y_test = train_test_split(X_bal, y_bal, test_size=0.2)
      ```

      Bu kodda baş verən **bütün** leakage növlərini seç:
    skills: [ml-data-leakage, ml-data-splitting]
    category: debug
    difficulty: 2
    hints:
      - "Hər sətrin `train_test_split`-dən ƏVVƏL yoxsa SONRA icra olunduğuna diqqət et."
      - "Həm `scaler.fit_transform`, həm də `oversample_minority` split-dən əvvəl çağırıldıqda test datası ilə train datası qarışır. Bundan əlavə `refund_issued_amount` sütununun nə vaxt yarandığını düşün."
    options:
      - id: a
        text: "Preprocessing leakage: `scaler.fit_transform` train/test bölgüsündən əvvəl bütün data üzərində çağırılıb"
        feedback: Doğru! Test dəstinin mean və std-si train-ə sızıb.
      - id: b
        text: "Target leakage: `refund_issued_amount` müştəri abunəni ləğv etdikdən sonra geri qaytarılan məbləğdir"
        feedback: Doğru! Bu sütun hədəf hadisənin nəticəsidir.
      - id: c
        text: "Duplicate/Oversampling leakage: `oversample_minority` split-dən əvvəl çağırıldığı üçün kopyalanmış eyni sətirlər həm train, həm də test-ə düşür"
        feedback: Doğru! Oversampling yalnız `X_train, y_train` üzərində edilməlidir.
      - id: d
        text: "`test_size=0.2` seçilməsi özü-özlüyündə data leakage yaradır"
        feedback: Xeyr, 20% test ölçüsü standartdır; problem split-dən əvvəl edilən əməliyyatlarda və `user_id` qruplaşmasının olmamasındadır.
    answers: [a, b, c]
    explanation: Bu 5 sətirlik kodda həm preprocessing leakage, həm target leakage, həm də split-öncəsi oversampling leakage eyni vaxtda baş verib — test dəqiqliyi 99% çıxacaq, amma model real həyatda işləməyəcək.
