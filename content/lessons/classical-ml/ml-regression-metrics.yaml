          pass
    tests:
      - name: 4 nöqtəli outlier nümunəsi (MAE=6.0, RMSE=sqrt(84))
        code: |
          y = [100.0, 150.0, 200.0, 350.0]
          p = [102.0, 148.0, 198.0, 332.0]
          mae, rmse = mae_and_rmse(y, p)
          assert abs(mae - 6.0) < 1e-9, f"MAE 6.0 olmalı idi, alınan {mae}"
          assert abs(rmse - math.sqrt(84.0)) < 1e-9, f"RMSE səhvdir: {rmse}"
      - name: Sabit xətada MAE == RMSE
        code: |
          mae, rmse = mae_and_rmse([10.0, 20.0], [13.0, 17.0])
          assert abs(mae - 3.0) < 1e-9 and abs(rmse - 3.0) < 1e-9
      - name: Mükəmməl proqnozda (0.0, 0.0)
        code: |
          assert mae_and_rmse([1.5, -2.0], [1.5, -2.0]) == (0.0, 0.0)
      - name: Boş list və ya fərqli uzunluqda ValueError
        code: |
          for bad in [([], []), ([1.0, 2.0], [1.0]), ([], [1.0])]:
              try:
                  mae_and_rmse(bad[0], bad[1])
                  assert False, f"{bad} üçün ValueError qaldırılmalı idi"
              except ValueError:
                  pass
    solution: |
      import math


      def mae_and_rmse(
          y_true: list[float], y_pred: list[float]
      ) -> tuple[float, float]:
          if not y_true or len(y_true) != len(y_pred):
              raise ValueError("y_true and y_pred must have equal non-zero length")
          n = len(y_true)
          mae = sum(abs(yt - yp) for yt, yp in zip(y_true, y_pred)) / n
          mse = sum((yt - yp) ** 2 for yt, yp in zip(y_true, y_pred)) / n
          return mae, math.sqrt(mse)
    explanation: |
      Funksiya əvvəlcə müqavilənin ilkin şərtlərini (boş olmamaq və bərabər uzunluq) yoxlayır, sonra isə tərifə uyğun olaraq MAE və $\sqrt{\text{MSE}}$ qaytarır.
