quiz:
  pass_threshold: 0.75
  questions:
    - id: q-mlgb-gini-pure
      type: numeric
      title: "Gini Impurity hesabı"
      prompt: |
        Bir qərar ağacı düyməsində 10 nümunə var: onların 8-i `1` sinfinə, 2-si isə `0` sinfinə aiddir.
        Bu düymənin **Gini Impurity ($G = 1 - \sum p_k^2$)** dəyərini hesabla.
      skills: [ml-algorithms]
      category: math
      answer: 0.32
      tolerance: 0.005
      hints:
        - "$p_1 = 8/10 = 0.8$ və $p_0 = 2/10 = 0.2$."
        - "$G = 1 - (0.8^2 + 0.2^2)$ ifadəsini hesabla."
      explanation: "$p_1 = 0.8, p_0 = 0.2 \\implies G = 1 - (0.64 + 0.04) = 1 - 0.68 = 0.32$."
    - id: q-mlgb-bagging-vs-boosting
      type: mcq
      title: "Random Forest vs Gradient Boosting"
      prompt: "Gradient Boosted Decision Trees (GBDT) modelində hər yeni ağac ($h_m$) nəyi proqnozlaşdırmaq üçün öyrədilir?"
      skills: [ml-algorithms]
      category: concept
      options:
        - id: a
          text: "Orijinal hədəf dəyərini ($y$) təsadüfi bootstrap seçməsi üzərində sıfırdan proqnozlaşdırmaq üçün"
          feedback: "Xeyr — bu Random Forest (Bagging) yanaşmasıdır."
        - id: b
          text: "Əvvəlki ağaclar ansamblının buraxdığı qalıq xətaları (pseudo-residuals $r_i^{(m)} = y_i - \\hat{y}_i^{(m-1)}$) proqnozlaşdırmaq üçün"
          feedback: "Doğru! GBDT-də hər yeni ağac əvvəlki mərhələnin qalıq xətasını (loss-un mənfi qradiyentini) düzəltməyə öyrədilir."
        - id: c
          text: "Əvvəlki ağacın ən yüksək Gini qarışıqlığına malik yarpağını iki yerə bölmək üçün"
          feedback: "Xeyr — hər ağac bütün nümunələrin cari qalıq xətaları üzərində yeni ağac kimi qurulur."
        - id: d
          text: "Xüsusiyyətlərin sayını PCA kimi azaltmaq üçün"
          feedback: "Xeyr — GBDT nəzarətli (supervised) ansambl modelidir, ölçü azaltma metodu deyil."
      answer: b
      explanation: "Gradient Boosting-də $m$-ci ağac orijinal $y$-ə deyil, cari ansamblın buraxdığı pseudo-residual-lara ($r_i^{(m)}$) fit olunur və $\\eta$ əmsalı ilə proqnoza əlavə edilir."
    - id: q-mlgb-hyperparams-multi
      type: multi
      title: "GBDT-də overfitting-i azaltmaq"
      prompt: "Gradient Boosting modelin training-də `ROC-AUC = 0.99`, validation-da isə `ROC-AUC = 0.74` göstərir. Overfitting-i azaltmaq üçün hansı addımlar doğrudur? **Hamısını seç.**"
      skills: [ml-algorithms, ml-generalization]
      category: concept
      options:
        - id: a
          text: "`max_depth` dəyərini `12`-dən `4`-ə endirmək"
          feedback: "Doğru — dayaz ağaclar yüksək dərəcəli saxta qarşılıqlı təsirləri əzbərləyə bilmir."
        - id: b
          text: "Validation dəsti üzərində `early_stopping` aktivləşdirmək"
          feedback: "Doğru — validation loss pisləşməyə başlayanda əlavə ağacların qurulmasını dayandırır."
        - id: c
          text: "`min_samples_leaf` dəyərini artırmaq (məsələn, `1`-dən `30`-a)"
          feedback: "Doğru — yarpaqların tək-tük küylü nümunələrə uyğunlaşmasının qarşısını alır."
        - id: d
          text: "`learning_rate`-i `0.05`-dən `0.8`-ə qaldırmaq və `max_depth=20` etmək"
          feedback: "Yanlış — böyük learning rate və çox dərin ağaclar GBDT-də overfitting-i daha da şiddətləndirir."
      answers: [a, b, c]
      explanation: "Dayaz ağaclar (`max_depth=3..6`), daha böyük `min_samples_leaf`, kiçik `learning_rate` və `early_stopping` GBDT-nin əsas requlyarizasiya mexanizmləridir."
    - id: q-mlgb-tree-extrapolation
      type: mcq
      title: "Ağac modellərinin ekstrapolyasiya davranışı"
      prompt: |
        Training datasında reklam büdcəsi $x \in [10, 100]$ min AZN, satışlar isə $y \in [50, 400]$ min AZN aralığındadır.
        Öyrədilmiş Gradient Boosting modelinə $x = 250$ min AZN (training aralığından çox yuxarı) verdikdə model necə davranacaq?
      skills: [ml-algorithms, ml-generalization]
      category: concept
      options:
        - id: a
          text: "Xətti trendi davam etdirib təxminən 1000 min AZN proqnoz verəcək"
          feedback: "Xeyr — qərar ağacları yarpaqlarda xətti tənlik yox, sabit ədəd saxlayır."
        - id: b
          text: "Training aralığının ən yuxarı sərhədindəki (`x <= 100`) yarpaqların verdiyi maksimum proqnoza (~400 min AZN) yaxın sabit dəyər qaytaracaq"
          feedback: "Doğru! Ağacdakı sonuncu `x >= 95` kimi şərt $x=100$ üçün də, $x=250$ üçün də eyni sağ yarpağa düşür."
        - id: c
          text: "Avtomatik olaraq `ValueError` qaldıracaq"
          feedback: "Xeyr — ağac modeli istənilən ədədi `if-else` budaqlarından keçirib mövcud yarpaqlardan birinə salır."
      answer: b
      explanation: "Qərar ağacları və onların ansamblları (RF, GBDT) training diapazonundan kənarda ekstrapolyasiya edə bilmir; ən kənar yarpağın sabit dəyərini qaytarır."
exercises:
  - id: ex-mlgb-gini-and-boosting
    type: code
    title: "Gini Impurity və Gradient Boosting proqnoz toplayıcısını yaz"
    prompt: |
      İki funksiyanı müqaviləyə uyğun implementasiya et:

      1. `gini_impurity(labels: list[int]) -> float`:
         - Verilmiş sinif etiketləri siyahısı üçün $G = 1 - \sum_{k} p_k^2$ hesablayır.
         - Əgər `labels` boşdursa (`[]`), `0.0` qaytarır.

      2. `gradient_boosting_predictions(init_pred: float, tree_outputs_per_sample: list[list[float]], lr: float) -> list[float]`:
         - `init_pred` ($\hat{y}_0$): bütün nümunələr üçün başlanğıc proqnoz.
         - `tree_outputs_per_sample`: hər nümunə ($i$) üçün ardıcıl ağacların çıxışları siyahısı $[h_1(x_i), h_2(x_i), \dots, h_M(x_i)]$.
         - `lr` ($\eta$): learning rate. Əgər `lr <= 0` olarsa, `ValueError` qaldırmalıdır.
         - Hər nümunə üçün $\hat{y}_i = \hat{y}_0 + \eta \sum_{m=1}^{M} h_m(x_i)$ dəyərini hesablayıb yeni `list[float]` qaytarır.
    skills: [ml-algorithms, ml-generalization]
    category: python
    difficulty: 2
    hints:
      - "`gini_impurity` üçün boş list-i əvvəlcə yoxla (`if not labels: return 0.0`), sonra hər sinfin sayını `len(labels)`-ə bölərək kvadratlarını cəmlə."
      - "`gradient_boosting_predictions` daxilində əvvəlcə `if lr <= 0: raise ValueError(...)` yoxlamasını yaz."
      - "Hər `sample_trees` siyahısı üçün `init_pred + lr * sum(sample_trees)` ifadəsi yekun proqnozu verir."
    starter_code: |
      def gini_impurity(labels: list[int]) -> float:
          # TODO: G = 1 - sum(p_k^2) hesabla (boş list üçün 0.0)
          return -1.0


      def gradient_boosting_predictions(
          init_pred: float,
          tree_outputs_per_sample: list[list[float]],
          lr: float,
      ) -> list[float]:
          # TODO: lr <= 0 olduqda ValueError qaldır; y_hat = init_pred + lr * sum(h_m) hesabla
          return []
    tests:
      - name: "Gini Impurity: təmiz, bərabər və qeyri-bərabər paylanmalar"
        code: |
          assert gini_impurity([]) == 0.0, "Boş list üçün 0.0 qaytarılmalıdır"
          assert abs(gini_impurity([1, 1, 1, 1]) - 0.0) < 1e-9, "Təmiz düymə üçün Gini 0.0 olmalıdır"
          assert abs(gini_impurity([1, 0, 1, 0]) - 0.5) < 1e-9, "50/50 bölünmə üçün Gini 0.5 olmalıdır"
          assert abs(gini_impurity([1, 0, 0, 0]) - 0.375) < 1e-9, "[1, 0, 0, 0] üçün Gini 0.375 olmalıdır"
      - name: "Gradient Boosting: ardıcıl ağac çıxışlarının toplanması"
        code: |
          preds = gradient_boosting_predictions(
              init_pred=50.0,
              tree_outputs_per_sample=[[30.0, 20.0], [-10.0, -5.0]],
              lr=0.2,
          )
          assert len(preds) == 2
          assert abs(preds[0] - 60.0) < 1e-9, f"1-ci nümunə üçün 60.0 gözlənilirdi, alınan: {preds[0]}"
          assert abs(preds[1] - 47.0) < 1e-9, f"2-ci nümunə üçün 47.0 gözlənilirdi, alınan: {preds[1]}"
      - name: "Gradient Boosting: lr <= 0 olduqda ValueError və boş nümunələr"
        code: |
          assert gradient_boosting_predictions(10.0, [], 0.1) == []
          raised = False
          try:
              gradient_boosting_predictions(10.0, [[1.0]], 0.0)
          except ValueError:
              raised = True
          assert raised, "lr <= 0 olduqda ValueError qaldırılmalıdır"
    solution: |
      def gini_impurity(labels: list[int]) -> float:
          if not labels:
              return 0.0
          n = len(labels)
          counts: dict[int, int] = {}
          for label in labels:
              counts[label] = counts.get(label, 0) + 1
          return 1.0 - sum((count / n) ** 2 for count in counts.values())


      def gradient_boosting_predictions(
          init_pred: float,
          tree_outputs_per_sample: list[list[float]],
          lr: float,
      ) -> list[float]:
          if lr <= 0:
              raise ValueError("lr must be positive")
          return [init_pred + lr * sum(outputs) for outputs in tree_outputs_per_sample]
    explanation: |
      `gini_impurity` hər sinfin nisbi tezliyini ($p_k = c_k / n$) tapıb $1 - \sum p_k^2$ hesablayır. `gradient_boosting_predictions` isə hər nümunə üzrə bütün ağacların düzəlişlərini $\eta$ (`lr`) ilə vurub başlanğıc proqnoza əlavə edir.
  - id: ex-mlgb-residual-numeric
    type: numeric
    title: "Gradient Boosting: 1-ci addımdan sonra yenilənmiş proqnoz"
    prompt: |
      Gradient Boosting reqressiya modelində bir nümunə üçün:
      - Həqiqi hədəf dəyəri: $y = 80$
      - Başlanğıc proqnoz: $\hat{y}^{(0)} = 50$
      - 1-ci ağacın həmin nümunə üçün çıxışı: $h_1(x) = 30$
      - Learning rate (shrinkage): $\eta = 0.2$

      1-ci ağac əlavə olunduqdan sonra yenilənmiş proqnozu ($\hat{y}^{(1)} = \hat{y}^{(0)} + \eta \cdot h_1(x)$) hesabla.
    skills: [ml-algorithms]
    category: math
    difficulty: 1
    answer: 56
    tolerance: 0.01
    hints:
      - "Yenilənmə düsturu: $\\hat{y}^{(1)} = \\hat{y}^{(0)} + \\eta \\cdot h_1(x)$."
      - "$50 + 0.2 \\times 30$ ifadəsini hesabla."
    explanation: "$\\hat{y}^{(1)} = 50 + 0.2 \\times 30 = 50 + 6 = 56$. Növbəti (2-ci) ağacın öyrənəcəyi qalıq xəta isə $r^{(2)} = 80 - 56 = 24$ olacaq."
