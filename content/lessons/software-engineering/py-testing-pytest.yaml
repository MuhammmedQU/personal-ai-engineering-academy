    solution: |
      import math

      def verify_z_score_fn(fn) -> bool:
          try:
              if fn([]) != []:
                  return False
              if fn([5.0, 5.0]) != [0.0, 0.0]:
                  return False
              inp = [1.0, 2.0, 3.0]
              out = fn(inp)
              if inp != [1.0, 2.0, 3.0] or out is inp:
                  return False
              if len(out) != 3:
                  return False
              if not (out[0] < 0.0 and math.isclose(out[1], 0.0, abs_tol=1e-6) and out[2] > 0.0):
                  return False
              if not math.isclose(sum(out) / 3.0, 0.0, abs_tol=1e-6):
                  return False
              return True
          except Exception:
              return False
    explanation: |
      Test dəstinin gücü onun nə qədər bug-lı implementasiyanı rədd edə bilməsi ilə ölçülür. `verify_z_score_fn` həm boş siyahını, həm sıfır dispersiyanı (`[5.0, 5.0]`), həm input mutasiyasını, həm də riyazi nəticəni yoxlayır.
