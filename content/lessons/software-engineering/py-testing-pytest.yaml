              s = (sum((x - m) ** 2 for x in xs) / len(xs)) ** 0.5
              return [(x - m) / s for x in xs]

          def buggy_mutates(xs):
              if not xs:
                  return []
              m = sum(xs) / len(xs)
              var = sum((x - m) ** 2 for x in xs) / len(xs)
              s = var ** 0.5 if var > 0 else 1.0
              for i in range(len(xs)):
                  xs[i] = (xs[i] - m) / s if var > 0 else 0.0
              return xs

