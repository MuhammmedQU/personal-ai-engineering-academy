      type: mcq
      title: "CI/CD-də set -o pipefail niyə vacibdir?"
      prompt: "CI pipeline skriptində `pytest tests/ | tee test.log` yazılıb və `set -o pipefail` aktiv deyil. `pytest` uğursuz olub `exit code = 1` qaytarsa, `tee` isə uğurla yazıb `0` qaytarsa nə baş verər?"
      skills: [linux-cli, debugging]
