        - id: b
          text: "Linux avtomatik olaraq `tee` prosesini bloklayır və 1 qaytarır"
          feedback: "Yanlışdır — `pipefail` aktiv edilmədikcə Bash yalnız sonuncu əmrin koduna baxır."
        - id: c
          text: "`test.log` faylı boş qalır"
          feedback: "Yanlışdır — `tee` çıxışı normal şəkildə fayla yazır və `0` qaytarır."
      answer: a
      explanation: "Standart halda Bash pipe-ın çıxış kodu ən sağdakı əmrin çıxış kodudur. `set -euo pipefail` əlavə etməklə zəncirin istənilən yerindəki xətanın CI-ı dayandırmasını təmin edirsən."
    - id: q-linux-sigterm-vs-sigkill
      type: mcq
      title: "SIGTERM (15) vs SIGKILL (9)"
      prompt: "Production-da işləyən model serving API-sini yeniləmək üçün dayandırmaq lazımdır. Niyə əvvəlcə `kill -TERM` (15) göndərib, dərhal `kill -9` işlətmirik?"
      skills: [linux-cli]
      category: concept
      options:
        - id: a
          text: "`SIGTERM` prosesə cari sorğuları tamamlamaq, buffer-ləri və verilənlər bazası əməliyyatlarını təmiz bağlamaq (graceful shutdown) imkanı verir"
          feedback: "Doğrudur! `SIGKILL` isə nüvə tərəfindən prosesi dərhal məhv edir, ona görə yarımçıq yazılmış fayl və ya kəsilmiş istifadəçi sorğuları qala bilər."
        - id: b
          text: "`kill -9` yalnız root istifadəçi tərəfindən işlədilə bilər"
          feedback: "Yanlışdır — öz prosesinə istənilən siqnalı göndərə bilərsən; fərq təmiz bağlanma (graceful shutdown) mexanizmindədir."
        - id: c
          text: "`SIGTERM` prosesin yaddaşını ikiqat artırır"
          feedback: "Yanlışdır — `SIGTERM` sadəcə proqramın tuta bildiyi təmiz dayanma siqnalıdır."
      answer: a
      explanation: "`SIGTERM` (15) tətbiq tərəfindən tutula bilir və graceful shutdown (checkpoint saxlama, açıq HTTP sorğularını bitirmə) edir; `SIGKILL` (9) yalnız donmuş proseslər üçün son çarədir."
