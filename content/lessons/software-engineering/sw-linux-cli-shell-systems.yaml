      type: mcq
      title: "API açarı və SSH gizli açarı üçün düzgün chmod"
      prompt: "Uzaq Linux GPU serverində API açarlarını saxlayan `.env` faylı üçün **ən təhlükəsiz** POSIX icazəsi hansıdır?"
      skills: [linux-cli, prod-docker-config]
      category: production
      options:
        - id: a
          text: "`chmod 600 .env` (`rw-------`) — yalnız faylın sahibi oxuyub yaza bilər"
          feedback: "Doğrudur! Qrup və digər istifadəçilərin heç bir oxuma/yazma icazəsi yoxdur (least privilege)."
        - id: b
          text: "`chmod 644 .env` (`rw-r--r--`) — hər kəs oxuya bilər"
          feedback: "Yanlışdır — serverdəki digər istifadəçilər və ya aşağı imtiyazlı proseslər açarları oxuya bilər."
        - id: c
          text: "`chmod 777 .env` (`rwxrwxrwx`) — tam giriş"
          feedback: "Kritik təhlükəsizlik səhvidir; hər kəs faylı həm oxuya, həm də dəyişə bilər."
      answer: a
      explanation: "Gizli açarlar (`id_ed25519`, `.env`, `local-secrets.json`) üçün minimum imtiyaz `600` (`rw-------`)-dir; hətta OpenSSH `644` olan gizli açarı rədd edir."
