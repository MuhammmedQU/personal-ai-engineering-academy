id: sw-linux-cli-shell-systems
track: software-engineering
module: linux-cli-fundamentals
title: "Linux, Command Line, POSIX İcazələri və AI Server Əməliyyatları"
summary: "AI modellərinin 99%-i Linux serverlərdə və konteynerlərdə işləyir. POSIX fayl icazələrinin (chmod 600 vs 755) bit riyaziyyatını, stdin/stdout/stderr axınlarını, pipe zəncirlərini, təhlükəsiz bash skriptlərini (set -euo pipefail), proses idarəsini (SIGTERM vs SIGKILL, tmux, systemd) və GPU server diaqnostikasını (nvidia-smi) öyrənəcəksən."
level: foundation
estimated_minutes: [45, 65]
prerequisites: [sw-git-debugging-structured-logging]
next: null
skills: [linux-cli, debugging, prod-docker-config]
objectives:
  - POSIX fayl icazələrinin (`r=4, w=2, x=1`) səkkizlik (octal) hesablamasını aparmaq və gizli açar faylları (`chmod 600`) üçün minimal imtiyaz prinsipini tətbiq etmək
  - Standart axınları (`stdin`, `stdout`, `stderr`), pipe (`|`), yönləndirmə (`>`, `2>&1`) və exit code (`$?`) mexanizmləri ilə log analizi qurmaq
  - "`set -euo pipefail` ilə səssiz xətaların qarşısını alan etibarlı shell skriptləri yazmaq"
  - Uzaq Linux/GPU serverlərində prosesləri (`ps`, `htop`, `SIGTERM` vs `SIGKILL`), uzun təlim sessiyalarını (`tmux`, `systemd`) və `nvidia-smi` VRAM göstəricilərini diaqnoz etmək
why_it_matters: |
  Sənin noutbukun Windows və ya macOS ola bilər, lakin **Docker konteynerlərinin, bulud GPU klasterlərinin, CI/CD runner-lərinin və production API serverlərinin demək olar ki hamısı Linux-dur**.

  Bir AI mühəndisi kimi qarşılaşacağın ən tipik real problemlər bunlardır:
  - SSH açarı və ya `.env` faylı `chmod 644` (hər kəs oxuya bilir) qaldığı üçün SSH qoşulmur və ya API açarı sızır.
  - 12 saatlıq PyTorch fine-tuning skriptini adi SSH terminalında başlatmısan; internetin 5 saniyəlik kəsilir, terminal bağlanır (`SIGHUP`) və 11 saatlıq təlim yarımçıq qırılır (çünki `tmux` və ya `systemd` işlətməmisən).
  - 2 GB-lıq server log faylını Excel və ya VS Code ilə açmağa çalışırsan və kompüter donur — halbuki `grep`, `awk`, `sort | uniq -c` 1 saniyəyə cavab verir.
terms:
  - term: POSIX Permissions (chmod)
    definition: Fayl və qovluqlar üçün Sahibi (User), Qrup (Group) və Digərləri (Other) üzrə Oxuma (`r=4`), Yazma (`w=2`) və İcra (`x=1`) icazə bitləri.
  - term: Standard Streams (stdin/stdout/stderr)
    definition: "Hər Linux prosesinin 3 standart kanalı — giriş (`0: stdin`), normal çıxış (`1: stdout`) və xəta çıxışı (`2: stderr`)."
  - term: Exit Code (Çıxış Kodu)
    definition: Proses bitdikdə əməliyyat sisteminə qaytardığı tam ədəd; `0` uğur, `1–255` isə xəta deməkdir.
  - term: Pipe (`|`)
    definition: Bir əmrin `stdout` çıxışını aralıq fayl yaratmadan birbaşa növbəti əmrin `stdin` girişinə ötürən axın operatoru.
  - term: SIGTERM vs SIGKILL
    definition: "`SIGTERM` (15) prosesə təmiz şəkildə dayanmaq (checkpoint yazmaq, bağlantını bağlamaq) şansı verir; `SIGKILL` (9) prosesi dərhal və zorla öldürür."
  - term: tmux (Terminal Multiplexer)
    definition: SSH bağlantısı qopsa belə serverdə arxa fonda işləməyə davam edən davamlı (persistent) terminal sessiya meneceri.
sections:
  - id: permissions-streams-processes
    kind: explanation
    title: "POSIX İcazələri, Standart Axınlar, Shell Təhlükəsizliyi və Proseslər"
    body: |
      ### 1. POSIX İcazə Riyaziyyatı (`chmod`)
      Linux-da `ls -l` əmri hər fayl üçün 9 icazə simvolu göstərir — 3 qrup (hər biri 3 bit):
      - **User (Sahib — u):** ilk 3 simvol
      - **Group (Qrup — g):** orta 3 simvol
      - **Other (Hamı — o):** son 3 simvol

      Hər qrupun dəyəri ikilik çəkilərin cəmidir:
      $$\text{read } (r) = 4, \quad \text{write } (w) = 2, \quad \text{execute } (x) = 1, \quad \text{yox } (-) = 0$$

      | Simvolik | Səkkizlik (Octal) | Mənası | AI Mühəndisliyində İstifadəsi |
      |---|---|---|---|
      | `rw-------` | `600` | Yalnız sahib oxuyub yaza bilər | `.env`, `local-secrets.json`, `~/.ssh/id_ed25519` |
      | `rw-r--r--` | `644` | Sahib yazır, hamı oxuyur | Konfiqurasiya şablonları, ictimai YAML/README |
      | `rwxr-xr-x` | `755` | Sahib yazır/icra edir, hamı icra edir | Deploy skriptləri (`train.sh`), qovluqlar |
      | `rwxrwxrwx` | `777` | Hamı hər şeyi dəyişib icra edə bilər | **HEÇ VAXT İSTİFADƏ ETMƏ** (kritik təhlükəsizlik boşluğu!) |

      ---

      ### 2. Standart Axınlar (`0`, `1`, `2`), Pipes və `set -euo pipefail`
      Hər əmr iki fərqli çıxış kanalına yazır: normal data **`1` (`stdout`)**, xətalar isə **`2` (`stderr`)** kanalına.
      - `python train.py > run.log 2>&1` — həm `stdout`, həm də `stderr`-i eyni fayla yönləndirir.
      - `grep "ERROR" api.log | awk '{print $4}' | sort | uniq -c | sort -nr | head -n 5` — 2 GB-lıq logu RAM-a tam yükləmədən (streaming!) ən çox xəta verən 5 endpoint-i tapır.

      **Bash skriptlərində qızıl ilk sətir:**
      ```bash
      #!/usr/bin/env bash
      set -euo pipefail
      ```
      - `-e` (`errexit`): İstənilən əmr sıfırdan fərqli exit code qaytarsa skripti dərhal dayandır.
      - `-u` (`nounset`): Təyin olunmamış dəyişən (məs. `$MODEL_DIR` boşdursa `rm -rf $MODEL_DIR/*` fəlakəti!) istifadə olunanda xəta ver.
      - `-o pipefail`: `cmd1 | cmd2` zəncirində `cmd1` uğursuz olsa belə, `cmd2` uğurlu bitdiyinə görə xətanın gizlədilməsinə imkan vermə.

      ---

      ### 3. Proses İdarəsi, `tmux`, `systemd` və GPU Diaqnostikası
      - **İlişmiş prosesi təmiz dayandırmaq:** Əvvəlcə `kill -TERM <PID>` (siqnal `15`) göndər ki, PyTorch modeli son checkpoint-i yaza və ya FastAPI cari HTTP sorğularını tamamlaya bilsin. Yalnız proses cavab vermədikdə `kill -9 <PID>` (`SIGKILL`) istifadə et.
      - **`tmux`:** Uzun təlimi `tmux new -s train_lora` içində başlat; ayrılmaq üçün `Ctrl+B`, sonra `D`; sabah geri qayıtmaq üçün `tmux attach -t train_lora`.
      - **`nvidia-smi`:** GPU VRAM istifadəsini, temperaturu və hansı PID-in yaddaşı tutduğunu göstərir. Əgər `GPU-Util` 5%-dirsə, amma VRAM 95%-dirsə — darboğaz GPU-da deyil, CPU `DataLoader` (I/O) tərəfindədir!
  - id: factory-assembly-line-analogy
    kind: analogy
    title: "Mental model: Konveyer xətti (Pipes) və Seyf açarı (chmod 600)"
    body: |
      Unix fəlsəfəsini bir zavod konveyeri kimi düşün:
      - **Hər CLI aləti bir ixtisaslaşmış işçi kimidir:** `grep` yalnız zədəli detalları seçir, `awk` yalnız etiket nömrəsini kəsib götürür, `sort` onları qruplaşdırır, `uniq -c` sayır.
      - **Pipe (`|`)** bu işçilər arasındakı konveyer lentidir: birinci işçi 1 milyon detalın hamısını bitirib anbara yığmağı gözləmir — hər detalı tapdıqca dərhal növbəti işçiyə ötürür. Buna görə 10 GB-lıq log faylı cəmi bir neçə MB RAM ilə saniyələr içində analiz olunur!
      - **`chmod 600`** isə şəxsi seyfin açarını yalnız öz cibində saxlamaqdır; `chmod 777` etmək isə seyfin qapısını açıq qoyub binadakı hər kəsə "buyurun, istədiyinizi dəyişin" deməkdir.
  - id: linux-pipeline-diagram
    kind: diagram
    title: "Linux Axınları (stdin/stdout/stderr) və Uzaq GPU Server İş Axını"
    body: |
      ```mermaid
      flowchart LR
        SSH["Lokal PC (SSH + Key 600)"] --> TMUX["Uzaq Linux Server (tmux sessiyası)"]
        TMUX --> TRAIN["python train.py"]
        TRAIN -- "fd 1 (stdout)" --> LOG["train.log"]
        TRAIN -- "fd 2 (stderr)" --> ERR["errors.log (və ya 2>&1)"]
        LOG --> GREP["grep 'ERROR'"]
        GREP --> AWK["awk / cut (endpoint çıxar)"]
        AWK --> UNIQ["sort | uniq -c | sort -nr"]
        UNIQ --> REPORT["Top Xəta Hesabatı"]
        TRAIN -. "Monitorinq" .-> NV["nvidia-smi & htop"]
      ```

      Bu axın sayəsində SSH əlaqəsi kəsilsə belə `tmux` prosesi yaşayır, bütün çıxışlar log fayllarına düşür və səhvlər axın (pipe) ilə anında diaqnoz edilir.
  - id: worked-chmod-and-exit-codes
    kind: worked_example
    title: "Addım-addım rəqəmlərlə: chmod bit hesabı və Pipe exit-code fərqi"
    body: |
      ### Hissə A: `rwxr-x---` icazəsini səkkizlik (octal) ədədə çevirmək
      9 simvolu 3-3 bölürük: `rwx` | `r-x` | `---`

      | Qrup | Simvollar | Bit hesabı ($r=4, w=2, x=1$) | Rəqəm |
      |---|---|---|---|
      | User (Sahib) | `rwx` | $4 + 2 + 1$ | **$7$** |
      | Group (Qrup) | `r-x` | $4 + 0 + 1$ | **$5$** |
      | Other (Digərləri) | `---` | $0 + 0 + 0$ | **$0$** |

      Yekun octal kod: **`750`** (`chmod 750 deploy.sh`).
      İndi müqayisə et: əgər `.env` faylı `rw-r--r--` (`644`) olarsa:
      - User = $4+2+0 = 6$
      - Group = $4+0+0 = 4$ (qrup üzvləri API açarını oxuya bilir!)
      - Other = $4+0+0 = 4$ (serverdəki bütün digər istifadəçilər oxuya bilir!)
      **Düzəliş:** `chmod 600 .env` (`rw-------` $\implies 6, 0, 0$).

      ---

      ### Hissə B: `pipefail` olmadan gizlənən xəta
      Təsəvvür et ki, CI/CD skriptində yazmısan:
      ```bash
      python eval_model.py | tee eval.log
      ```
      - `eval_model.py` çöksə və `exit code = 1` qaytarsa belə, `tee eval.log` əmri öz işini uğurla bitirib `exit code = 0` qaytarır!
      - **`set -o pipefail` yoxdursa:** bütün sətirin çıxış kodu son əmrin kodu (`0`) olur və CI/CD yaşıl (PASS) göstərərək sınıq modeli production-a buraxır!
      - **`set -o pipefail` varsa:** zəncirdə sıfırdan fərqli çıxış kodu (`1`) olduğu üçün bütün pipeline `1` (FAIL) qaytarır və buraxılışı dayandırır.
  - id: cli-and-python-log-code
    kind: code
    title: "Kod: Bash Təlim Skripti + Python-da POSIX İcazə və Log Analizatoru"
    body: |
      **1. Təhlükəsiz Production / Training Bash şablonu:**
      ```bash
      #!/usr/bin/env bash
      set -euo pipefail

      : "${MODEL_DIR:?MODEL_DIR env dəyişəni təyin olunmalıdır}"
      chmod 600 .env
      python -u train.py --out "$MODEL_DIR" 2>&1 | tee -a "$MODEL_DIR/train.log"
      ```

      **2. Python-da POSIX simvolik icazə analizatoru (təhlükəsizlik auditi üçün):**
      ```python
      def parse_chmod_octal(perm: str) -> dict[str, int | bool]:
          """Convert 9-char POSIX permission string (e.g. 'rw-------') to octal int & secret-safety flag."""
          if len(perm) != 9:
              raise ValueError("permission string must have exactly 9 characters")
          weights = (4, 2, 1)
          expected = ("r", "w", "x")
          digits: list[int] = []
          for group_idx in range(3):
              chunk = perm[group_idx * 3 : (group_idx + 1) * 3]
              val = 0
              for ch, exp_ch, w in zip(chunk, expected, weights):
                  if ch == exp_ch:
                      val += w
                  elif ch != "-":
                      raise ValueError(f"invalid permission char '{ch}' in '{chunk}'")
              digits.append(val)
          octal_int = digits[0] * 100 + digits[1] * 10 + digits[2]
          safe_for_secrets = (digits[1] == 0) and (digits[2] == 0)
          return {"octal": octal_int, "safe_for_secrets": safe_for_secrets}


      print(parse_chmod_octal("rw-------"))  # {'octal': 600, 'safe_for_secrets': True}
      print(parse_chmod_octal("rwxr-xr-x"))  # {'octal': 755, 'safe_for_secrets': False}
      ```
  - id: common-linux-mistakes
    kind: mistakes
    title: "Ən çox edilən Linux və CLI səhvləri"
    body: |
      **1. İcazə xətasını "həll etmək" üçün `chmod 777` işlətmək**
      `Permission denied` xətası aldıqda `chmod 777` yazmaq təhlükəsizlik baxımından fəlakətdir və SSH/Docker kimi sistemlər hətta `777` açar fayllarını qəsdən rədd edir. Həmişə faylın sahibini (`chown`) və minimal lazımi icazəni (`600` gizli fayl, `644` normal fayl, `755` skript) təyin et.

      **2. Uzun ML təlimini `tmux` / `screen` olmadan birbaşa SSH-da işlətmək**
      Wi-Fi kəsildiyi anda SSH sessiyası prosesə `SIGHUP` göndərir və 8 saatlıq GPU təlimi yarımçıq ölür. Həmişə `tmux` sessiyasında işlət və ya uzunmüddətli API-ləri `systemd` / Docker restart policy ilə idarə et.

      **3. `set -e` və `pipefail` olmadan deploy skripti yazmaq**
      Səssiz uğursuz olan `pytest | tee test.log` və ya boş `$TARGET_DIR` dəyişəni fəlakətli deploy və ya fayl silinməsinə səbəb olur. Hər skriptin əvvəlinə `set -euo pipefail` əlavə et.

      **4. Prosesi dərhal `kill -9` ilə öldürmək**
      `SIGKILL` (`-9`) prosesin fayl buffer-lərini boşaltmasına (flush) və SQLite/checkpoint yazısını tamamlamasına imkan vermir — fayl korlana bilər. Həmişə əvvəlcə `kill -TERM` (15) göndər.
  - id: linux-tradeoffs
    kind: tradeoffs
    title: "Mühəndislik seçimləri: Shell Pipes vs Python Skripti və tmux vs systemd"
    body: |
      - **Bash Pipes vs Python:** 1–3 sətirlik sürətli log axtarışı (`grep | awk | sort | uniq -c`) üçün shell pipes rəqibsiz sürətlidir. Lakin mürəkkəb JSON parsinqi, şərtli biznes məntiqi, retry və unit test tələb olunduqda Bash-ı uzatma — dərhal Python-a keç.
      - **`tmux` vs `systemd` / Docker:** İnteraktiv eksperimentlər və bir dəfəlik GPU təlimləri üçün `tmux` idealdır. Lakin 7/24 işləməli olan FastAPI model serveri üçün `tmux` işlətmə — server yenidən başlayanda (reboot) `tmux` avtomatik qalxmır; bunun üçün `systemd` və ya Docker `restart: unless-stopped` lazımdır.
