  - İstənilən 9 simvollu POSIX icazəsini səkkizlik (octal) koda çevirə və gizli açar faylı üçün təhlükəsiz olub-olmadığını müəyyən edə bilirsən
  - "`set -euo pipefail`, standart axın yönləndirməsi (`2>&1`) və `SIGTERM` vs `SIGKILL` fərqini izah edə bilirsən"
  - Server log sətirlərindən 5xx xəta faizini və ən problemli endpoint-ləri avtomatik çıxaran Python/CLI analizatoru yaza bilirsən
