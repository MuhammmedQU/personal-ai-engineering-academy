exercises:
  - id: ex-linux-chmod-audit
    type: code
    title: "POSIX icazə analizatoru (parse_chmod_octal) yaz"
    prompt: |
      9 simvollu POSIX icazə sətirini (məs. `"rw-------"` və ya `"rwxr-xr-x"`) səkkizlik (`octal`) ədədə çevirən və gizli açarlar üçün təhlükəsiz olub-olmadığını yoxlayan `parse_chmod_octal(perm: str) -> dict` funksiyasını yaz:

      **Müqavilə (Contract):**
      1. `perm` dəqiq 9 simvoldan ibarət olmalıdır (`len(perm) != 9` olarsa `ValueError` qaldır).
      2. Hər 3 simvolluq qrupda (`User`, `Group`, `Other`):
         - 0-cı simvol `'r'` (4) və ya `'-'` (0),
         - 1-ci simvol `'w'` (2) və ya `'-'` (0),
         - 2-ci simvol `'x'` (1) və ya `'-'` (0) olmalıdır; başqa simvol olarsa `ValueError` qaldır.
      3. `octal` açarı 3 rəqəmli tam ədəd olsun: `u * 100 + g * 10 + o` (məs. `"rw-------"` -> `600`, `"rwxr-xr-x"` -> `755`).
      4. `safe_for_secrets` açarı `True` olsun yalnız və yalnız **Group == 0 VƏ Other == 0** olduqda.
    skills: [linux-cli, prod-docker-config]
    category: python
    difficulty: 1
    hints:
      - "Hər qrup üçün `perm[i*3 : (i+1)*3]` dilimini götür və `('r', 4)`, `('w', 2)`, `('x', 1)` cütləri üzrə simvolları yoxla."
      - "Yalnız icazə verilən simvol (`'r'`/`'w'`/`'x'`) və ya `'-'` qəbul et; qalan hər simvolda `raise ValueError(...)`. `safe_for_secrets` isə `g == 0 and o == 0` şərtidir."
    starter_code: |
      def parse_chmod_octal(perm: str) -> dict:
          # TODO: 9 simvollu POSIX icazəsini yoxla, octal hesabla və safe_for_secrets qaytar
          return {"octal": 0, "safe_for_secrets": False}
    solution: |
      def parse_chmod_octal(perm: str) -> dict:
          if not isinstance(perm, str) or len(perm) != 9:
              raise ValueError("permission string must have length 9")
          spec = (("r", 4), ("w", 2), ("x", 1))
          digits = []
          for idx in range(3):
              chunk = perm[idx * 3 : (idx + 1) * 3]
              val = 0
              for ch, (expected, weight) in zip(chunk, spec):
                  if ch == expected:
                      val += weight
                  elif ch != "-":
                      raise ValueError(f"invalid char {ch!r}")
              digits.append(val)
          octal = digits[0] * 100 + digits[1] * 10 + digits[2]
          return {
              "octal": octal,
              "safe_for_secrets": digits[1] == 0 and digits[2] == 0,
          }
    tests:
      - name: "chmod 600 gizli açar faylı üçün təhlükəsizdir"
        code: |
          assert parse_chmod_octal("rw-------") == {"octal": 600, "safe_for_secrets": True}
      - name: "chmod 755 skript üçün düzgündür, gizli açar üçün təhlükəsiz deyil"
        code: |
          assert parse_chmod_octal("rwxr-xr-x") == {"octal": 755, "safe_for_secrets": False}
      - name: "chmod 640 qrup oxuma icazəsi olduğu üçün gizli açar üçün təhlükəsiz deyil"
        code: |
          assert parse_chmod_octal("rw-r-----") == {"octal": 640, "safe_for_secrets": False}
      - name: "Səhv uzunluq və ya səhv simvol mövqeyi ValueError qaldırır"
        code: |
          for bad in ("rw-", "xr-------", "rw-r--r--x"):
              try:
                  parse_chmod_octal(bad)
                  assert False, f"Should have failed for {bad}"
              except ValueError:
                  pass
    explanation: "POSIX icazələri 3 bitlik üç qrupdur (r=4, w=2, x=1). Gizli açar fayllarında Group və Other bitləri mütləq 0 olmalıdır (`600` və ya `400`), əks halda serverdəki digər istifadəçilər açarı oxuya bilər."
  - id: ex-linux-log-triage
    type: code
    title: "CLI log axınını (grep | awk | sort | uniq -c) Python-da yaz"
    prompt: |
      Server log sətirlərini (`"TIMESTAMP LEVEL METHOD ENDPOINT STATUS LATENCY_MS"` formatında) analiz edən `triage_access_logs(lines: list[str]) -> dict` funksiyasını yaz:

      Nümunə sətir: `"2026-11-20T10:00:01Z ERROR POST /api/predict 503 840"`

      **Müqavilə (Contract):**
      1. Boş sətirləri ötür.
      2. Hər etibarlı sətirdə boşluğa görə 6 sütun var: `endpoint = parts[3]`, `status = int(parts[4])`.
      3. Yalnız `status >= 500` olan sətirləri server xətası (`error_5xx_count`) kimi say və hər xətalı endpoint-in neçə dəfə 5xx verdiyini hesabla.
      4. Qaytar:
         - `"total_requests"`: etibarlı sorğuların ümumi sayı (`int`)
         - `"error_5xx_count"`: `status >= 500` olan sorğuların sayı (`int`)
         - `"error_rate"`: `round(error_5xx_count / total_requests, 4)` (əgər `total_requests == 0`, onda `0.0`)
         - `"top_failing_endpoint"`: ən çox 5xx verən endpoint adı (`str`), heç 5xx yoxdursa `None` (bərabərlik halında əlifba sırası ilə birinci endpoint).
    skills: [linux-cli, debugging]
    category: production
    difficulty: 2
    hints:
      - "Hər sətri `line.strip().split()` ilə böl; boşdursa `continue`. `endpoint = parts[3]`, `status = int(parts[4])`."
      - "5xx xətalarını `dict` və ya `Counter` içində topla. Bərabərlikdə əlifba sırası üçün `min(counts.items(), key=lambda kv: (-kv[1], kv[0]))[0]` üsulundan istifadə et."
    starter_code: |
      def triage_access_logs(lines: list[str]) -> dict:
          # TODO: total_requests, error_5xx_count, error_rate və top_failing_endpoint hesabla
          return {
              "total_requests": 0,
              "error_5xx_count": 0,
              "error_rate": 0.0,
              "top_failing_endpoint": None,
          }
    solution: |
      def triage_access_logs(lines: list[str]) -> dict:
          total = 0
          err_5xx = 0
          failing: dict[str, int] = {}
          for raw in lines:
              parts = raw.strip().split()
              if len(parts) < 6:
                  continue
              total += 1
              endpoint = parts[3]
              status = int(parts[4])
              if status >= 500:
                  err_5xx += 1
                  failing[endpoint] = failing.get(endpoint, 0) + 1
          top_ep = (
              min(failing.items(), key=lambda kv: (-kv[1], kv[0]))[0]
              if failing
              else None
          )
          rate = round(err_5xx / total, 4) if total > 0 else 0.0
          return {
              "total_requests": total,
              "error_5xx_count": err_5xx,
              "error_rate": rate,
              "top_failing_endpoint": top_ep,
          }
    tests:
      - name: "Normal və 5xx logların statistikasını və top failing endpoint-i tapır"
        code: |
          logs = [
              "2026-11-20T10:00:01Z INFO GET /health 200 4",
              "2026-11-20T10:00:02Z ERROR POST /api/predict 503 840",
              "2026-11-20T10:00:03Z WARN POST /api/predict 422 15",
              "2026-11-20T10:00:04Z ERROR POST /api/predict 500 910",
              "2026-11-20T10:00:05Z ERROR POST /api/embed 502 500",
          ]
          res = triage_access_logs(logs)
          assert res == {
              "total_requests": 5,
              "error_5xx_count": 3,
              "error_rate": 0.6,
              "top_failing_endpoint": "/api/predict",
          }
      - name: "Xəta olmadıqda top_failing_endpoint None olur"
        code: |
          logs = [
              "2026-11-20T10:00:01Z INFO GET /health 200 3",
              "2026-11-20T10:00:02Z WARN GET /items 404 9",
          ]
          res = triage_access_logs(logs)
          assert res["error_5xx_count"] == 0
          assert res["error_rate"] == 0.0
          assert res["top_failing_endpoint"] is None
      - name: "Boş siyahı və bərabərlik halı (əlifba sırası) düzgün işləyir"
        code: |
          assert triage_access_logs(["", "   "]) == {
              "total_requests": 0,
              "error_5xx_count": 0,
              "error_rate": 0.0,
              "top_failing_endpoint": None,
          }
          tie_logs = [
              "2026-11-20T10:00:01Z ERROR POST /z-api 500 100",
              "2026-11-20T10:00:02Z ERROR POST /a-api 503 120",
          ]
          assert triage_access_logs(tie_logs)["top_failing_endpoint"] == "/a-api"
    explanation: "Bu məntiq Linux terminalındakı `awk '$5 >= 500 {print $4}' access.log | sort | uniq -c | sort -nr | head -1` boru xəttinin ekvivalentidir — 4xx client xətaları ilə 5xx server nasazlıqlarını ayırır və deterministik olaraq ən problemli endpoint-i tapır."
