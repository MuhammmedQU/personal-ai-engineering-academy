quiz:
  pass_threshold: 0.75
  questions:
    - id: q-pyoop-frozen-dataclass
      type: mcq
      title: "@dataclass(frozen=True) davranışı"
      prompt: |
        ```python
        from dataclasses import dataclass

        @dataclass(frozen=True)
        class HyperParams:
            lr: float = 0.01

        hp = HyperParams()
        hp.lr = 0.001
        ```
        Bu kod işə düşəndə nə baş verir?
      skills: [py-data-structures, py-errors]
      category: predict-output
      options:
        - id: a
          text: "`hp.lr` dəyəri səssizcə `0.001` olur"
          feedback: "Xeyr — `frozen=True` sahələrin yenidən mənimsədilməsini qadağan edir."
        - id: b
          text: "`FrozenInstanceError` (DataClass xətası) qaldırılır"
          feedback: "Doğru! `frozen=True` obyekt yaradıldıqdan sonra atribut mənimsətməsinə icazə vermir."
        - id: c
          text: "`hp.lr` dəyişmir, amma xəta da çıxmır"
          feedback: "Python səssizcə rədd etmir, açıq exception qaldırır."
      answer: b
      explanation: "`@dataclass(frozen=True)` obyektin atributlarını dəyişməz edir. Yeni dəyər lazımdırsa `dataclasses.replace(hp, lr=0.001)` ilə yeni obyekt yaradılmalıdır."
    - id: q-pyoop-protocol-duck
      type: mcq
      title: "typing.Protocol nəyi tələb edir?"
      prompt: "Bir `FakeRetriever` sinfinin `RetrieverProtocol(Protocol)` tipinə uyğun sayılması üçün nə lazımdır?"
      skills: [py-functions]
      category: concept
      options:
        - id: a
          text: "`class FakeRetriever(RetrieverProtocol):` kimi açıq miras almaq məcburidir"
          feedback: "Xeyr, bu `abc.ABC` (nominal typing) qaydasıdır. `Protocol` struktur uyğunluğa baxır."
        - id: b
          text: "`RetrieverProtocol`-da təyin olunmuş metod adlarına və parametr/return imzalarına sahib olmaq kifayətdir"
          feedback: "Doğru! Structural subtyping (statik duck typing) yalnız metod imzalarının uyğunluğunu yoxlayır."
        - id: c
          text: "`@implements(RetrieverProtocol)` dekoratoru əlavə etmək lazımdır"
          feedback: "Python standart kitabxanasında belə dekorator tələb olunmur."
      answer: b
      explanation: "`typing.Protocol` struktur alt-tipləmə təmin edir: sinif tələb olunan metod və xassələrə malikdirsə, irsiyyət olmadan həmin protokolu ödəyir."
    - id: q-pyoop-di-benefit
      type: multi
      title: "Dependency Injection üstünlükləri"
      prompt: "`RAGPipeline` sinfinin `llm_client` obyektini öz daxilində yaratmaq əvəzinə `__init__(self, llm_client: LLMProtocol)` vasitəsilə kənardan qəbul etməsinin (Dependency Injection) hansı üstünlükləri var? Hamısını seç."
      skills: [py-functions, py-errors]
      category: llm-architecture
      options:
        - id: a
          text: "Unit testlərdə real API açarı və internet olmadan sürətli `FakeLLMClient` ötürmək olur"
          feedback: "Bəli — deterministik və pulsuz test yazmağın əsas yolu budur."
        - id: b
          text: "OpenAI-dən lokal vLLM və ya Anthropic modelinə keçəndə `RAGPipeline` kodunu dəyişməyə ehtiyac qalmır"
          feedback: "Bəli — eyni protokolu ödəyən istənilən client ötürülə bilər."
        - id: c
          text: "Python kodunun sürətini avtomatik 10 dəfə artırır"
          feedback: "Xeyr — Dependency Injection arxitektura və test edilə bilmə üçündür, CPU sürətləndiricisi deyil."
        - id: d
          text: "Fərqli mühitlərdə (dev, staging, prod) fərqli konfiqurasiyalı client-ləri asanlıqla qoşmağa imkan verir"
          feedback: "Bəli — konfiqurasiya kənarda qurulub hazır obyekt kimi daxil edilir."
      answers: [a, b, d]
      explanation: "Dependency Injection komponentləri bir-birindən ayırır (decoupling): testləmə, provayder dəyişimi və mühit konfiqurasiyası kənardan idarə olunur."
    - id: q-pyoop-frozen-mutable-field
      type: mcq
      title: "Frozen dataclass-da tam dəyişməzlik"
      prompt: "`@dataclass(frozen=True)` daxilində ardıcıl etiketlər siyahısını tam dəyişməz (immutable) saxlamaq üçün hansı tip seçilməlidir?"
      skills: [py-data-structures]
      category: python
      options:
        - id: a
          text: "`tags: list[str]`"
          feedback: "`list` özü dəyişkəndir (`append` işləyəcək)."
        - id: b
          text: "`tags: tuple[str, ...] = ()`"
          feedback: "Doğru! `tuple` həm sıralıdır, həm də yaradıldıqdan sonra element əlavə/silmə əməliyyatına icazə vermir."
        - id: c
          text: "`tags: dict[str, int]`"
          feedback: "`dict` dəyişkən (mutable) struktur olduğundan içindəki açarlar dəyişdirilə bilər."
      answer: b
      explanation: "`frozen=True` yalnız atribut referansını dondurur. Tam dəyişməzlik üçün atributun öz tipi də immutable (`tuple`, `str`, `int`, `frozenset`) olmalıdır."
exercises:
  - id: ex-pyoop-pipeline-runner
    type: code
    title: "Modulyar və təhlükəsiz run_pipeline funksiyasını yaz"
    prompt: |
      Ardıcıl mətn/data emalı addımlarını icra edən `run_pipeline(record: dict, steps: list) -> dict` funksiyasını yaz.

      **Müqavilə (Contract):**
      1. Əgər `record` `dict` tipində deyilsə (`not isinstance(record, dict)`), `ValueError` qaldır.
      2. Çağıranın ötürdüyü `record` obyekti **heç bir halda dəyişdirilməməlidir** (hətta addımlardan biri arqument kimi aldığı lüğəti yerində dəyişsə və ya yarıda xəta versə belə).
      3. `steps` siyahısındakı hər bir `step` funksiyasını `0, 1, ...` ardıcıllığı ilə çağır (`out = step(dict(current))`).
      4. Əgər hər hansı addım `dict` olmayan nəticə qaytararsa (`not isinstance(out, dict)`), içində addımın indeksi (`idx`) olan `ValueError` qaldır (məsələn: `f"Step {idx} must return a dict"`).
      5. Sonda alınan yeni `dict`-i qaytar (`steps` boşdursa, `record`-un yeni dayaz kopyasını qaytar).
    skills: [py-functions, py-data-structures, py-errors]
    category: python
    difficulty: 2
    hints:
      - "Başlanğıcda `if not isinstance(record, dict): raise ValueError(\"record must be a dict\")` yoxla və `current = dict(record)` ilə kopya yarat."
      - "`for idx, step in enumerate(steps):` dövründə addımı `out = step(dict(current))` kimi çağır ki, addım öz arqumentini yerində dəyişsə belə əvvəlki vəziyyət və ilkin `record` korlanmasın."
      - "`if not isinstance(out, dict): raise ValueError(f\"Step {idx} must return a dict\")` yoxlamasından sonra `current = dict(out)` et."
    starter_code: |
      from typing import Callable

      def run_pipeline(record: dict, steps: list[Callable[[dict], dict]]) -> dict:
          # TODO: müqaviləyə uyğun implementasiya et
          return record
    tests:
      - name: "Ardıcıl addımların düzgün icrası"
        code: |
          steps = [
              lambda r: {**r, "text": r["text"].strip().lower()},
              lambda r: {**r, "length": len(r["text"])},
          ]
          res = run_pipeline({"text": "  AI Academy  "}, steps)
          assert res == {"text": "ai academy", "length": 10}, f"Alınan: {res}"
      - name: "İlkin record mutasiyadan qorunur (hətta addım in-place dəyişsə də)"
        code: |
          original = {"text": "hello", "count": 1}
          def mutating_step(r: dict) -> dict:
              r["count"] += 10
              return r
          out = run_pipeline(original, [mutating_step])
          assert original == {"text": "hello", "count": 1}, f"original dəyişdirilib: {original}"
          assert out == {"text": "hello", "count": 11}
          assert run_pipeline(original, []) is not original, "Boş steps üçün də yeni dict qaytarılmalıdır"
      - name: "Addım dict qaytarmadıqda addım indeksi ilə ValueError qaldırır"
        code: |
          steps = [
              lambda r: {**r, "ok": True},
              lambda r: None,
          ]
          original = {"a": 1}
          raised = False
          try:
              run_pipeline(original, steps)
          except ValueError as exc:
              raised = True
              assert "1" in str(exc), f"Xəta mesajında addım indeksi (1) olmalıdır: {exc}"
          assert raised, "dict qaytarmayan addım üçün ValueError qaldırılmalıdır"
          assert original == {"a": 1}, "Xəta zamanı da original dəyişməməlidir"
      - name: "Yanlış record tipi üçün ValueError"
        code: |
          raised = False
          try:
              run_pipeline(["not-a-dict"], [])
          except ValueError:
              raised = True
          assert raised, "dict olmayan record üçün ValueError qaldırılmalıdır"
    solution: |
      from typing import Callable

      def run_pipeline(record: dict, steps: list[Callable[[dict], dict]]) -> dict:
          if not isinstance(record, dict):
              raise ValueError("record must be a dict")
          current = dict(record)
          for idx, step in enumerate(steps):
              out = step(dict(current))
              if not isinstance(out, dict):
                  raise ValueError(f"Step {idx} must return a dict, got {type(out).__name__}")
              current = dict(out)
          return current
    explanation: |
      `current = dict(record)` və hər addıma `dict(current)` ötürülməsi çağıranın məlumatını tam təcrid edir. `enumerate(steps)` vasitəsilə hansı addımın müqaviləni pozduğu (`not isinstance(out, dict)`) dərhal indeks ilə birlikdə bildirilir.
