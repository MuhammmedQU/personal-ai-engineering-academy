    solution: |
      import sqlite3

      def compute_model_error_rates(
          predictions: list[tuple[int, str]],
          feedbacks: list[tuple[int, int]],
      ) -> list[tuple[str, int, int]]:
          conn = sqlite3.connect(":memory:")
          try:
              cur = conn.cursor()
              cur.execute(
                  "CREATE TABLE predictions (pred_id INTEGER PRIMARY KEY, model_version TEXT NOT NULL)"
              )
              cur.execute(
                  "CREATE TABLE feedbacks (pred_id INTEGER PRIMARY KEY, rating INTEGER NOT NULL)"
              )
              cur.executemany(
                  "INSERT INTO predictions (pred_id, model_version) VALUES (?, ?)",
                  predictions,
              )
              cur.executemany(
                  "INSERT INTO feedbacks (pred_id, rating) VALUES (?, ?)",
                  feedbacks,
              )
              cur.execute(
                  """
                  SELECT
                      p.model_version,
                      COUNT(p.pred_id) AS total_predictions,
                      SUM(CASE WHEN f.rating = -1 THEN 1 ELSE 0 END) AS thumbs_down_count
                  FROM predictions p
                  LEFT JOIN feedbacks f ON p.pred_id = f.pred_id
                  GROUP BY p.model_version
                  ORDER BY p.model_version ASC
                  """
              )
              return cur.fetchall()
          finally:
              conn.close()
    explanation: |
      `LEFT JOIN` bütün proqnozları qoruyub saxlayır, `SUM(CASE WHEN f.rating = -1 THEN 1 ELSE 0 END)` isə hətta bütün rəyləri `NULL` olan model versiyaları üçün də `0` qaytarır.
  - id: ex-sql-inner-vs-left-mcq
    type: mcq
    title: "Diaqnoz: ML təlim datasetində gizli Selection Bias"
    prompt: |
      Sığorta şirkətində müştəri risk modeli üçün təlim datası hazırlayan mühəndis belə bir SQL sorğusu yazıb:

      ```sql
      SELECT c.customer_id, c.age, c.car_age, SUM(cl.claim_amount) AS total_claim
      FROM customers c
      INNER JOIN user_claims cl ON c.customer_id = cl.customer_id
      GROUP BY c.customer_id, c.age, c.car_age;
      ```

      Bu dataset üzərində öyrədilən model production-da yeni müştərilərin **hamısına** həddindən artıq yüksək qəza riski proqnozlaşdırır. Kök səbəb nədir?
    skills: [sql-basics, py-data-structures]
    category: data
    difficulty: 2
    hints:
      - "Heç vaxt qəza törətməmiş (sağlam/təhlükəsiz) müştərilərin `user_claims` cədvəlində sətri varmı?"
      - "`INNER JOIN` sağ cədvəldə qarşılığı olmayan müştərilərlə nə edir?"
    options:
      - id: a
        text: "`GROUP BY` ifadəsində `c.age` sütununun yazılması orta dəyəri artırır"
        feedback: "`GROUP BY`-da müştəri atributlarının olması sadəcə hər müştəri üçün bir qrup yaradır."
      - id: b
        text: "`INNER JOIN` heç vaxt qəza iddiası (`user_claims`) olmayan bütün təhlükəsiz müştəriləri datasetdən sildiyi üçün model yalnız qəza törətmiş müştərilər üzərində öyrənib (selection bias)"
        feedback: "Doğru! Təhlükəsiz müştərilər (`total_claim = 0`) təlim datasından tamamilə çıxarılıb. `LEFT JOIN` və `COALESCE(SUM(cl.claim_amount), 0)` istifadə edilməli idi."
      - id: c
        text: "`SUM` funksiyası SQL-də yalnız müsbət ədədlərlə işləyir"
        feedback: "Problem `SUM`-da deyil, `0` qəzalı müştərilərin `INNER JOIN` tərəfindən atılmasındadır."
    answer: b
    explanation: |
      Hadisə (`claims`, `feedback`, `purchases`) cədvəlləri ilə `INNER JOIN` etmək hadisəsi olmayan bütün nümunələri (0 sinfini) silir. Düzgün həll: `LEFT JOIN user_claims` + `COALESCE(SUM(cl.claim_amount), 0)`.
