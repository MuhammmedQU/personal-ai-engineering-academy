  - "Production bug-ını reproduksiya, uğursuz test, feature branch və PR ardıcıllığı ilə sistemli şəkildə həll edə bilirsən"
  - "Hadisəyə uyğun düzgün `logging` səviyyəsini seçə və `request_id` daxil olan təhlükəsiz structured log qura bilirsən"
quiz:
  pass_threshold: 0.75
  questions:
    - id: q-gitdbg-bisect-calls
      type: numeric
      title: "git bisect addım sayı"
      prompt: "Sonuncu sağlam buraxılışla cari sınmış vəziyyət arasında $N = 1024$ commit var. `git bisect` (ikili axtarış) reqressiya yaradan dəqiq commit-i tapmaq üçün təxminən neçə yoxlama ($\\log_2(1024)$) aparır?"
      skills: [git-workflow, debugging]
      category: concept
      answer: 10
      tolerance: 1
      explanation: "$\\log_2(1024) = 10$. Xətti axtarışda 1024 yoxlama lazım olduğu halda, ikili axtarış hər addımda aralığı yarıya bölərək ~10 addımda hədəfi tapır."
    - id: q-gitdbg-log-level
      type: mcq
      title: "Düzgün logging səviyyəsinin seçilməsi"
      prompt: "RAG servisində əsas LLM provayderi `429 Rate Limit` verdiyi üçün sistem avtomatik olaraq ehtiyat (fallback) modelə keçdi və istifadəçiyə düzgün cavab qaytardı. Bu hadisə hansı səviyyədə loglanmalıdır?"
      skills: [prod-monitoring]
      category: production
      options:
        - id: a
          text: "`DEBUG`"
          feedback: "`DEBUG` production-da adətən bağlı olur; provayderin limitə dirənməsi isə mühəndislərin görməli olduğu siqnaldır."
        - id: b
          text: "`WARNING`"
          feedback: "Doğru! Sorğu uğurla tamamlanıb (ona görə `ERROR` deyil), lakin gözlənilməz vəziyyət baş verib və ehtiyat yola keçilib."
        - id: c
          text: "`CRITICAL`"
          feedback: "`CRITICAL` bütün sistemin çökdüyü hallar üçündür."
      answer: b
      explanation: "Sistem özünü bərpa edib istifadəçiyə cavab verə bilibsə, amma normal axından kənara çıxılıbsa (retry, fallback, deprecated istifadə), bu `WARNING` səviyyəsidir."
    - id: q-gitdbg-merge-conflict
      type: mcq
      title: "Merge conflict necə həll edilməlidir?"
      prompt: "Feature branch-ini yenilənmiş `main` ilə birləşdirərkən `evaluator.py` faylında merge conflict yarandı. Ən təhlükəsiz mühəndis addımı hansıdır?"
      skills: [git-workflow]
      category: concept
      options:
        - id: a
          text: "`git push --force origin main` ilə öz versiyanı birbaşa `main` üzərinə yazmaq"
          feedback: "Bu, komanda yoldaşlarının `main`-dəki işini silər və tarixçəni pozar!"
        - id: b
          text: "Konflikt markerləri (`<<<<<<<`, `=======`, `>>>>>>>`) arasındakı hər iki dəyişikliyi təhlil edib düzgün məntiqi birləşdirmək, markerləri silmək və testləri (`pytest`) işə salmaq"
          feedback: "Doğru! Hər iki tərəfin niyyəti qorunur və testlərlə təsdiqlənir."
        - id: c
          text: "Konflikt markerlərini faylın içində saxlayıb birbaşa commit etmək"
          feedback: "Markerlər Python-da `SyntaxError` yaradacaq."
      answer: b
      explanation: "Merge conflict avtomatik birləşdirilə bilməyən üst-üstə düşən dəyişiklikdir. Hər iki tərəfin kodu oxunmalı, markerlər təmizlənməli və test dəsti işə salınmalıdır."
    - id: q-gitdbg-structured-log-fields
      type: multi
      title: "Production structured log-da nə olmalıdır?"
      prompt: "Production-da işləyən AI API-nin structured JSON loglarında hansı sahələrin olması yaxşı mühəndislik praktikasıdır? Hamısını seç."
      skills: [prod-monitoring, debugging]
      category: production
      options:
        - id: a
          text: "`request_id` (sorğunu bütün mərhələlərdə izləmək üçün korrelyasiya identifikatoru)"
          feedback: "Bəli — eyni sorğunun retrieval, prompt və LLM loglarını birləşdirməyin yeganə yoludur."
        - id: b
          text: "`latency_ms` və `model_version` (performans və model reqressiyasını ölçmək üçün)"
          feedback: "Bəli — hansı model versiyasının gecikmə yaratdığını dərhal göstərir."
        - id: c
          text: "İstifadəçinin açıq şifrəsi və OpenAI `sk-...` gizli API açarı"
          feedback: "Xeyr! Gizli açarlar və həssas fərdi məlumatlar heç vaxt loglara yazılmamalıdır."
        - id: d
          text: "`level` və `event` (hadisənin ağırlıq dərəcəsi və standart adı)"
          feedback: "Bəli — avtomatik alert və axtarış filtrləri bu sahələr üzərində qurulur."
      answers: [a, b, d]
      explanation: "Yaxşı structured log diaqnostika üçün lazım olan metadataya (`request_id`, `event`, `level`, `latency_ms`, `model_version`) malik olur və gizli məlumatları (secrets/PII) qətiyyən sızdırmır."
exercises:
  - id: ex-gitdbg-bisect-first-bad
    type: code
    title: "git bisect alqoritmini yaz: find_first_bad_commit"
    prompt: |
      Xronoloji sıralanmış `commits: list[str]` siyahısında bug-ı daxil edən **ilk** commit-i ikili axtarışla (binary search) tapan `find_first_bad_commit(commits, is_bad_fn)` funksiyasını yaz.

      **Müqavilə (Contract):**
      1. `commits` siyahısında müəyyən indeksdən əvvəlki bütün commit-lər sağlamdır (`is_bad_fn(c) == False`), həmin indeksdən başlayaraq sonrakı bütün commit-lər xətalıdır (`is_bad_fn(c) == True`).
      2. Əgər siyahı boşdursa və ya heç bir commit xətalı deyilsə, `None` qaytar.
      3. Funksiya xətti axtarış ($O(N)$) **etməməlidir**: `is_bad_fn` funksiyasını ən çoxu $\lfloor \log_2(N) \rfloor + 1$ dəfə çağırmalıdır (testlərdə çağırış sayğacı yoxlanılır!).
    skills: [git-workflow, debugging]
    category: python
    difficulty: 2
    hints:
      - "`lo = 0`, `hi = len(commits) - 1` və `first_bad = None` dəyişənləri ilə başla."
      - "`while lo <= hi:` dövründə `mid = (lo + hi) // 2` hesabla və `is_bad_fn(commits[mid])`-i yalnız BİR dəfə çağır."
      - "Əgər `is_bad_fn(commits[mid])` `True`-dursa, `first_bad = commits[mid]` yadda saxla və daha əvvəlki xətalı commit-i yoxlamaq üçün `hi = mid - 1` et; əks halda `lo = mid + 1` et."
    starter_code: |
      from typing import Callable

      def find_first_bad_commit(
          commits: list[str],
          is_bad_fn: Callable[[str], bool],
      ) -> str | None:
          # TODO: O(log N) ikili axtarış ilə ilk bad commit-i tap
