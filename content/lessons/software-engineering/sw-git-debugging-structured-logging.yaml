    tests:
      - name: "Ortadakı ilk bad commit-i düzgün tapır"
        code: |
          commits = [f"c{i}" for i in range(10)]
          res = find_first_bad_commit(commits, lambda c: int(c[1:]) >= 6)
          assert res == "c6", f"Gözlənilən 'c6', alınan {res}"
      - name: "O(log N) çağırış limiti: 1024 commit üçün ən çoxu 11 yoxlama edir"
        code: |
          commits = [f"c{i}" for i in range(1024)]
          calls = [0]
          def tracked_is_bad(c: str) -> bool:
              calls[0] += 1
              return int(c[1:]) >= 713
          res = find_first_bad_commit(commits, tracked_is_bad)
          assert res == "c713", f"Gözlənilən 'c713', alınan {res}"
          assert calls[0] <= 11, f"Çox sayda is_bad_fn çağırışı edildi ({calls[0]} > 11) — xətti axtarış yox, binary search istifadə et!"
      - name: "Sərhəd halları: ilk commit xətalıdır, heç biri xətalı deyil, boş siyahı"
        code: |
          assert find_first_bad_commit(["a", "b", "c"], lambda _: True) == "a"
          assert find_first_bad_commit(["a", "b", "c"], lambda _: False) is None
          assert find_first_bad_commit([], lambda _: True) is None
    solution: |
      from typing import Callable

      def find_first_bad_commit(
          commits: list[str],
          is_bad_fn: Callable[[str], bool],
      ) -> str | None:
          lo, hi = 0, len(commits) - 1
          first_bad: str | None = None
          while lo <= hi:
              mid = (lo + hi) // 2
              if is_bad_fn(commits[mid]):
                  first_bad = commits[mid]
                  hi = mid - 1
              else:
                  lo = mid + 1
          return first_bad
    explanation: |
      İkili axtarış hər addımda `[lo, hi]` intervalını yarıya bölür. `is_bad_fn(commits[mid])` doğru olduqda `first_bad` yenilənir və daha erkən indeksdəki xətalı commit-i axtarmaq üçün `hi = mid - 1` edilir.
