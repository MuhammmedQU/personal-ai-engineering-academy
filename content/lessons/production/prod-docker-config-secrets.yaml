  - "Gizli açarların niyə Dockerfile-a, Git-ə və ya frontend koduna qoyulmamalı olduğunu və sızma halında nə etmək lazım olduğunu bilirsən"
quiz:
  pass_threshold: 0.75
  questions:
    - id: q-proddock-layer-caching
      type: mcq
      title: "Dockerfile-da Layer Caching"
      prompt: "Niyə `Dockerfile`-da `COPY requirements.txt .` və `RUN pip install -r requirements.txt` sətirləri `COPY . .` sətrindən **əvvəl** yazılmalıdır?"
      skills: [prod-docker-config]
      category: production
      options:
        - id: a
          text: "Mənbə kodunda dəyişiklik edildikdə ağır pip install qatının keşdən götürülməsi və yenidən icra olunmaması üçün"
          feedback: "Doğrudur. requirements.txt dəyişmədiyi müddətcə Docker paket quraşdırma qatını keşdən 0 saniyəyə götürür."
        - id: b
          text: "Python yalnız requirements.txt birinci kopyalandıqda işləyir"
          feedback: "Xeyr, hər iki sıra işləyir; fərq build sürətində və layer caching effektivliyindədir."
        - id: c
          text: "Docker imicinin port nömrəsini avtomatik açmaq üçün"
          feedback: "Kopyalama sırasının şəbəkə portlarına dəxli yoxdur."
      answer: a
      explanation: "Docker-də dəyişən qatdan aşağıdakı bütün qatlar yenidən qurulur. Nadir dəyişən `requirements.txt` yuxarıda, tez-tez dəyişən mənbə kodu aşağıda olmalıdır."
    - id: q-proddock-python-bool-trap
      type: mcq
      title: "Environment variable boolean tələsi"
      prompt: "Mühit dəyişəni `DEBUG=\"false\"` olaraq təyin edilib. Python-da `is_debug = bool(os.environ.get(\"DEBUG\"))` yazıldıqda `is_debug` hansı dəyəri alır?"
      skills: [prod-docker-config]
      category: debug
      options:
        - id: a
          text: "False"
          feedback: "Xeyr — Python-da yalnız boş string `\"\"` üçün `bool(\"\")` `False` qaytarır."
        - id: b
          text: "True — çünki `'false'` boş olmayan string-dir və Python-da istənilən boş olmayan string-in bool dəyəri True-dur"
          feedback: "Doğrudur. Məhz buna görə env dəyişənlərini `val.strip().lower() in {'true', '1'}` ilə parse etmək lazımdır."
        - id: c
          text: "ValueError qaldırır"
          feedback: "`bool()` funksiyası string qəbul edəndə xəta qaldırmır."
      answer: b
      explanation: "Python-da `bool('false') == True`! Mühit dəyişənləri həmişə string olduğu üçün boolean çevrilməsi açıq müqayisə ilə yazılmalıdır."
    - id: q-proddock-secrets-rules
      type: multi
      title: "Secrets idarəetmə qaydaları"
      prompt: "Production AI xidmətlərində API açarlarının (`OPENAI_API_KEY`, `DB_PASSWORD`) təhlükəsiz idarə edilməsi üçün hansı təcrübələr doğrudur? Hamısını seç."
      skills: [prod-docker-config]
      category: production
      options:
        - id: a
          text: ".env faylını həm .gitignore, həm də .dockerignore siyahısına əlavə etmək"
          feedback: "Bəli — bu, lokal açarların nə Git-ə, nə də Docker imicinə sızmamasına zəmanət verir."
        - id: b
          text: "Açar adlarını nümunə placeholder-lərlə (.env.example) sənədləşdirib Git-ə əlavə etmək"
          feedback: "Bəli — komanda yoldaşları hansı dəyişənlərin tələb olunduğunu gizli dəyərləri görmədən öyrənir."
        - id: c
          text: "Gizli açarları konteynerə yalnız runtime zamanı (environment variable / Secret Manager ilə) ötürmək"
          feedback: "Bəli — eyni imic dev, staging və prod mühitlərində fərqli runtime açarları ilə təhlükəsiz işləyir."
        - id: d
          text: "Dockerfile-ın içində ENV OPENAI_API_KEY=sk-real-key yazaraq imici Docker Hub-a yükləmək"
          feedback: "Xeyr — imici yükləyən hər kəs `docker history` ilə həmin açarı açıq mətndə oxuya bilər!"
      answers: [a, b, c]
      explanation: "Gizli açarlar heç vaxt imicə və ya repozitoriyaya daxil edilmir; `.gitignore` + `.dockerignore` + `.env.example` + runtime injection standart təhlükəsizlik zənciridir."
exercises:
  - id: ex-proddock-load-config
    type: code
    title: "load_config konfiqurasiya doğrulayıcısını yaz"
    prompt: |
      Mühit dəyişənləri lüğətini (`env_dict: dict[str, str]`) qəbul edib doğrulayan və gizli açarı maskalayan `load_config(env_dict: dict[str, str]) -> dict` funksiyasını yaz.

      **Müqavilə:**
      1. `"MODEL_API_KEY"`: məcburidir. Yoxdursa və ya `.strip()` edildikdən sonra boşdursa, `ValueError` qaldır.
      2. `"PORT"`: ixtiyaridir, default dəyəri `"8000"`. Tam ədədə (`int`) çevrilməlidir və `1 <= port <= 65535` aralığında olmalıdır. Əks halda `ValueError` qaldır.
      3. `"DEBUG"`: ixtiyaridir, default dəyəri `"false"`. Böyük/kiçik hərfdən və kənar boşluqlardan asılı olmayaraq:
         - `"true"`, `"1"`, `"yes"` → `True`
         - `"false"`, `"0"`, `"no"` → `False`
         - Başqa dəyər olarsa `ValueError` qaldır.
      4. Gizli açarın maskalanması (`"api_key_masked"`):
         - Əgər təmizlənmiş `MODEL_API_KEY`-in uzunluğu `<= 4` olarsa, `"***"` qaytar.
         - Əks halda `"***" + api_key[-4:]` qaytar (məs. `"sk-1234abcd"` → `"***abcd"`).
      5. Qaytarılan lüğət: `{"port": int, "debug": bool, "api_key_masked": str}`.
    skills: [prod-docker-config]
    category: python
    difficulty: 2
    hints:
      - "`api_key = env_dict.get('MODEL_API_KEY', '').strip()`. Boşdursa `raise ValueError(...)`."
      - "`PORT` üçün `try: port = int(env_dict.get('PORT', '8000').strip())` və sonra `if not (1 <= port <= 65535): raise ValueError(...)`."
      - "`DEBUG` üçün `.strip().lower()` etdikdən sonra icazəli çoxluqlarla yoxla."
    starter_code: |
      def load_config(env_dict: dict[str, str]) -> dict:
          # TODO: env_dict dəyərlərini doğrula, çevir və api_key-i maskala
          pass
    tests:
      - name: "Düzgün env dəyişənləri parse olunur və açar maskalanır"
        code: |
          cfg = load_config({"MODEL_API_KEY": "sk-proj-9988xyz1", "PORT": "9000", "DEBUG": "TRUE"})
          assert cfg == {"port": 9000, "debug": True, "api_key_masked": "***xyz1"}

          cfg_def = load_config({"MODEL_API_KEY": "short"})
          assert cfg_def == {"port": 8000, "debug": False, "api_key_masked": "***hort"}

          cfg_tiny = load_config({"MODEL_API_KEY": "abc"})
          assert cfg_tiny == {"port": 8000, "debug": False, "api_key_masked": "***"}
      - name: "Boşluqlu DEBUG (' yes ', ' 0 ') və sərhəd PORT (1, 65535) dəyərləri qəbul edilir"
        code: |
          c1 = load_config({"MODEL_API_KEY": "k12345", "PORT": "1", "DEBUG": " yes "})
          c2 = load_config({"MODEL_API_KEY": "k12345", "PORT": "65535", "DEBUG": " 0 "})
          assert c1["port"] == 1 and c1["debug"] is True
          assert c2["port"] == 65535 and c2["debug"] is False
      - name: "Çatışmayan açar, səhv port və ya səhv debug ValueError qaldırır"
        code: |
          for bad in [
              {},
              {"MODEL_API_KEY": "   "},
              {"MODEL_API_KEY": "sk-12345", "PORT": "abc"},
              {"MODEL_API_KEY": "sk-12345", "PORT": "0"},
              {"MODEL_API_KEY": "sk-12345", "PORT": "70000"},
              {"MODEL_API_KEY": "sk-12345", "DEBUG": "maybe"},
          ]:
              try:
                  load_config(bad)
                  assert False, f"ValueError qaldırılmalı idi: {bad}"
              except ValueError:
                  pass
    solution: |
      def load_config(env_dict: dict[str, str]) -> dict:
          api_key = env_dict.get("MODEL_API_KEY", "").strip()
          if not api_key:
              raise ValueError("MODEL_API_KEY is required")

          raw_port = env_dict.get("PORT", "8000").strip()
          try:
              port = int(raw_port)
          except ValueError as exc:
              raise ValueError("PORT must be an integer") from exc
          if not (1 <= port <= 65535):
              raise ValueError("PORT must be between 1 and 65535")

          raw_debug = env_dict.get("DEBUG", "false").strip().lower()
          if raw_debug in {"true", "1", "yes"}:
              debug = True
          elif raw_debug in {"false", "0", "no"}:
              debug = False
          else:
              raise ValueError("Invalid DEBUG value")

          masked = "***" if len(api_key) <= 4 else f"***{api_key[-4:]}"
          return {
              "port": port,
              "debug": debug,
              "api_key_masked": masked,
          }
    explanation: |
      `load_config` startup zamanı bütün konfiqurasiyanı fail-fast prinsipi ilə yoxlayır, string-dən `int` və `bool` tiplərinə təhlükəsiz çevirir və loglara həqiqi açarın sızmaması üçün yalnız maskalanmış formanı qaytarır.
