id: prod-docker-config-secrets
track: production
module: serving-deployment
title: "Docker, Reproducible Mühitlər, Konfiqurasiya və Secrets İdarəetməsi"
summary: "\"Mənim kompüterimdə işləyirdi\" problemini Docker ilə necə həll etməyi, layer caching üçün düzgün Dockerfile ardıcıllığını, environment variables ilə konfiqurasiyanı və gizli açarları (secrets) heç vaxt imicə və ya Git-ə salmamağı öyrənəcəksən."
level: core
estimated_minutes: [45, 65]
prerequisites: [prod-fastapi-model-serving]
next: prod-logging-monitoring
skills: [prod-docker-config]
objectives:
  - "Pinlənmiş baza imici, effektiv layer caching və non-root istifadəçi ilə Dockerfile tərtib etmək"
  - "Konfiqurasiyanı koddan ayırıb environment variables və .env.example vasitəsilə idarə etmək"
  - "Gizli açarların (API keys, DB passwords) niyə Dockerfile-a, Git tarixçəsinə və frontend paketlərinə daxil edilməməli olduğunu izah etmək"
  - "Environment dəyişənlərini doğrulayan, tiplərə çevirən və loglar üçün gizli açarları maskalayan Python konfiqurasiya yükləyicisi yazmaq"
why_it_matters: |
  Lokal noutbukunda Python 3.12, Windows və qlobal quraşdırılmış paketlərlə işləyən AI xidməti Linux serverə köçürüləndə tez-tez çökür: paket versiyaları fərqlidir, fayl yolları (`C:\Users\...`) sərt yazılıb və ya sistem kitabxanası çatmır.

  Bundan daha təhlükəlisi isə təhlükəsizlikdir: hər gün yüzlərlə tərtibatçı `.env` faylını və ya `OPENAI_API_KEY`-i təsadüfən GitHub-a və ya Docker imicinin içinə yükləyir. Avtomatik botlar həmin açarları saniyələr içində tapıb minlərlə dollarlıq API borcu yaradır.
terms:
  - term: Docker Image vs Container
    definition: "Image — tətbiqin kodu, kitabxanaları və əməliyyat sistemi qatlarından ibarət dəyişməz (immutable) şablondur; Container isə həmin imicin işə salınmış canlı nüsxəsidir."
  - term: Layer Caching
    definition: "Docker-in hər təlimatı (FROM, COPY, RUN) ayrıca keşlənmiş qat kimi saxlaması; bir qat dəyişdikdə ondan sonrakı bütün qatlar yenidən icra olunur."
  - term: Environment Variables (Mühit dəyişənləri)
    definition: "Kodu dəyişmədən konteynerə runtime zamanı kənardan ötürülən konfiqurasiya və gizli açar dəyərləri (`os.environ`)."
  - term: .env və .env.example
    definition: "`.env` lokal gizli dəyərləri saxlayır və `.gitignore`-a salınır; `.env.example` isə yalnız açar adlarını (boş və ya nümunə dəyərlə) göstərir və Git-ə əlavə olunur."
  - term: Secret Masking (Redaction)
    definition: "Konfiqurasiyanı və ya xətanı loga yazarkən gizli açarın tam mətnini gizlədib yalnız son 3-4 simvolunu (`***a9f2`) göstərmək."
  - term: Non-root Container User
    definition: "Konteyner daxilindəki tətbiqi tam səlahiyyətli `root` əvəzinə məhdud hüquqlu istifadəçi (`USER appuser`) ilə işlətmək."
sections:
  - id: docker-and-secrets
    kind: explanation
    title: "Dockerfile Anatomiyası, Layer Caching və Secrets Təhlükəsizliyi"
    body: |
      ### 1. Niyə "Mənim kompüterimdə işləyir" kifayət deyil?
      Reproducible (təkrarolunan) AI xidməti üçün üç şey dəqiq bərkidilməlidir (pinned):
      1. **Əməliyyat sistemi və Python versiyası:** `FROM python:latest` yazmaq təhlükəlidir — sabah Python 3.14 çıxanda build qəfil sına bilər. Həmişə dəqiq teq seç: `FROM python:3.11-slim`.
      2. **Asılılıqlar (Dependencies):** `requirements.txt` içində `fastapi==0.115.0` kimi dəqiq versiyalar göstərilməlidir.
      3. **Konfiqurasiya və yollar:** Kodda `C:\Users\Ali\model.pkl` kimi sərt yollar yox, nisbi yollar və ya mühit dəyişənləri (`MODEL_PATH`) olmalıdır.

      ### 2. Dockerfile Layer Caching Qaydası
      Docker imici yuxarıdan aşağıya qat-qat (layer) qurulur. Əgər bir qatdakı fayl dəyişərsə, Docker **həmin qatı və ondan aşağıdakı bütün qatları** yenidən qurur.
      - **Yanlış sıra:** Əvvəlcə `COPY . .`, sonra `RUN pip install -r requirements.txt`. Bu halda `main.py`-da tək bir hərf dəyişəndə belə `COPY . .` qatı pozulur və Docker 5 dəqiqəlik `pip install` (PyTorch, FastAPI və s.) prosesini sıfırdan təkrarlayır!
      - **Doğru sıra:** Əvvəlcə **yalnız** `COPY requirements.txt .`, sonra `RUN pip install --no-cache-dir -r requirements.txt`, **ən sonda** `COPY . .`. Beləliklə, kod dəyişəndə paketlər keşdən (0 saniyəyə) götürülür!

      ### 3. Konfiqurasiya və Secrets: 3 Qızıl Qadağa
      Gizli açarlar (`MODEL_API_KEY`, `DATABASE_URL`, `JWT_SECRET`) heç vaxt bu 3 yerə düşməməlidir:
      1. **Git tarixçəsinə:** `.env` faylı həmişə `.gitignore`-da olmalıdır. Yalnız saxta dəyərləri olan `.env.example` (`MODEL_API_KEY=your_key_here`) Git-ə qoyulur.
      2. **Docker imicinin içinə:** Dockerfile-da `ENV MODEL_API_KEY=sk-12345` yazmaq və ya `.dockerignore` olmadan `COPY . .` ilə `.env` faylını imicə kopyalamaq **qadağandır**. İmicin hər qatı `docker history` ilə açıq oxunur. Secrets yalnız konteyner **işə düşərkən** (`docker run -e MODEL_API_KEY=...` və ya bulud Secret Manager ilə) runtime-da ötürülməlidir.
      3. **Frontend (Brauzer) koduna:** `VITE_OPENAI_KEY` və ya `NEXT_PUBLIC_...` ilə brauzerə göndərilən hər bir dəyər istifadəçinin DevTools Network pəncərəsində tam açıq görünür. LLM çağırışları həmişə sənin backend serverindən edilməlidir.
  - id: shipping-container-analogy
    kind: analogy
    title: "Mental model: standart yük konteyneri və qapıdakı seyf kodu"
    body: |
      - **Docker Image = Möhürlənmiş standart dəniz konteyneri:** İçində mebel, işıqlandırma və avadanlıq (Python + kitabxanalar + kod) zavodda yığılıb. Bu konteyneri Bakıdakı limana da, Tokiodakı gəmiyə də qoysan, içəridəki mühit 100% eynidir.
      - **Layer Caching = Mərtəbəli bina tikintisi:** Binanın bünövrəsini (`FROM python:3.11-slim`) və ağır su-elektrik xətlərini (`pip install`) alt mərtəbədə qurursan, divar kağızını (`COPY . .`) isə ən axırda yapışdırırsan. Divar kağızını dəyişəndə bünövrəni söküb yenidən tökmürsən.
      - **Secrets = Seyf şifrəsi:** Seyfin şifrəsini konteynerin xarici divarına boya ilə yazmırsan (Dockerfile-da `ENV SECRET=...` etmirsən). Konteyner ünvana çatanda və işə düşəndə mühafizəçi şifrəni qapıdan içəri ötürür (runtime environment variable).
  - id: docker-layers-diagram
    kind: diagram
    title: "Optimal Dockerfile qatları və Runtime Secrets"
    body: |
      ```mermaid
      flowchart TD
        L1["1. FROM python:3.11-slim (Nadir dəyişir -> KEŞDƏ)"] --> L2["2. COPY requirements.txt . (Nadir dəyişir -> KEŞDƏ)"]
        L2 --> L3["3. RUN pip install -r requirements.txt (Ağır qat -> KEŞDƏ)"]
        L3 --> L4["4. COPY src/ ./src/ (Tez-tez dəyişir -> Yalnız buradan aşağı yenilənir)"]
        L4 --> L5["5. USER appuser & CMD uvicorn ..."]
        S["Runtime Secrets (API_KEY, DB_URL)"] -. "docker run -e / Secret Manager" .-> L5
      ```

      Kod (`src/`) dəyişdikdə 1, 2 və 3-cü qatlar toxunulmaz qalır; gizli açarlar isə imic qatlarına deyil, yalnız işə düşən konteynerə (`L5`) ötürülür.
  - id: worked-dockerfile-env
    kind: worked_example
    title: "Düzgün Dockerfile və Fail-Fast Konfiqurasiya nümunəsi"
    body: |
      **1. Production üçün təmiz `Dockerfile`:**
      ```dockerfile
      FROM python:3.11-slim

      WORKDIR /app

      # 1. Əvvəlcə yalnız asılılıq siyahısını kopyala (Layer Caching!)
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt

      # 2. Təhlükəsizlik üçün non-root istifadəçi yarat
      RUN useradd --create-home appuser

      # 3. Tez-tez dəyişən mənbə kodunu ən sonda kopyala
      COPY ./app ./app

      USER appuser
      EXPOSE 8000
      CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
      ```

      **2. `.dockerignore` faylı (kritik!):**
      ```text
      .env
      .git
      __pycache__
      *.pyc
      .venv
      ```
      `.dockerignore` içində `.env` yazılmasa, `COPY . .` komandası lokal `.env` faylını gizlicə imicin içinə kopyalaya bilər!
  - id: code-config-loader
    kind: code
    title: "Kod: Fail-Fast Konfiqurasiya Doğrulaması və Secret Masking"
    body: |
      ```python
      def mask_secret(secret: str) -> str:
          """Loglarda təhlükəsiz çap üçün gizli açarın yalnız son 4 simvolunu saxlayır."""
          if len(secret) <= 4:
              return "***"
          return f"***{secret[-4:]}"


      def load_config(env_dict: dict[str, str]) -> dict[str, object]:
          """Mühit dəyişənlərini doğrulayır, tiplərə çevirir və maskalanmış xülasə yaradır."""
          api_key = env_dict.get("MODEL_API_KEY", "").strip()
          if not api_key:
              raise ValueError("Missing required environment variable: MODEL_API_KEY")

          raw_port = env_dict.get("PORT", "8000").strip()
          try:
              port = int(raw_port)
          except ValueError as exc:
              raise ValueError(f"PORT must be an integer, got {raw_port!r}") from exc
          if not (1 <= port <= 65535):
              raise ValueError(f"PORT out of valid range (1..65535): {port}")

          raw_debug = env_dict.get("DEBUG", "false").strip().lower()
          if raw_debug in {"true", "1", "yes"}:
              debug = True
          elif raw_debug in {"false", "0", "no"}:
              debug = False
          else:
              raise ValueError(f"Invalid boolean for DEBUG: {raw_debug!r}")

          return {
              "port": port,
              "debug": debug,
              "api_key_masked": mask_secret(api_key),
          }


      cfg = load_config({"MODEL_API_KEY": "sk-live-987654321abcd", "PORT": "8080", "DEBUG": "false"})
      print(cfg)
      # {'port': 8080, 'debug': False, 'api_key_masked': '***abcd'}
      ```

      Vacib mühəndislik prinsipləri:
      - **Fail-fast startup:** Əgər `MODEL_API_KEY` unudulubsa, xidmət ilk müştəri sorğusu gələndə yox, **işə düşən saniyədə** aydın `ValueError` ilə dayanır.
      - **Tip çevrilməsi:** Environment dəyişənləri həmişə `str` (`"8080"`, `"false"`) kimi gəlir. Python-da `bool("false") == True` olduğu üçün boolean dəyərlər açıq siyahı ilə parse edilməlidir!
  - id: common-mistakes
    kind: mistakes
    title: "Ən çox edilən səhvlər"
    body: |
      **1. Python-da `bool(os.getenv("DEBUG", "false"))` yazmaq**
      Python-da hər hansı boş olmayan string `bool(...)` funksiyasına verildikdə `True` qaytarır — yəni `bool("false") == True`! Mühit dəyişənini həmişə `.strip().lower() in {"true", "1"}` kimi açıq yoxla.

      **2. Dockerfile-da `COPY . .`-u `pip install`-dan əvvəl yazmaq**
      Bu kiçik sıra səhvi CI/CD build vaxtını 15 saniyədən 8 dəqiqəyə qaldırır, çünki hər kod dəyişikliyində paket keşi sıfırlanır.

      **3. `.env` faylını Git-dən sonradan `git rm` ilə silib təhlükənin keçdiyini düşünmək**
      Bir dəfə commit olunmuş gizli açar Git tarixçəsində (`git log -p`) həmişəlik qalır. Sızmış açar dərhal provayder panelindən **ləğv edilməli (revoke / rotate)** və yenisi yaradılmalıdır.

      **4. Konteyner daxilində `uvicorn`-u `127.0.0.1` ünvanında işə salmaq**
      Konteyner içində `--host 127.0.0.1` yalnız konteynerin öz daxili loopback interfeysini dinləyir və kənardan gələn trafik bağlana bilmir. Docker daxilində həmişə `--host 0.0.0.0` göstərilməlidir.
  - id: tradeoffs
    kind: tradeoffs
    title: "Mühəndislik seçimləri və məhdudiyyətlər"
    body: |
      - **`python:3.11-slim` vs tam `python:3.11` vs `alpine`:** Tam imic ~1 GB-dır və içində lazımsız paketlər çoxdur. `alpine` çox kiçikdir, amma `musl libc` işlətdiyi üçün Python-un C/C++ genişlənmələri (NumPy, PyTorch, pandas) hazır `manylinux` wheel tapmayıb saatlarla kompilyasiya oluna bilər. AI/ML üçün qızıl standart **`python:3.11-slim`** (və ya multi-stage build) seçməkdir.
      - **Env vars vs Secret Manager:** Sadə yerləşdirmələrdə platformanın şifrələnmiş env dəyişənləri kifayətdir; böyük korporativ mühitlərdə isə avtomatik rotasiya və audit logu üçün Cloud Secret Manager / Vault istifadə olunur.
