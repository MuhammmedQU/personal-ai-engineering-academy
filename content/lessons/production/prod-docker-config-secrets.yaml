    title: "Dockerfile təlimatlarını optimal ardıcıllıqla düz"
    prompt: "Maksimum layer caching sürəti və təhlükəsizlik (non-root) üçün Dockerfile sətirlərini yuxarıdan aşağıya düzgün ardıcıllıqla sırala."
    skills: [prod-docker-config]
    category: production
    difficulty: 1
    hints:
      - "Docker qatları (layers) yuxarıdan aşağıya keşlənir: ən nadir dəyişən hissələr (baza imici və `requirements.txt`) yuxarıda, tez-tez dəyişən mənbə kodu (`COPY ./app`) aşağıda olmalıdır."
      - "Ən sonda təhlükəsizlik üçün non-root istifadəçiyə (`USER appuser`) keçilir və `CMD` təyin olunur."
    items:
      - id: s1
        text: "FROM python:3.11-slim və WORKDIR /app"
      - id: s2
        text: "COPY requirements.txt . və RUN pip install --no-cache-dir -r requirements.txt"
      - id: s3
        text: "COPY ./app ./app (mənbə kodunun kopyalanması)"
      - id: s4
        text: "USER appuser və CMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]"
    answer: [s1, s2, s3, s4]
    explanation: "Əvvəlcə pinlənmiş baza imici (s1), sonra nadir dəyişən asılılıqların quraşdırılması (s2), daha sonra tez-tez dəyişən tətbiq kodu (s3) və ən sonda non-root istifadəçi ilə başlanğıc əmri (s4) gəlir."
