quiz:
  pass_threshold: 0.75
  questions:
    - id: q-prodmon-why-p95
      type: mcq
      title: "Niyə p95 və p99 izlənilir?"
      prompt: "Bir AI xidmətində sorğuların 95%-i 120 ms çəkir, lakin 5%-i 6000 ms (6 saniyə) çəkir. Niyə təkcə ədədi ortanı (mean = 414 ms) izləmək kifayət deyil?"
      skills: [prod-monitoring]
      category: production
      options:
        - id: a
          text: "Ədədi orta ən yavaş 5% istifadəçinin yaşadığı 6 saniyəlik ciddi gecikməni (tail latency) gizlədir"
          feedback: "Doğrudur. $p_{95}$ və $p_{99}$ metrikləri məhz bu quyruq gecikmələrini aşkar etmək üçündür."
        - id: b
          text: "Ədədi ortanı Python-da hesablamaq mümkün deyil"
          feedback: "Ədədi ortanı hesablamaq asandır, sadəcə qeyri-simmetrik (skewed) paylanmalarda aldadıcıdır."
        - id: c
          text: "p95 həmişə p50-dən kiçik olur"
          feedback: "Xeyr, $p_{95} \\ge p_{50}$ olur."
      answer: a
      explanation: "Gecikmə paylanmaları sağa dartılmış (skewed) olur. Orta rəqəm quyruqdakı ağır gecikmələri pərdələyir; $p_{95}$ və $p_{99}$ isə ən pis istifadəçi təcrübəsini birbaşa göstərir."
    - id: q-prodmon-drift-types
      type: mcq
      title: "Prediction Drift nədir?"
      prompt: "Kredit riski modelində həqiqi nəticə (müştərinin krediti 1 il ərzində qaytarıb-qaytarmaması) yalnız 12 ay sonra bilinir. Lakin bu həftə modelin 'yüksək risk' dediyi müraciətlərin payı qəfil 10%-dən 55%-ə qalxıb. Bu hansı siqnaldır?"
      skills: [prod-monitoring]
      category: production
      options:
        - id: a
          text: "Prediction Drift — həqiqi etiketlər (ground truth) hələ gəlməsə də, modelin çıxış paylanmasının tarixi bazadan kəskin yayınması"
          feedback: "Doğrudur. Çıxış paylanmasının qəfil dəyişməsi həqiqi etiketləri gözləmədən problemi erkən aşkar etməyə imkan verir."
        - id: b
          text: "Container Layer Caching xətası"
          feedback: "Docker layer caching build vaxtına aiddir, modelin proqnoz paylanmasına yox."
        - id: c
          text: "HTTP 404 Not Found xətası"
          feedback: "Endpoint işləyir və proqnoz qaytarır, sadəcə proqnozların paylanması sürüşüb."
      answer: a
      explanation: "Ground-truth etiketləri gecikən sistemlərdə modelin çıxış ehtimallarının və sinif nisbətlərinin dəyişməsini (Prediction Drift) və giriş əlamətlərinin dəyişməsini (Input Data Drift) izləmək əsas erkən xəbərdarlıq üsuludur."
    - id: q-prodmon-safe-logging
      type: multi
      title: "Təhlükəsiz Structured Logging"
      prompt: "Production LLM xidmətinin JSON loglarında hansı məlumatların yazılması **doğru və təhlükəsizdir**? Doğru olanları seç."
      skills: [prod-monitoring]
      category: production
      options:
        - id: a
          text: "request_id, model_version, status_code və latency_ms"
          feedback: "Bəli — hər sorğunun izlənməsi və performans analizi üçün əsas sahələrdir."
        - id: b
          text: "tokens_in, tokens_out və təxmini sorğu xərci (cost_usd)"
          feedback: "Bəli — xərc və kontekst istifadəsini izləmək üçün vacibdir."
        - id: c
          text: "Doğrulama və ya alət çağırışı xətasının növü (error_type)"
          feedback: "Bəli — hansı xəta kateqoriyasının artdığını görməyə kömək edir."
        - id: d
          text: "Müştərinin tam bank kartı nömrəsi, CVV kodu və serverin OPENAI_API_KEY dəyəri"
          feedback: "Xeyr — PII və gizli açarlar heç vaxt loglara yazılmamalıdır!"
      answers: [a, b, c]
      explanation: "Strukturlaşdırılmış loglar performans, xərc, versiya və xəta metadatasını saxlamalı, lakin PII və gizli açarları qətiyyən sızdırmamalıdır."
exercises:
  - id: ex-prodmon-latency-summary
    type: code
    title: "percentile və summarize_latencies funksiyalarını yaz"
    prompt: |
      Production gecikmələrini təhlil etmək üçün iki funksiya yaz:

      1. `percentile(values: list[float], q: float) -> float`
         - `values` boşdursa və ya `q` `0 <= q <= 100` aralığında deyilsə `ValueError` qaldır.
         - Input siyahısını **dəyişdirmədən** (mutate etmədən) kiçikdən böyüyə sırala (`ordered`).
         - `q == 0` olarsa `float(ordered[0])` qaytar.
         - Əks halda nearest-rank indeksini hesabla:
           `idx = max(0, min(len(ordered) - 1, math.ceil((q / 100.0) * len(ordered)) - 1))`
           və `float(ordered[idx])` qaytar.

      2. `summarize_latencies(latencies_ms: list[float]) -> dict`
         - `latencies_ms` boşdursa və ya içində mənfi ədəd (`< 0`) varsa `ValueError` qaldır.
         - Bu lüğəti qaytar (`p50`, `p95`, `max` dəyərləri `round(val, 2)` ilə yuvarlaqlaşdırılmış `float`):
           `{"count": len(latencies_ms), "p50": ..., "p95": ..., "max": ...}`
    skills: [prod-monitoring]
    category: python
    difficulty: 2
    hints:
      - "`ordered = sorted(float(v) for v in values)` həm elementləri `float`-a çevirir, həm də yeni siyahı yaradır."
      - "`summarize_latencies` içində `if not latencies_ms or any(v < 0 for v in latencies_ms): raise ValueError(...)` yoxlamasını əvvəldə yaz."
      - "`percentile(latencies_ms, 50)` və `percentile(latencies_ms, 95)` çağırışlarından istifadə et."
