          pass


      def summarize_latencies(latencies_ms: list[float]) -> dict:
          # TODO: count, p50, p95 və max qaytar
          pass
    tests:
      - name: "10 elementli siyahıda p50, p95 və max düzgün hesablanır"
        code: |
          raw = [150, 110, 120, 130, 140, 160, 170, 180, 190, 900]
          copy_before = list(raw)
          summary = summarize_latencies(raw)
          assert summary == {
              "count": 10,
              "p50": 150.0,
              "p95": 900.0,
              "max": 900.0,
          }, f"Alınan: {summary}"
          assert raw == copy_before, "Input list dəyişdirilməməlidir!"
      - name: "percentile sərhəd dəyərlərini (q=0, q=100) düzgün qaytarır"
        code: |
          vals = [40.0, 10.0, 30.0, 20.0]
          assert percentile(vals, 0) == 10.0
          assert percentile(vals, 50) == 20.0
          assert percentile(vals, 100) == 40.0
      - name: "Boş siyahı, mənfi latency və ya yanlış q ValueError qaldırır"
        code: |
          for fn, args in [
              (percentile, ([], 50)),
              (percentile, ([10.0], -1)),
              (percentile, ([10.0], 105)),
              (summarize_latencies, ([],)),
              (summarize_latencies, ([10.0, -5.0],)),
          ]:
              try:
                  fn(*args)
                  assert False, f"ValueError qaldırılmalı idi: {fn.__name__}{args}"
              except ValueError:
                  pass
    solution: |
      import math

      def percentile(values: list[float], q: float) -> float:
          if not values:
              raise ValueError("values cannot be empty")
          if not (0.0 <= q <= 100.0):
              raise ValueError("q must be in [0, 100]")
          ordered = sorted(float(v) for v in values)
          if q == 0.0:
              return ordered[0]
          idx = math.ceil((q / 100.0) * len(ordered)) - 1
          idx = max(0, min(len(ordered) - 1, idx))
          return ordered[idx]


      def summarize_latencies(latencies_ms: list[float]) -> dict:
          if not latencies_ms or any(v < 0 for v in latencies_ms):
              raise ValueError("latencies_ms must be non-empty and non-negative")
          return {
              "count": len(latencies_ms),
              "p50": round(percentile(latencies_ms, 50), 2),
              "p95": round(percentile(latencies_ms, 95), 2),
              "max": round(max(float(v) for v in latencies_ms), 2),
          }
    explanation: |
      `percentile` funksiyası input siyahısını dəyişdirmədən sıralayır və nearest-rank düsturu ilə $p_q$ dəyərini tapır. `summarize_latencies` isə mənfi və boş dəyərləri rədd edərək əsas SLA göstəricilərini qaytarır.
