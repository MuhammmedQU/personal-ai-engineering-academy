    title: "Təhlükəsiz AI CI/CD və Rollout mərhələlərini sırala"
    prompt: |
      Git commit-dən tam 100% production buraxılışına qədər olan **təhlükəsiz AI CI/CD boru xəttinin** mərhələlərini düzgün xronoloji ardıcıllıqla düz.
