      - "`circuit_breaker_step` başlanğıcında `state`, `event` və `threshold <= 0` yoxlamasını edib `ValueError` qaldır."
      - "`HALF_OPEN` vəziyyətində `'success'` gəldikdə `('CLOSED', 0)`, `'failure'` gəldikdə isə `('OPEN', threshold)` qaytar."
