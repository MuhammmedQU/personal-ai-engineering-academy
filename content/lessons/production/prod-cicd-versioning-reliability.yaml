    tests:
      - name: "Canary promote və rollback qərarları"
        code: |
          v1 = {"error_rate": 0.005, "p95_ms": 500.0}
          v2_ok = {"error_rate": 0.008, "p95_ms": 650.0}
          assert evaluate_canary_health(v1, v2_ok, max_error_rate=0.02, max_p95_ratio=1.5) == {
              "action": "promote",
              "reasons": [],
          }

          v2_bad = {"error_rate": 0.035, "p95_ms": 900.0}
          assert evaluate_canary_health(v1, v2_bad, max_error_rate=0.02, max_p95_ratio=1.5) == {
              "action": "rollback",
              "reasons": ["error_rate_exceeded", "p95_latency_degraded"],
          }
      - name: "Circuit Breaker CLOSED -> OPEN -> HALF_OPEN -> CLOSED tam dövrü"
        code: |
          st, cnt = "CLOSED", 0
          st, cnt = circuit_breaker_step(st, cnt, 3, "failure")
          assert (st, cnt) == ("CLOSED", 1)
          st, cnt = circuit_breaker_step(st, cnt, 3, "failure")
          assert (st, cnt) == ("CLOSED", 2)
          st, cnt = circuit_breaker_step(st, cnt, 3, "failure")
          assert (st, cnt) == ("OPEN", 3)
          # OPEN zamanı adi failure vəziyyəti dəyişmir
          st, cnt = circuit_breaker_step(st, cnt, 3, "failure")
          assert (st, cnt) == ("OPEN", 3)
          # Cooldown bitdikdə HALF_OPEN
          st, cnt = circuit_breaker_step(st, cnt, 3, "cooldown_elapsed")
          assert (st, cnt) == ("HALF_OPEN", 3)
          # Probe uğurlu olduqda CLOSED və 0
          st, cnt = circuit_breaker_step(st, cnt, 3, "success")
          assert (st, cnt) == ("CLOSED", 0)
      - name: "HALF_OPEN zamanı uğursuz sınaq yenidən OPEN edir"
        code: |
          assert circuit_breaker_step("HALF_OPEN", 3, 3, "failure") == ("OPEN", 3)
          assert circuit_breaker_step("CLOSED", 2, 3, "success") == ("CLOSED", 0)
      - name: "Yanlış state, event və ya threshold üçün ValueError"
        code: |
          for args in [("BROKEN", 0, 3, "success"), ("CLOSED", 0, 3, "timeout"), ("CLOSED", 0, 0, "failure")]:
              raised = False
              try:
                  circuit_breaker_step(*args)
              except ValueError:
                  raised = True
              assert raised, f"{args} üçün ValueError gözlənilirdi"
    solution: |
      def evaluate_canary_health(
          v1_metrics: dict,
          v2_metrics: dict,
          max_error_rate: float,
          max_p95_ratio: float,
      ) -> dict:
          reasons: list[str] = []
          if v2_metrics["error_rate"] > max_error_rate:
              reasons.append("error_rate_exceeded")
          if v2_metrics["p95_ms"] > v1_metrics["p95_ms"] * max_p95_ratio:
              reasons.append("p95_latency_degraded")
          action = "promote" if not reasons else "rollback"
          return {"action": action, "reasons": reasons}


      def circuit_breaker_step(
          state: str,
          failure_count: int,
          threshold: int,
          event: str,
      ) -> tuple[str, int]:
          valid_states = {"CLOSED", "OPEN", "HALF_OPEN"}
          valid_events = {"success", "failure", "cooldown_elapsed"}
          if state not in valid_states or event not in valid_events or threshold <= 0:
              raise ValueError("Invalid state, event, or threshold.")

          if state == "CLOSED":
              if event == "success":
                  return ("CLOSED", 0)
              if event == "failure":
                  new_count = failure_count + 1
                  if new_count >= threshold:
                      return ("OPEN", new_count)
                  return ("CLOSED", new_count)
              return ("CLOSED", failure_count)

          if state == "OPEN":
              if event == "cooldown_elapsed":
                  return ("HALF_OPEN", failure_count)
              return ("OPEN", failure_count)

          if event == "success":
              return ("CLOSED", 0)
          if event == "failure":
              return ("OPEN", threshold)
          return ("HALF_OPEN", failure_count)
    explanation: |
      Avtomatik Canary qiymətləndirməsi və Circuit Breaker birlikdə production AI sistemini iki tərəfdən qoruyur: yeni deploy olunan öz modelimizin reqressiyasından (Canary rollback) və asılı olduğumuz xarici model/API-lərin çökməsindən (Circuit Breaker).
