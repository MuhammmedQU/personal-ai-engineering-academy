id: prod-fastapi-model-serving
track: production
module: serving-deployment
title: "FastAPI ilə Model Serving: Lifespan, Pydantic Doğrulaması, Health Checks və Testlər"
summary: "ML modelini və ya LLM boru kəmərini FastAPI xidməti arxasında paketləməyi, modeli hər sorğuda deyil, yalnız başlanğıcda (lifespan) yaddaşa yükləməyi, Pydantic ilə sərt giriş/çıxış müqaviləsi qurmağı və TestClient ilə yoxlamağı öyrənəcəksən."
level: core
estimated_minutes: [50, 70]
prerequisites: [py-errors-validation, http-json-api-clients]
next: prod-docker-config-secrets
skills: [prod-model-serving, py-errors]
objectives:
  - "Model artefaktını hər HTTP sorğusunda deyil, tətbiq işə düşərkən (lifespan) bir dəfə yaddaşa yükləmək"
  - "Giriş və çıxış datasını Pydantic sxemləri və açıq sərhəd yoxlamaları ilə doğrulamaq"
  - "Liveness (/health) və Readiness (/ready) endpoint-lərini düzgün ayırmaq və cavaba model_version ilə request_id əlavə etmək"
  - "Xidmətin həm normal axınını (happy path), həm də xəta hallarını TestClient ilə avtomatik test etmək"
why_it_matters: |
  Jupyter Notebook-da `model.predict(X)` yazmaq yalnız işin başlanğıcıdır. Başqa komandaların və ya mobil tətbiqin sənin modelindən istifadə etməsi üçün o, aydın HTTP müqaviləsi olan etibarlı bir API arxasında işləməlidir.

  Təcrübəsiz mühəndislərin etdiyi iki klassik səhv production-u dərhal çökdürür:
  1. Modeli (`joblib.load("model.pkl")`) endpoint funksiyasının **içində** yükləmək — hər sorğuda diskdən yüzlərlə meqabayt oxunur və gecikmə saniyələrə qalxır.
  2. `NaN`, `Infinity` və ya səhv tipli sahələri yoxlamadan modelə ötürmək — müştəriyə aydın `422/400` xətası əvəzinə anlaşılmaz `500 Internal Server Error` qayıdır.
terms:
  - term: Model Serving
    definition: "Öyrədilmiş ML modelinin və ya LLM zəncirinin şəbəkə sorğularını (HTTP/gRPC) qəbul edib real vaxtda proqnoz qaytaran xidmət kimi işlədilməsi."
  - term: Lifespan (Startup / Shutdown lifecycle)
    definition: "FastAPI tətbiqi işə düşərkən (sorğular qəbul edilməzdən əvvəl) model və resursları bir dəfə yükləyib, dayanarkən təmizləyən kontekst mexanizmi."
  - term: Liveness (/health) vs Readiness (/ready)
    definition: "Liveness prosesin sağ olduğunu, Readiness isə modelin yaddaşa tam yükləndiyini və trafik qəbul etməyə hazır olduğunu bildirən yoxlama nöqtələri."
  - term: Request ID & Model Version
    definition: "Hər proqnoz cavabına əlavə edilən unikal sorğu identifikatoru və cavabı hansı model versiyasının (məs. 'fraud-xgb-v1.4') verdiyini göstərən izləmə sahələri."
  - term: Pydantic Schema Validation
    definition: "HTTP JSON gövdəsinin tiplərini, məcburi sahələrini və dəyər aralıqlarını avtomatik doğrulayan, səhv olduqda 422 Unprocessable Entity qaytaran qat."
  - term: TestClient
    definition: "FastAPI tətbiqini ayrıca port açmadan birbaşa yaddaş daxilində HTTP sorğuları ilə test etməyə imkan verən sınaq aləti."
sections:
  - id: serving-architecture
    kind: explanation
    title: "Model Serving Arxitekturası: Lifespan, Müqavilə və Sağlamlıq Yoxlamaları"
    body: |
      ### 1. Model nə vaxt yüklənməlidir? (Startup Lifespan vs Per-Request)
      ML modeli və ya embedding indeksi adətən 50 MB-dan bir neçə giqabayta qədər yer tutur.
      - **Yanlış yanaşma (Per-request load):** `@app.post("/predict")` funksiyasının içində `model = load_model("model.bin")` yazmaq. Saniyədə 50 sorğu gələndə server eyni anda 50 dəfə diski oxuyur, RAM partlayır (`OutOfMemory`) və gecikmə 10 ms əvəzinə 3000 ms olur.
      - **Doğru yanaşma (Lifespan / Startup load):** Model tətbiq işə düşəndə **yalnız bir dəfə** RAM/GPU yaddaşına yüklənir (`app.state.model`) və bütün sorğular həmin hazır obyekti paylaşır (inference zamanı model read-only olduğu üçün bu tam təhlükəsizdir).

      ### 2. `/health` və `/ready` niyə fərqlidir?
      Konteyner orkestratorları (Kubernetes, Cloud Run, ECS) iki fərqli sual verir:
      - **`GET /health` (Liveness):** *"Python prosesi sağdırmı, yoxsa donub?"* Əgər bu endpoint cavab vermirsə, orkestrator konteyneri yenidən başladır (restart).
      - **`GET /ready` (Readiness):** *"Model yaddaşa tam yüklənibmi və sorğu qəbul edə bilərmi?"* Böyük modelin yüklənməsi 15 saniyə çəkə bilər. Bu 15 saniyə ərzində `/health` `200 OK`, `/ready` isə `503 Service Unavailable` qaytarır ki, load balancer hələ hazır olmayan konteynerə müştəri trafiki göndərməsin.

      ### 3. Giriş və Çıxış Müqaviləsi (`request_id` və `model_version`)
      Production-da heç vaxt təkcə `{"prediction": 1}` qaytarma! Müştəri şikayət edəndə ki, *"Dünən saat 14:02-də sistem səhv qərar verdi"*, bunu araşdırmaq üçün cavabda mütləq bu sahələr olmalıdır:
      - `request_id`: Sorğunu loglarda tapmaq üçün unikal ID.
      - `model_version`: Qərarı `v1.2` yoxsa yeni deploy olunmuş `v1.3` modelinin verdiyini bilmək üçün.
      - `score` və `prediction`: Həm xam ehtimal balı (`0.8421`), həm də qərar həddinə (`threshold`) görə sinif (`1`).
  - id: restaurant-kitchen-analogy
    kind: analogy
    title: "Mental model: restoran mətbəxinin açılış hazırlığı"
    body: |
      - **Per-request model loading = Hər müştəri sifariş verəndə sobanı sıfırdan quraşdırmaq:** Müştəri qəhvə istəyir, barista qəhvə aparatını qutudan çıxarıb quraşdırır, 20 dəqiqə qızmasını gözləyir, qəhvəni verir və aparatı yenidən söküb qutuya qoyur.
      - **Lifespan startup loading = Səhər açılış hazırlığı:** Restoran qapını müştərilərə açmazdan əvvəl (`startup`) sobanı və qəhvə aparatını bir dəfə qızdırır.
      - **`/health` vs `/ready`:** Restoranın işıqları yanırsa `/health = OK`. Amma soba hələ qızmayıbsa, qapıda *"Hazırlaşırıq"* lövhəsi asılır (`/ready = 503`). Soba hazır olan kimi lövhə *"Açıqdır"* olur (`/ready = 200`) və sifarişlər saniyələr içində verilir.
  - id: serving-lifecycle-diagram
    kind: diagram
    title: "FastAPI Model Serving dövrü"
    body: |
      ```mermaid
      sequenceDiagram
        participant O as Orkestrator / Client
        participant A as FastAPI Service
        participant M as Yaddaşdakı Model

        Note over A,M: Startup (Lifespan)
        A->>M: load_model() — BİR DƏFƏ
        O->>A: GET /ready
        A-->>O: 200 OK (model_loaded: true)
        O->>A: POST /predict (JSON payload)
        A->>A: Pydantic Schema Validation
        A->>M: model.predict(features)
        M-->>A: score = 0.87
        A-->>O: 200 OK {request_id, prediction, score, model_version}
      ```

      Model yalnız `Startup` blokunda yüklənir; `POST /predict` zamanı yalnız sürətli validation və yaddaşdaxili hesablama gedir.
  - id: worked-request-response
    kind: worked_example
    title: "Giriş doğrulaması və versiyalı çıxış nümunəsi"
    body: |
      Tutaq ki, saxtakarlıq (fraud) aşkarlayan modelimiz 3 ədədi əlamət (`features`) gözləyir və qərar həddi `threshold = 0.70`-dir.

      **Nümunə 1 — Düzgün sorğu:**
      - Giriş: `{"request_id": "req-101", "features": [120.5, 0.0, 3.0]}`
      - Doğrulama: `request_id` boş deyil, `features` 3 sonlu (finite) ədəddən ibarətdir.
      - Model balı: `score = 0.82456`
      - Qərar: $0.82456 \ge 0.70 \implies \text{prediction} = 1$
      - Çıxış (`200 OK`):
        ```json
        {
          "request_id": "req-101",
          "prediction": 1,
          "score": 0.8246,
          "model_version": "fraud-v2.1"
        }
        ```

      **Nümunə 2 — Səhv sorğu (`NaN` və ya `bool`):**
      - Giriş: `{"request_id": "req-102", "features": [10.0, true, 5.0]}`
      - Doğrulama: `true` həqiqi ölçü ədədi deyil (`bool`). Modelə çatmadan `ValueError` / `HTTP 422` ilə rədd edilir!
  - id: code-fastapi-pattern
    kind: code
    title: "Kod: Lifespan, Doğrulama və FastAPI Endpoint Şablonu"
    body: |
      ```python
      import math
      from typing import Any

      MODEL_VERSION = "credit-risk-v1.2"


      def validate_prediction_request(payload: dict[str, Any]) -> dict[str, Any]:
          """Giriş sorğusunu modelə ötürməzdən əvvəl sərt müqavilə ilə doğrulayır."""
          if not isinstance(payload, dict):
              raise ValueError("Payload must be a JSON object")

          req_id = payload.get("request_id")
          if not isinstance(req_id, str) or not req_id.strip():
              raise ValueError("request_id must be a non-empty string")

          features = payload.get("features")
          if not isinstance(features, list) or len(features) == 0:
              raise ValueError("features must be a non-empty list of numbers")

          clean_features: list[float] = []
          for idx, val in enumerate(features):
              if isinstance(val, bool) or not isinstance(val, (int, float)):
                  raise ValueError(f"Feature at index {idx} is not a number: {val!r}")
              fval = float(val)
              if math.isnan(fval) or math.isinf(fval):
                  raise ValueError(f"Feature at index {idx} must be finite")
              clean_features.append(fval)

          return {"request_id": req_id.strip(), "features": clean_features}


      def format_prediction_response(
          request_id: str,
          score: float,
          threshold: float = 0.5,
          model_version: str = MODEL_VERSION,
      ) -> dict[str, Any]:
          """Standart versiyalı proqnoz cavabını hazırlayır."""
          if not (0.0 <= threshold <= 1.0):
              raise ValueError("threshold must be between 0 and 1")
          return {
              "request_id": request_id,
              "prediction": 1 if score >= threshold else 0,
              "score": round(float(score), 4),
              "model_version": model_version,
          }
      ```

      FastAPI tətbiqində bu funksiyalar `lifespan` ilə belə birləşir:
      ```python
      from contextlib import asynccontextmanager
      from fastapi import FastAPI, HTTPException

      @asynccontextmanager
      async def lifespan(app: FastAPI):
          app.state.model = load_heavy_model()   # <-- YALNIZ BİR DƏFƏ!
          yield
          app.state.model = None

      app = FastAPI(lifespan=lifespan)

      @app.get("/health")
      def health():
          return {"status": "ok"}

      @app.get("/ready")
      def ready():
          if getattr(app.state, "model", None) is None:
              raise HTTPException(status_code=503, detail="Model not ready")
          return {"status": "ready", "model_version": MODEL_VERSION}
      ```
  - id: common-mistakes
    kind: mistakes
    title: "Ən çox edilən səhvlər"
    body: |
      **1. Endpoint-in içində model və ya tokenizer yükləmək**
      Hər HTTP sorğusunda diskdən çəki faylı oxumaq xidməti yük altında dərhal çökdürür. Model, tokenizer və konfiqurasiya həmişə `lifespan` zamanı yüklənməlidir.

      **2. `NaN` və `Infinity` dəyərlərini buraxmaq**
      Standart float yoxlaması `float("nan")` və `float("inf")` dəyərlərini `float` kimi qəbul edir, lakin bu dəyərlər modelin içində `NaN` proqnoz yaradır və JSON serializasiyasını pozur. Həmişə `math.isfinite()` (və ya `not math.isnan(x) and not math.isinf(x)`) yoxla.

      **3. `async def` endpoint içində ağır bloklayıcı CPU kodu işlətmək**
      FastAPI-də `async def predict()` yazıb içəridə 200 ms çəkən sinxron CPU hesablaması (`model.predict`) aparsan, bütün event loop bloklanır və digər sorğular (hətta `/health`) növbədə donur. Sinxron CPU-bound model çağırışları üçün adi `def predict()` istifadə et ki, FastAPI onu avtomatik threadpool-da işlətsin.

      **4. Cavabda `model_version` qaytarmamaq**
      Yeni model deploy edildikdən sonra xəta baş verdikdə, loglarda və müştəri cavabında `model_version` yoxdursa, hansı modelin xəta verdiyini sübut etmək mümkün olmur.
  - id: tradeoffs
    kind: tradeoffs
    title: "Mühəndislik seçimləri və məhdudiyyətlər"
    body: |
      - **Real-time HTTP Inference vs Batch / Queue Inference:** Əgər istifadəçi cavabı ekranda gözləyirsə (< 500 ms), sinxron FastAPI endpoint uyğundur. Amma 10 dəqiqəlik video transkripsiyası və ya 100,000 sətirlik hesabat üçün HTTP sorğusunu açıq saxlamaq timeout verəcək — belə işlər növbəyə (`202 Accepted` + job ID + background worker) atılmalıdır.
      - **Tək sorğu vs Dynamic Batching:** GPU üzərində dərin neyron şəbəkələr tək-tək sorğularda GPU-nu tam yükləmir. Yüksək trafikdə sorğuları 5–20 ms ərzində qruplaşdırıb (dynamic batching — məs. Triton, vLLM) birlikdə emal etmək keçiriciliyi (throughput) dəfələrlə artırır.
      - **Modelin konteyner içində paketlənməsi vs Xarici Storage-dan yüklənməsi:** Kiçik modellər (< 100 MB) birbaşa imicə daxil edilə bilər; giqabaytlıq modellər isə startup/init zamanı obyekt yaddaşından (S3/GCS) çəkilir.
