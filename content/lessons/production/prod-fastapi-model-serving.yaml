          pass
    tests:
      - name: "Düzgün sorğu doğrulanır və cavab formatlanır"
        code: |
          clean = validate_prediction_request({"request_id": " req-42 ", "features": [1, 2.5, -0.3]})
          assert clean == {"request_id": "req-42", "features": [1.0, 2.5, -0.3]}

          resp = format_prediction_response("req-42", score=0.785432, threshold=0.7, model_version="v1.0")
          assert resp == {
              "request_id": "req-42",
              "prediction": 1,
              "score": 0.7854,
              "model_version": "v1.0",
          }
      - name: "NaN, Inf, bool və boş features rədd edilir"
        code: |
          for bad in [
              {"request_id": "", "features": [1.0]},
              {"request_id": "r1", "features": []},
              {"request_id": "r1", "features": [1.0, True]},
              {"request_id": "r1", "features": [float("nan")]},
              {"request_id": "r1", "features": [float("inf")]},
              {"request_id": "r1", "features": ["1.0"]},
          ]:
              try:
                  validate_prediction_request(bad)
                  assert False, f"Rədd edilməli idi: {bad}"
              except ValueError:
                  pass
      - name: "Yanlış threshold rədd edilir"
        code: |
          for bad_t in [-0.1, 1.2]:
              try:
                  format_prediction_response("r1", 0.5, bad_t, "v1")
                  assert False, "Yanlış threshold üçün ValueError qaldırılmalı idi"
              except ValueError:
                  pass
    solution: |
      import math
      from typing import Any

      def validate_prediction_request(payload: dict[str, Any]) -> dict[str, Any]:
          if not isinstance(payload, dict):
              raise ValueError("payload must be a dict")
          req_id = payload.get("request_id")
          if not isinstance(req_id, str) or not req_id.strip():
              raise ValueError("request_id must be a non-empty string")
          features = payload.get("features")
          if not isinstance(features, list) or len(features) == 0:
              raise ValueError("features must be a non-empty list")

          clean_features: list[float] = []
          for x in features:
              if isinstance(x, bool) or not isinstance(x, (int, float)):
                  raise ValueError("each feature must be a number")
              fx = float(x)
              if math.isnan(fx) or math.isinf(fx):
                  raise ValueError("features must be finite")
              clean_features.append(fx)

          return {"request_id": req_id.strip(), "features": clean_features}


      def format_prediction_response(
          request_id: str,
          score: float,
          threshold: float,
          model_version: str,
      ) -> dict[str, Any]:
          if not (0.0 <= threshold <= 1.0):
              raise ValueError("threshold must be in [0, 1]")
          return {
              "request_id": request_id,
              "prediction": 1 if score >= threshold else 0,
              "score": round(float(score), 4),
              "model_version": model_version,
          }
    explanation: |
      Giriş funksiyası modelə çatmazdan əvvəl bütün təhlükəli halları (`bool`, `NaN`, `Inf`, boş siyahı) tutur. Çıxış funksiyası isə proqnozu `request_id` və `model_version` ilə standart müqaviləyə salır.
