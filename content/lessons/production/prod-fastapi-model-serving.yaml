quiz:
  pass_threshold: 0.75
  questions:
    - id: q-prodfast-load-once
      type: mcq
      title: "Modelin yaddaşa yüklənmə yeri"
      prompt: "300 MB-lıq ML modelini FastAPI xidmətində harada yükləmək düzgün mühəndislik praktikasıdır?"
      skills: [prod-model-serving]
      category: production
      options:
        - id: a
          text: "POST /predict funksiyasının ilk sətrində, hər sorğu gələndə yenidən diskdən oxumaqla"
          feedback: "Xeyr — hər sorğuda 300 MB disk I/O etmək gecikməni saniyələrə qaldırır və yaddaşı doldurur."
        - id: b
          text: "Tətbiqin startup / lifespan mərhələsində bir dəfə yaddaşa yükləyib bütün sorğularda həmin hazır obyektdən istifadə etməklə"
          feedback: "Doğrudur. Startup zamanı bir dəfə yükləmə sorğu gecikməsini millisaniyələr səviyyəsində saxlayır."
        - id: c
          text: "Müştərinin brauzerindən hər sorğuda model faylını upload etməsini istəməklə"
          feedback: "Müştəri yalnız giriş əlamətlərini (features) göndərir, model serverdə saxlanılır."
      answer: b
      explanation: "Ağır model artefaktları startup (lifespan) zamanı bir dəfə yüklənməli və sorğular arasında read-only olaraq paylaşılmalıdır."
    - id: q-prodfast-health-vs-ready
      type: mcq
      title: "/health və /ready fərqi"
      prompt: "Yeni qaldırılmış konteynerdə FastAPI prosesi artıq işə düşüb, lakin 2 GB-lıq model hələ S3-dən RAM-a yüklənir. Bu anda `/health` (liveness) və `/ready` (readiness) hansı HTTP statuslarını qaytarmalıdır?"
      skills: [prod-model-serving]
      category: production
      options:
        - id: a
          text: "/health -> 200 OK, /ready -> 503 Service Unavailable"
          feedback: "Doğrudur. Proses sağdır (restart lazım deyil), amma model hələ yüklənmədiyi üçün trafik qəbul etməyə hazır deyil."
        - id: b
          text: "/health -> 500 Error, /ready -> 200 OK"
          feedback: "Əksinə! /health 500 qaytarsa orkestrator konteyneri öldürüb yenidən başladacaq və model heç vaxt yüklənib bitməyəcək."
        - id: c
          text: "Hər ikisi 200 OK qaytarmalıdır"
          feedback: "/ready 200 qaytarsa, load balancer hələ modeli olmayan konteynerə real müştəri sorğuları göndərəcək və sorğular xəta verəcək."
      answer: a
      explanation: "Liveness (/health) prosesin sağ olduğunu bildirir ki, konteyner öldürülməsin; Readiness (/ready) isə model tam hazır olana qədər 503 qaytararaq trafiki qoruyur."
    - id: q-prodfast-response-fields
      type: multi
      title: "Production proqnoz cavabının müqaviləsi"
      prompt: "Production-da işləyən `/predict` endpoint-inin cavabında proqnoz (`prediction`) ilə yanaşı hansı sahələrin qaytarılması izlənilə bilənlik (traceability) və debugging üçün vacibdir? Doğru olanları seç."
      skills: [prod-model-serving]
      category: production
      options:
        - id: a
          text: "request_id — müştəri sorğusunu server logları ilə əlaqələndirmək üçün"
          feedback: "Bəli — xəta və ya şikayət zamanı konkret sorğunu tapmaq üçün əvəzsizdir."
        - id: b
          text: "model_version — qərarı hansı model versiyasının verdiyini dəqiq bilmək üçün"
          feedback: "Bəli — model yenilənmələrindən sonra reqressiyanı aşkar etmək üçün şərtdir."
        - id: c
          text: "score / probability — qərar həddindən (threshold) əvvəlki xam əminlik balı"
          feedback: "Bəli — paylanma sürüşməsini (drift) və sərhəddəki qərarları təhlil etməyə kömək edir."
        - id: d
          text: "Serverin gizli database parolu və API açarları"
          feedback: "Xeyr — gizli açarlar heç vaxt API cavabında və ya loglarda qaytarılmamalıdır!"
      answers: [a, b, c]
      explanation: "`request_id`, `model_version` və `score` production-da hər bir proqnozun audit və debug edilməsini təmin edir."
exercises:
  - id: ex-prodfast-validate-predict
    type: code
    title: "validate_prediction_request və format_prediction_response yaz"
    prompt: |
      Model serving endpoint-i üçün giriş doğrulayıcı və çıxış formatlayıcı iki funksiya yaz:

      1. `validate_prediction_request(payload: dict) -> dict`
         - `payload` bir `dict` olmalıdır.
         - `"request_id"` boş olmayan `str` olmalıdır (`.strip()` edildikdən sonra ən azı 1 simvol).
         - `"features"` boş olmayan `list` olmalıdır. Siyahıdakı hər bir element sonlu (`finite`) ədəd (`int` və ya `float`, lakin **`bool` deyil** və `NaN` / `inf` deyil) olmalıdır.
         - Hər hansı şərt pozularsa `ValueError` qaldır.
         - Doğrudursa `{"request_id": req_id.strip(), "features": [float(x) for x in features]}` qaytar.

      2. `format_prediction_response(request_id: str, score: float, threshold: float, model_version: str) -> dict`
         - `threshold` `0.0 <= threshold <= 1.0` aralığında deyilsə `ValueError` qaldır.
         - Bu lüğəti qaytar:
           `{"request_id": request_id, "prediction": 1 if score >= threshold else 0, "score": round(float(score), 4), "model_version": model_version}`
    skills: [prod-model-serving, py-errors]
    category: python
    difficulty: 2
    hints:
      - "`isinstance(val, bool) or not isinstance(val, (int, float))` ilə həm qeyri-ədədləri, həm də `True`/`False`-u rədd et."
      - "`math.isnan(fval) or math.isinf(fval)` yoxlaması ilə `NaN` və sonsuzluqları tut."
      - "`round(float(score), 4)` ilə balı 4 onluq rəqəmə yuvarlaqlaşdır."
    starter_code: |
