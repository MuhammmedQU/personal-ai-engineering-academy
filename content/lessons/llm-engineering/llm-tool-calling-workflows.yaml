    tests:
      - name: "Oxuma aləti dərhal icra olunur"
        code: |
          tools = {"add": lambda a, b: a + b, "delete": lambda x: f"deleted {x}"}
          res = dispatch_tool_call(
              {"name": "add", "args": {"a": 3, "b": 4}},
              allowed_tools=tools,
              requires_approval={"delete"},
              approved=False,
          )
          assert res == {"status": "executed", "tool": "add", "result": 7}
      - name: "Təsdiq tələb edən alət approved=False olduqda çağırılmır"
        code: |
          called = []
          tools = {"delete": lambda x: called.append(x) or "done"}
          res = dispatch_tool_call(
              {"name": "delete", "args": {"x": "id-1"}},
              allowed_tools=tools,
              requires_approval={"delete"},
              approved=False,
          )
          assert res == {"status": "pending_approval", "tool": "delete", "result": None}
          assert called == [], "Funksiya təsdiqsiz çağırılmamalı idi!"

          res_ok = dispatch_tool_call(
              {"name": "delete", "args": {"x": "id-1"}},
              allowed_tools=tools,
              requires_approval={"delete"},
              approved=True,
          )
          assert res_ok == {"status": "executed", "tool": "delete", "result": "done"}
          assert called == ["id-1"]
      - name: "İcazəsiz alət PermissionError, yanlış struktur ValueError qaldırır"
        code: |
          tools = {"ping": lambda: "pong"}
          try:
              dispatch_tool_call({"name": "hack", "args": {}}, tools, set(), approved=True)
              assert False, "PermissionError qaldırılmalı idi"
          except PermissionError:
              pass

          for bad_call in [{"name": "", "args": {}}, {"name": "ping", "args": [1]}, "not-a-dict"]:
              try:
                  dispatch_tool_call(bad_call, tools, set())
                  assert False, f"ValueError qaldırılmalı idi: {bad_call}"
              except ValueError:
                  pass
    solution: |
      from typing import Any, Callable

      def dispatch_tool_call(
          call: dict[str, Any],
          allowed_tools: dict[str, Callable[..., Any]],
          requires_approval: set[str],
          approved: bool = False,
      ) -> dict[str, Any]:
          if not isinstance(call, dict):
              raise ValueError("call must be a dict")
          name = call.get("name")
          args = call.get("args")
          if not isinstance(name, str) or not name:
              raise ValueError("name must be a non-empty string")
          if not isinstance(args, dict):
              raise ValueError("args must be a dict")

          if name not in allowed_tools:
              raise PermissionError(f"Tool {name!r} is not allowed")

          if name in requires_approval and not approved:
              return {
                  "status": "pending_approval",
                  "tool": name,
                  "result": None,
              }

          result = allowed_tools[name](**args)
          return {
              "status": "executed",
              "tool": name,
              "result": result,
          }
    explanation: |
      Dispatcher əvvəlcə struktur müqaviləsini (`ValueError`), sonra allowlist icazəsini (`PermissionError`), daha sonra isə insan təsdiqi bayrağını (`pending_approval`) yoxlayır. Yalnız bütün qapılardan keçən çağırış icra edilir.
