      2. `recall_at_k(retrieved_ids: list[str], relevant_ids: set[str], k: int) -> float`
         - `k <= 0` və ya `relevant_ids` boşdursa `0.0` qaytar.
         - İlk `k` axtarış nəticəsi (`retrieved_ids[:k]`) içində tapılan unikal `relevant_ids` elementlərinin sayını `len(relevant_ids)`-ə bölərək qaytar.
