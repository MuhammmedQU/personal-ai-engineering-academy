    type: code
    title: "chunk_text və recall_at_k funksiyalarını yaz"
    prompt: |
      RAG pipeline və onun qiymətləndirilməsi üçün iki funksiya yaz:

      1. `chunk_text(text: str, chunk_size: int, overlap: int = 0) -> list[str]`
         - `chunk_size <= 0` və ya `overlap < 0` və ya `overlap >= chunk_size` olarsa `ValueError` qaldır.
         - `text` boşdursa (`""`) `[]` qaytar.
