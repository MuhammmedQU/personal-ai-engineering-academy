        code: |
          for cs, ov in [(0, 0), (-3, 0), (4, -1), (4, 4), (4, 5)]:
              try:
                  chunk_text("hello", cs, ov)
                  assert False, f"({cs}, {ov}) üçün ValueError qaldırılmalı idi"
              except ValueError:
                  pass
      - name: "recall_at_k düzgün hesablayır"
        code: |
          rel = {"doc1", "doc3", "doc5", "doc7"}
          ret = ["doc2", "doc3", "doc1", "doc9", "doc5"]
          assert recall_at_k(ret, rel, k=2) == 0.25
          assert recall_at_k(ret, rel, k=3) == 0.5
          assert recall_at_k(ret, rel, k=0) == 0.0
          assert recall_at_k(ret, set(), k=3) == 0.0
    solution: |
      def chunk_text(text: str, chunk_size: int, overlap: int = 0) -> list[str]:
          if chunk_size <= 0 or overlap < 0 or overlap >= chunk_size:
              raise ValueError("Invalid chunk_size or overlap")
          if not text:
              return []
          step = chunk_size - overlap
          chunks: list[str] = []
          for start in range(0, len(text), step):
              chunks.append(text[start : start + chunk_size])
              if start + chunk_size >= len(text):
                  break
          return chunks


      def recall_at_k(retrieved_ids: list[str], relevant_ids: set[str], k: int) -> float:
          if k <= 0 or not relevant_ids:
              return 0.0
          hits = len(set(retrieved_ids[:k]) & relevant_ids)
          return hits / len(relevant_ids)
    explanation: |
      `chunk_text` əvvəlcə sonsuz dövr yarada biləcək `overlap >= chunk_size` halını rədd edir, sonra `step = chunk_size - overlap` ilə irəliləyir. `recall_at_k` isə çoxluqların kəsişməsi ilə ilk `k` nəticədə tapılan həqiqi sənədlərin payını tapır.
  - id: ex-llmrag-debug-diagnosis
    type: explain
    title: "İzah et: RAG sistemində aşağı dəqiqliyin diaqnozu"
    prompt: |
      Komandan daxili HR qaydaları üzrə RAG botu qurub. İstifadəçilər məzuniyyət günləri barədə sual verəndə bot tez-tez səhv cavab qaytarır.

      Səndən problemi tapmaq istənilir. Əlində 50 sualdan ibarət test dəsti var. **Retrieval** və **Generation** mərhələlərini bir-birindən ayırmaq üçün hansı iki ölçməni aparacaqsan və hər birinin nəticəsinə görə hansı düzəlişi tətbiq edəcəksən?
    skills: [llm-rag, llm-evaluation]
    category: debug
    difficulty: 2
    hints:
      - "Əvvəlcə 50 sual üçün düzgün cavabın hansı chunk-da olduğunu qeyd et və axtarışın onları tapıb-tapmadığını (`Recall@k`) ölç."
      - "Əgər `Recall@k` aşağıdırsa nəyi dəyişirsən? Əgər `Recall@k` yüksəkdirsə, amma cavab yenə səhvdirsə nəyi dəyişirsən?"
    rubric:
      - "50 suallıq test dəstində hər sual üçün gözlənilən mənbə chunk/sənəd ID-lərini müəyyənləşdirib Recall@k (və ya MRR) ilə Retrieval mərhələsini ayrıca ölçməyi qeyd edir"
      - "Retrieval zəifdirsə (aşağı Recall@k): chunking/overlap, hybrid search (BM25 + embedding) və ya reranker ilə axtarışı düzəltməyi təklif edir"
      - "Retrieval güclüdürsə, amma son cavab səhvdirsə (aşağı Faithfulness/Groundedness): promptda yalnız kontekstə əsaslanma, sitat tələbi və məlumat yoxdursa imtina qaydasını gücləndirməyi təklif edir"
    model_answer: |
      1. **Addım 1 — Retrieval qiymətləndirilməsi (`Recall@k`):** 50 test sualının hər biri üçün HR sənədlərindəki həqiqi cavab parçalarını işarələyirəm və LLM-i işə salmadan yalnız axtarışın `Recall@5` göstəricisini ölçürəm.
         - **Əgər `Recall@5` aşağıdırsa:** Problem axtarışdadır. Chunk ölçüsünü və overlap-i tənzimləyirəm, cədvəllərin kəsilmədiyini yoxlayıram və BM25 + Embedding **Hybrid Search** əlavə edirəm.
      2. **Addım 2 — Generation qiymətləndirilməsi (`Faithfulness / Groundedness`):** Əgər `Recall@5` yüksəkdirsə (doğru parça tapılır), deməli LLM həmin parçanı səhv şərh edir və ya digər parçalarla qarışdırır.
         - **Düzəliş:** Reranker ilə prompta gedən səs-küylü parçaları azaldıram (məs. top-15-dən top-3-ə), promptda hər rəqəm üçün mənbə sitatı (`[chunk_id]`) tələb edirəm və kontekstdə açıq yazılmayan halda imtina qaydası qoyuram.
    explanation: "Retrieval və generasiyanı ayrı ölçmək kor-koranə təxminləri aradan qaldırır və mühəndis vaxtını həqiqi darboğaza yönəldir."
