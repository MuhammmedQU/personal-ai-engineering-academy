      title: 20 sorğuda p95 latency
      prompt: "20 sorğunun artan sıra ilə düzülmüş gecikmələri (ms ilə) belədir: ilk 18 sorğu `400` ms, 19-cu sorğu `1450` ms, 20-ci sorğu isə `3200` ms. Nearest-rank qaydası ilə ($\\text{indeks} = \\lceil 0.95 \\times N \\rceil - 1$) $p_{95}$ gecikmə neçə millisaniyədir?"
