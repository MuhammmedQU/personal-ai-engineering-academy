exercises:
  - id: ex-llmtok-validate-ticket
    type: code
    title: "validate_ticket_response validatorunu yaz"
    prompt: |
      LLM-dən qayıdan xam JSON mətnini (`raw_json_str`) doğrulayan `validate_ticket_response(raw_json_str: str) -> dict` funksiyasını yaz.

      **Müqavilə:**
      1. `raw_json_str` düzgün JSON obyekti (`dict`) olmalıdır. Parse xətası varsa və ya kök element `dict` deyilsə `ValueError` qaldır.
      2. Tələb olunan sahələr:
         - `"category"`: yalnız `"billing"`, `"technical"` və ya `"account"` ola bilər.
         - `"urgency"`: `1` ilə `5` arasında (hər ikisi daxil) tam ədəd (`int`) olmalıdır. Diqqət: `bool` dəyərlər (`True`/`False`) rədd edilməlidir!
         - `"summary"`: boş olmayan `str` olmalıdır (kənar boşluqlar `.strip()` ilə təmizləndikdən sonra ən azı 1 simvol qalmalıdır).
      3. Hər hansı qayda pozularsa `ValueError` qaldır.
      4. Doğrulama uğurludursa, yalnız bu 3 açardan ibarət təmizlənmiş `dict` qaytar (`"summary"` `.strip()` olunmuş halda).
    skills: [llm-structured-output]
    category: python
    difficulty: 2
    hints:
      - "`json.loads(raw_json_str)` çağırışını `try...except Exception` içində yaz və xəta olduqda `raise ValueError(...)` et."
      - "Python-da `isinstance(True, int)` ifadəsi `True` qaytarır! Ona görə əvvəlcə `if isinstance(urgency, bool) or not isinstance(urgency, int): raise ValueError(...)` yoxla."
      - "Qaytarılan dict-də əlavə yad açarlar olmamalı və `summary.strip()` qaytarılmalıdır."
    starter_code: |
      import json

      ALLOWED_CATEGORIES = {"billing", "technical", "account"}

      def validate_ticket_response(raw_json_str: str) -> dict:
          # TODO: JSON-u parse et, sahələri doğrula və təmiz dict qaytar
          pass
    tests:
      - name: "Düzgün JSON cavabı qəbul edilir və summary strip olunur"
        code: |
          raw = '{"category": "billing", "urgency": 4, "summary": "  Kartdan iki dəfə ödəniş çıxılıb  ", "extra": 123}'
          res = validate_ticket_response(raw)
          assert res == {
              "category": "billing",
              "urgency": 4,
              "summary": "Kartdan iki dəfə ödəniş çıxılıb",
          }, f"Gözlənilməz nəticə: {res}"
      - name: "Sınıq JSON mətni ValueError qaldırır"
        code: |
          try:
              validate_ticket_response("{broken json")
              assert False, "ValueError qaldırılmalı idi"
          except ValueError:
              pass
      - name: "İcazəsiz category və ya səhv urgency rədd edilir"
        code: |
          for bad in [
              '{"category": "sales", "urgency": 3, "summary": "ok"}',
              '{"category": "technical", "urgency": 6, "summary": "ok"}',
              '{"category": "technical", "urgency": 0, "summary": "ok"}',
              '{"category": "technical", "urgency": true, "summary": "ok"}',
              '{"category": "account", "urgency": 2, "summary": "   "}',
              '[1, 2, 3]',
          ]:
              try:
                  validate_ticket_response(bad)
                  assert False, f"Bu input rədd edilməli idi: {bad}"
              except ValueError:
                  pass
    solution: |
      import json

      ALLOWED_CATEGORIES = {"billing", "technical", "account"}

      def validate_ticket_response(raw_json_str: str) -> dict:
          try:
              data = json.loads(raw_json_str)
          except Exception as exc:
              raise ValueError(f"Invalid JSON: {exc}") from exc

          if not isinstance(data, dict):
              raise ValueError("Root must be a JSON object")

          category = data.get("category")
          if category not in ALLOWED_CATEGORIES:
              raise ValueError(f"Invalid category: {category!r}")

          urgency = data.get("urgency")
          if isinstance(urgency, bool) or not isinstance(urgency, int) or not (1 <= urgency <= 5):
              raise ValueError(f"Invalid urgency: {urgency!r}")

          summary = data.get("summary")
          if not isinstance(summary, str) or not summary.strip():
              raise ValueError("Invalid summary")

          return {
              "category": category,
              "urgency": urgency,
              "summary": summary.strip(),
          }
    explanation: |
      Validator funksiyası LLM çıxışını etibarsız xarici input kimi emal edir: əvvəlcə sintaktik JSON parse, sonra kök tipin `dict` olması, daha sonra hər bir sahənin tipi və biznes sərhədləri yoxlanılır. Əlavə yad açarlar (`"extra"`) təmizlənərək yalnız müqavilədəki struktur qaytarılır.
  - id: ex-llmtok-monthly-cost
    type: numeric
    title: "Aylıq LLM API büdcəsini hesabla"
    prompt: |
      Şirkət daxili sənəd xülasələşdirmə xidməti ayda **10,000 sorğu** emal edir.
      - Hər sorğuda orta giriş: $N_{\text{in}} = 1\,500$ token
      - Hər sorğuda orta çıxış: $N_{\text{out}} = 400$ token
      - Qiymət: giriş $\$2.00 / 10^6$ token, çıxış $\$8.00 / 10^6$ token

      Bu xidmətin aylıq LLM API xərci neçə ABŞ dollarıdır (USD)?
    skills: [llm-tokens-context]
    category: math
    difficulty: 1
    answer: 62
    tolerance: 0.1
    unit: "USD"
    hints:
      - "Aylıq ümumi giriş tokeni: 10,000 * 1,500 = 15,000,000 (15 milyon token)."
      - "Aylıq ümumi çıxış tokeni: 10,000 * 400 = 4,000,000 (4 milyon token)."
      - "Xərc = 15 * 2.00 + 4 * 8.00"
    explanation: |
      Ayda 15M giriş tokeni ($15 \times \$2.00 = \$30.00$) və 4M çıxış tokeni ($4 \times \$8.00 = \$32.00$) sərf olunur. Ümumi aylıq xərc $\$30.00 + \$32.00 = \$62.00$ təşkil edir.
  - id: ex-llmtok-retry-policy-mcq
    type: mcq
    title: "Structured Output: Sxem xətası zamanı düzgün Retry və Validation axını"
    prompt: |
      Müştəri rəylərini təsnif edən xidmət LLM-dən JSON sxeminə uyğun cavab tələb edir. İlk cəhddə model `"urgency": "high"` qaytarır, halbuki sxem `1..5` arası tam ədəd (`int`) tələb edir.

      Production sistemində ən düzgün avtomatik mühəndislik davranışı hansıdır?
    skills: [llm-structured-output]
    category: llm-architecture
    difficulty: 2
    hints:
      - "Modelə hansı sahədə nə səhv etdiyini (`ValidationError` mesajını) demədən eyni promptu sonsuz dövrdə göndərmək həm xərci partladır, həm də eyni səhvi təkrarladır."
      - "Retry sayı məhdud (`max_retries=2`) olmalı, uğursuz qaldıqda isə təhlükəsiz fallback/xəta qaytarılmalıdır."
    options:
      - id: a
        text: "ValidationError mesajını növbəti cəhdin kontekstinə əlavə edib maksimum 1–2 dəfə yenidən sorğulamaq (bounded retry); yenə uğursuz olarsa strukturlaşdırılmış xəta qaytarıb loglamaq"
        feedback: "Doğrudur! Konkret doğrulama xətasını göstərmək modelə öz səhvini düzəltməyə imkan verir, məhdud cəhd sayı isə xərci və gecikməni qoruyur."
      - id: b
        text: "`while True:` dövründə düzgün JSON alınana qədər məhdudiyyətsiz retry etmək"
        feedback: "Sonsuz retry həm istifadəçi sorğusunu asılı vəziyyətdə qoyur, həm də API büdcəsini dəqiqələr içində tükədə bilər."
      - id: c
        text: "Doğrulamanı söndürüb `\"high\"` string-ni birbaşa verilənlər bazasının `INTEGER` sütununa yazmağa çalışmaq"
        feedback: "Bu, xətanı aşağı axındakı verilənlər bazasına ötürüb bütün pipeline-ı çökdürəcək."
    answer: a
    explanation: "Structured output validatoru uğursuz olduqda ən effektiv pattern: konkret `ValidationError` mesajı ilə məhdud sayda (`max_retries <= 2`) düzəliş istəmək və hədd aşılarsa deterministik fallback/error qaytarmaqdır."
