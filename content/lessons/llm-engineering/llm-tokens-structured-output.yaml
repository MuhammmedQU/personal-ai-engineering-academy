quiz:
  pass_threshold: 0.75
  questions:
    - id: q-llmtok-inference-memory
      type: mcq
      title: "API çağırışı və model yaddaşı"
      prompt: "Standart LLM API-sinə (inference endpoint) müştəri qaydalarını əhatə edən prompt göndərdikdə modelin daxili çəkilərinə (weights) nə baş verir?"
      skills: [llm-tokens-context]
      category: concept
      options:
        - id: a
          text: "Model qaydaları öyrənir və növbəti müstəqil API sorğularında həmin qaydaları avtomatik xatırlayır"
          feedback: "Xeyr — inference zamanı modelin çəkiləri dəyişmir və hər sorğu müstəqildir (stateless)."
        - id: b
          text: "Modelin çəkiləri dəyişmir; göndərilən mətn yalnız həmin sorğunun context window-u daxilində müvəqqəti emal olunur"
          feedback: "Doğrudur. Inference zamanı çəkilər dondurulmuş olur; növbəti sorğuda həmin məlumatı yenidən göndərməsən model onu bilmir."
        - id: c
          text: "Model yalnız temperature=0 olduqda məlumatı yaddaşına yazır"
          feedback: "Temperature yalnız token seçimi zamanı təsadüfiliyi idarə edir, çəkiləri yeniləmir."
      answer: b
      explanation: "Inference API çağırışları stateless-dir və modelin parametrlərini yeniləmir. Context window yalnız cari sorğu müddətində aktiv olan işçi yaddaşdır."
    - id: q-llmtok-latency-driver
      type: mcq
      title: "LLM gecikməsinin (latency) əsas səbəbi"
      prompt: "Niyə eyni modeldə 500 tokenlik cavab generasiya etmək 500 tokenlik giriş promptunu oxumaqdan qat-qat çox vaxt aparır?"
      skills: [llm-tokens-context]
      category: llm-architecture
      options:
        - id: a
          text: "Giriş tokenləri GPU-da paralel emal olunur (prefill), çıxış tokenləri isə avtoreqressiv olaraq bir-bir ardıcıl generasiya edilir"
          feedback: "Doğrudur. Hər yeni çıxış tokeni əvvəlki token hazır olduqdan sonra növbəti addımda hesablanır."
        - id: b
          text: "Giriş tokenləri sıxılır, çıxış tokenləri isə şifrələnir"
          feedback: "Xeyr, fərq şifrələmədə deyil, Transformer arxitekturasının paralel prefill vs ardıcıl decode mərhələlərindədir."
        - id: c
          text: "API serverləri yalnız çıxış tokenlərini diskə yazır"
          feedback: "Gecikmənin əsas mənbəyi disk yox, GPU-da ardıcıl avtoreqressiv hesablamadır."
      answer: a
      explanation: "Prefill mərhələsində bütün giriş tokenləri matris vurması ilə paralel hesablanır. Decode mərhələsində isə model növbəti tokeni tapmaq üçün əvvəlki tokenin nəticəsini gözləməlidir."
    - id: q-llmtok-request-cost
      type: numeric
      title: "Bir sorğunun token xərci"
      prompt: |
        Bir API sorğusunda $N_{\text{in}} = 2000$ giriş tokeni və $N_{\text{out}} = 500$ çıxış tokeni işlənib.
        Modelin qiyməti:
        - Giriş: $\$3.00 / 10^6$ token
        - Çıxış: $\$12.00 / 10^6$ token

        Bu tək sorğunun ümumi xərci neçə ABŞ dollarıdır (USD)?
      skills: [llm-tokens-context]
      category: math
      answer: 0.012
      tolerance: 0.0005
      unit: "USD"
      hints:
        - "Giriş xərci: (2000 / 1_000_000) * 3.00"
        - "Çıxış xərci: (500 / 1_000_000) * 12.00"
      explanation: "Giriş xərci = $0.002 \\times 3 = 0.006$ USD. Çıxış xərci = $0.0005 \\times 12 = 0.006$ USD. Cəmi = $0.006 + 0.006 = 0.012$ USD."
    - id: q-llmtok-structured-practices
      type: multi
      title: "Etibarlı strukturlaşdırılmış çıxış qaydaları"
      prompt: "Production-da LLM-dən JSON çıxışı alarkən hansı mühəndislik addımları tətbiq edilməlidir? Doğru olanların hamısını seç."
      skills: [llm-structured-output]
      category: production
      options:
