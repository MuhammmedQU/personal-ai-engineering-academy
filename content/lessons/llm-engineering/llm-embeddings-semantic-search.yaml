              {"id": "zero", "vec": [0.0, 0.0]},
              {"id": "pos", "vec": [2.0, 2.0]},
          ]
          assert top_k_similar([1.0, 1.0], docs, k=0) == []
          assert top_k_similar([1.0, 1.0], docs, k=2) == ["pos", "zero"]
          assert top_k_similar([0.0, 0.0], docs, k=1) == ["zero"]
      - name: "Ölçü uyğunsuzluğunda ValueError qaldırır"
        code: |
          try:
              top_k_similar([1.0, 2.0], [{"id": "bad", "vec": [1.0, 2.0, 3.0]}], k=1)
              assert False, "Fərqli vektor ölçüsü üçün ValueError qaldırılmalı idi"
          except ValueError:
              pass
    solution: |
      import math

      def _cosine(u: list[float], v: list[float]) -> float:
          if len(u) != len(v):
              raise ValueError("Vector dimensions must match")
          dot = sum(a * b for a, b in zip(u, v))
          nu = math.sqrt(sum(a * a for a in u))
          nv = math.sqrt(sum(b * b for b in v))
          if nu == 0.0 or nv == 0.0:
              return 0.0
          return dot / (nu * nv)

      def top_k_similar(query_vec: list[float], docs: list[dict], k: int) -> list[str]:
          if k <= 0 or not docs:
              return []
          scored = [(_cosine(query_vec, d["vec"]), d["id"]) for d in docs]
          scored.sort(key=lambda item: item[0], reverse=True)
          return [doc_id for _, doc_id in scored[:k]]
    explanation: |
      Funksiya hər sənəd üçün ölçü uyğunluğunu yoxlayır, sıfır-norma vektorlarını qoruyaraq cosine similarity hesablayır və ən yüksək bal toplayan ilk `k` sənədin ID-sini qaytarır.
