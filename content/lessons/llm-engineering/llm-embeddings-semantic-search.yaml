    tests:
      - name: "Ən yaxın top-2 sənədi düzgün ardıcıllıqla tapır"
        code: |
          docs = [
              {"id": "d1", "vec": [1.0, 0.0, 0.0]},
              {"id": "d2", "vec": [0.0, 1.0, 0.0]},
              {"id": "d3", "vec": [0.9, 0.1, 0.0]},
          ]
          res = top_k_similar([1.0, 0.0, 0.0], docs, k=2)
          assert res == ["d1", "d3"], f"Gözlənilən ['d1', 'd3'], alınan {res}"
      - name: "k <= 0 və sıfır vektor hallarını təhlükəsiz idarə edir"
        code: |
