exercises:
  - id: ex-specdist-kv-capacity
    type: code
    title: "GPU KV-Cache və Maksimum Batch Tutumu (estimate_kv_cache_capacity) funksiyasını yaz"
    prompt: |
      LLM serving planlaması üçün `estimate_kv_cache_capacity(...)` funksiyasını yaz:

      **Parametrlər:**
      `num_layers: int, num_kv_heads: int, head_dim: int, seq_len: int, bytes_per_elem: int, gpu_vram_gib: float, model_weights_gib: float, overhead_gib: float = 2.0`

      **Müqavilə (Contract):**
      1. `num_layers, num_kv_heads, head_dim, seq_len, bytes_per_elem` dəyərlərindən hər hansı biri `<= 0` olarsa və ya `gpu_vram_gib <= 0`, `model_weights_gib < 0`, `overhead_gib < 0` olarsa `ValueError` qaldır.
      2. Tək bir sorğunun (sequence) KV-Cache ölçüsünü GiB ilə hesabla ($\text{1 GiB} = 1024^3$ bayt):
         $$\text{bytes\_per\_seq} = 2 \cdot L \cdot n_{\text{kv}} \cdot d_{\text{head}} \cdot S \cdot b_{\text{elem}}$$
      3. Sərbəst VRAM: `free_vram_gib = max(0.0, gpu_vram_gib - model_weights_gib - overhead_gib)`.
      4. Maksimum tam paralel sorğu sayı: `max_batch_size = int(free_vram_gib // kv_per_seq_gib)` (sərbəst VRAM 0-dırsa `0`).
      5. Qaytar: `{"kv_per_seq_gib": round(kv_per_seq_gib, 4), "free_vram_gib": round(free_vram_gib, 4), "max_batch_size": max_batch_size}`.
    skills: [spec-distributed-inference, dl-architectures]
    category: llm-architecture
    difficulty: 2
    hints:
      - "Əvvəlcə bütün müsbət/mənfi olmayan parametr yoxlamalarını et və səhvdirsə `raise ValueError(...)`."
      - "GiB əmsalı `1024 ** 3`-dür (1_073_741_824). `kv_per_seq_gib = (2 * num_layers * num_kv_heads * head_dim * seq_len * bytes_per_elem) / (1024 ** 3)`. Sərbəst yaddaş `max(0.0, gpu_vram_gib - model_weights_gib - overhead_gib)`."
    starter_code: |
      def estimate_kv_cache_capacity(
          num_layers: int,
          num_kv_heads: int,
          head_dim: int,
          seq_len: int,
          bytes_per_elem: int,
          gpu_vram_gib: float,
          model_weights_gib: float,
          overhead_gib: float = 2.0,
      ) -> dict:
          # TODO: validasiya et, KV-cache (GiB), free_vram_gib və max_batch_size hesabla
          return {"kv_per_seq_gib": 0.0, "free_vram_gib": 0.0, "max_batch_size": 0}
    solution: |
      def estimate_kv_cache_capacity(
          num_layers: int,
          num_kv_heads: int,
          head_dim: int,
          seq_len: int,
          bytes_per_elem: int,
          gpu_vram_gib: float,
          model_weights_gib: float,
          overhead_gib: float = 2.0,
      ) -> dict:
          if min(num_layers, num_kv_heads, head_dim, seq_len, bytes_per_elem) <= 0:
              raise ValueError("architecture dimensions must be positive")
          if gpu_vram_gib <= 0 or model_weights_gib < 0 or overhead_gib < 0:
              raise ValueError("invalid VRAM budget parameters")

          gib = 1024 ** 3
          bytes_per_seq = (
              2 * num_layers * num_kv_heads * head_dim * seq_len * bytes_per_elem
          )
          kv_per_seq_gib = bytes_per_seq / gib
          free_vram_gib = max(0.0, gpu_vram_gib - model_weights_gib - overhead_gib)
          max_batch = int(free_vram_gib // kv_per_seq_gib)
          return {
              "kv_per_seq_gib": round(kv_per_seq_gib, 4),
              "free_vram_gib": round(free_vram_gib, 4),
              "max_batch_size": max_batch,
          }
    tests:
      - name: "Llama-3-8B FP16 24 GiB GPU-da (S=4096) dəqiq 0.5 GiB/seq və max_batch=12 verir"
        code: |
          res = estimate_kv_cache_capacity(32, 8, 128, 4096, 2, 24.0, 16.0, 2.0)
          assert res == {"kv_per_seq_gib": 0.5, "free_vram_gib": 6.0, "max_batch_size": 12}
      - name: "INT4 çəkilər (5 GiB) + FP8 KV-Cache (b=1) tutumu kəskin artırır"
        code: |
          res = estimate_kv_cache_capacity(32, 8, 128, 4096, 1, 24.0, 5.0, 2.0)
          assert res == {"kv_per_seq_gib": 0.25, "free_vram_gib": 17.0, "max_batch_size": 68}
      - name: "Çəkilər + overhead GPU-nu aşdıqda sərbəst VRAM 0 və max_batch=0 olur"
        code: |
          res = estimate_kv_cache_capacity(32, 8, 128, 4096, 2, 16.0, 16.0, 2.0)
          assert res["free_vram_gib"] == 0.0 and res["max_batch_size"] == 0
      - name: "Yanlış (0 və ya mənfi) parametrlərdə ValueError qaldırır"
        code: |
          try:
              estimate_kv_cache_capacity(0, 8, 128, 4096, 2, 24.0, 16.0)
              assert False
          except ValueError:
              pass
    explanation: "KV-Cache büdcəsini əvvəlcədən hesablamaq production serving-də OOM qəzalarının qarşısını alır və INT4/FP8 kvantizasiyasının paralel tutuma təsirini (12 -> 68 sorğu!) dəqiq rəqəmlə sübut edir."
  - id: ex-specdist-gqa-kv-numeric
    type: numeric
    title: "KV-Cache yaddaş hesabı (GiB)"
    prompt: |
      Bir Transformer modelində:
      - $L = 32$ qat
      - $n_{\text{kv}} = 8$ GQA KV başlığı
      - $d_{\text{head}} = 128$
      - Kontekst uzunluğu $S = 8192$ token
      - Paralel sorğu sayı $B = 8$
      - Dəqiqlik: FP16 ($b_{\text{elem}} = 2$ bayt)

      Bu 8 paralel sorğunun KV-Cache-i cəmi neçə **GiB** ($1\text{ GiB} = 1024^3$ bayt) GPU yaddaşı tutur?
    skills: [spec-distributed-inference]
    category: math
    difficulty: 2
    answer: 8.0
    tolerance: 0.01
    unit: "GiB"
    hints:
      - "Əvvəlcə 1 tokenin bayt ölçüsünü tap: $2 \\times 32 \\times 8 \\times 128 \\times 2 = 131{,}072$ bayt ($128$ KiB)."
      - "Ümumi token sayı $S \\times B = 8192 \\times 8 = 65{,}536$. İndi $65{,}536 \\times 131{,}072$ baytı $1024^3$-ə ($1{,}073{,}741{,}824$) böl."
    explanation: "1 token = $2 \\times 32 \\times 8 \\times 128 \\times 2 = 128\\text{ KiB}$. 1 sorğu ($8192$ token) = $1.0\\text{ GiB}$. $B = 8$ paralel sorğu = $8 \\times 1.0 = 8.0\\text{ GiB}$."
