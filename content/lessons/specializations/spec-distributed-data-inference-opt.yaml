      prompt: "50 milyon sətir və 40 sütundan ibarət proqnoz logları üzərində yalnız `model_version` və `latency_ms` sütunları üzrə `AVG(latency_ms)` hesablanır. Parquet formatı CSV-yə nisbətən niyə 20x–50x daha az disk I/O edir?"
