id: spec-distributed-data-inference-opt
track: specializations
module: distributed-data-engineering
title: "Distributed Data Engineering (Parquet/DuckDB), DDP/FSDP və LLM KV-Cache Optimizasiyası"
summary: "Milyonlarla sətirlik AI datasetlərini CSV-də boğulmadan sütun əsaslı Parquet + DuckDB ilə emal etməyi, çox-GPU təlimində DDP vs FSDP (ZeRO) fərqini, LLM serving-də KV-Cache yaddaş düsturunu, Grouped-Query Attention (GQA) qənaətini və vLLM Continuous Batching arxitekturasını öyrənəcəksən."
level: advanced
estimated_minutes: [55, 80]
prerequisites: [dl-attention-transformers, prod-cicd-versioning-reliability]
next: spec-multimodal-research-papers
skills: [spec-distributed-inference, dl-architectures, prod-monitoring]
objectives:
  - Sətir əsaslı (CSV/JSONL) saxlama ilə sütun əsaslı (Apache Parquet + predicate pushdown) saxlamanın I/O və performans fərqini izah etmək
  - Çox-GPU təlimində Distributed Data Parallel (DDP) ilə Fully Sharded Data Parallel (FSDP / ZeRO) arasında yaddaş və şəbəkə (All-Reduce vs All-Gather) trade-off-larını ayırd etmək
  - "LLM serving zamanı KV-Cache yaddaş tələbini ($\\text{KV}_{\\text{bytes}} = 2 \\cdot L \\cdot n_{\\text{kv}} \\cdot d_{\\text{head}} \\cdot S \\cdot B \\cdot b$) və GPU VRAM büdcəsinə sığan maksimum paralel sorğu sayını (batch size) dəqiq hesablamaq"
  - Static Batching ilə Continuous Batching (vLLM / PagedAttention) arasındakı GPU istifadə fərqini izah etmək
why_it_matters: |
  Kiçik bir prototip 10 MB CSV faylı və tək sorğu ilə işləyir, amma real AI sistemləri iki divara çırpılır: **Data darboğazı** və **GPU VRAM/Throughput darboğazı**.

  1. **Data tərəfi:** 50 milyon proqnoz logunu 15 sütunlu CSV-də saxlasan və yalnız 2 sütunun ortalamasını (`AVG(latency_ms)`) istəsən, disk bütün 15 sütunun mətnini oxuyub parse etməlidir. **Apache Parquet** sütun əsaslı olduğu üçün yalnız həmin 2 sütunu sıxılmış halda oxuyur və **DuckDB** bu sorğunu tək maşında Spark klasteri olmadan saniyələr içində bitirir.
  2. **LLM Serving tərəfi:** 8B parametrli FP16 model 24 GiB GPU-da cəmi ~16 GiB çəki tutur, amma 20 istifadəçi eyni anda uzun kontekst göndərdikdə server `CUDA Out of Memory` verir. Səbəb çəkilər deyil — **KV-Cache**-dir! Bu dərsdə VRAM-ı dəqiq hesablamağı və serving tutumunu mühəndis kimi planlamağı öyrənəcəksən.
terms:
  - term: Columnar Storage (Apache Parquet)
    definition: Cədvəli sətir-sətir yox, sütun-sütun saxlayan və sıxan fayl formatı; analitik sorğularda yalnız lazım olan sütunları oxumaqla (column pruning) I/O-nu 10–50 dəfə azaldır.
  - term: Predicate Pushdown
    definition: Parquet bloklarının min/max statistikalarına baxaraq `WHERE` şərtinə uyğun gəlməyən bütün data bloklarını diskdən oxumadan ötürmə optimizasiyası.
  - term: DDP vs FSDP (ZeRO)
    definition: DDP hər GPU-da modelin tam surətini saxlayıb yalnız qradiyentləri paylaşır (`All-Reduce`); FSDP/ZeRO isə parametrləri, qradiyentləri və optimizer vəziyyətlərini $N$ GPU arasında bölüşdürərək (sharding) tək GPU-ya sığmayan modelləri öyrədir.
  - term: KV-Cache
    definition: Avtoreqressiv LLM generasiyasında əvvəlki tokenlərin Key ($K$) və Value ($V$) vektorlarını yenidən hesablamamaq üçün GPU VRAM-da saxlayan keş.
  - term: Grouped-Query Attention (GQA)
    definition: Bir neçə Query başlığının eyni Key/Value başlığını paylaşması (məs. 32 Q başlığına 8 KV başlığı) — keyfiyyəti qoruyaraq KV-Cache yaddaşını 4x–8x azaldır.
  - term: Continuous Batching & PagedAttention
    definition: Batch-dəki bir sorğu bitən kimi dərhal yeni sorğunu əlavə edən (continuous batching) və KV-Cache-i əməliyyat sistemindəki virtual yaddaş səhifələri kimi fraqmentasiyasız paylaşdıran (PagedAttention / vLLM) serving arxitekturası.
sections:
  - id: columnar-distributed-kvcache
    kind: explanation
    title: "Sütun Əsaslı Data (Parquet/DuckDB), DDP/FSDP və KV-Cache Riyaziyyatı"
    body: |
      ### 1. CSV/JSONL vs Apache Parquet + DuckDB
      Təsəvvür et ki, 10 milyon sətirlik `predictions` cədvəlində 20 sütun var (o cümlədən uzun `prompt_text`), sənə isə yalnız `model_version` üzrə orta `latency_ms` lazımdır:
      - **CSV / JSONL (Row-oriented):** Disk bütün 20 sütunu oxuyur, hər sətirdə JSON/mətn parse edir — 12 GB I/O, 90 saniyə.
      - **Apache Parquet (Columnar):** Yalnız 2 sütunun sıxılmış bloklarını oxuyur (`column pruning`) və `WHERE date = '2026-11-20'` filtri üçün uyğun gəlməyən blokları metadata (`min/max`) ilə atlayır (`predicate pushdown`) — 120 MB I/O, 0.4 saniyə!
      - **DuckDB vs Apache Spark:** Data 100 GB-dan kiçikdirsə, bir maşında işləyən **DuckDB** SQL + Parquet ilə Spark klasterinin JVM/şəbəkə shuffle yükü olmadan qat-qat sürətli və ucuzdur. **Spark** yalnız data terabaytları keçib tək maşının diskinə/RAM-ına sığmayanda lazımdır.

      ---

      ### 2. Çox-GPU Təlimi: DDP vs FSDP (ZeRO)
      - **DDP (Distributed Data Parallel):** Model tək GPU-ya sığır. Hər GPU-da modelin tam surəti var, batch $N$ yerə bölünür, backward sonunda `All-Reduce` ilə qradiyentlərin ortalaması tapılır.
      - **FSDP / DeepSpeed ZeRO:** 70B parametrli model (FP16 çəkilər ~140 GB + AdamW optimizer ~560 GB) tək 80 GB GPU-ya sığmır! FSDP parametrləri, qradiyentləri və optimizer vəziyyətlərini $N$ GPU arasında bölür (**sharding**). Hər qatın forward/backward zamanı yalnız həmin qatın çəkiləri `All-Gather` ilə yığılır və dərhal azad edilir.

      ---

      ### 3. LLM Serving Darboğazı: KV-Cache Yaddaş Düsturu
      Decode mərhələsində hər yeni token əvvəlki bütün tokenlərlə attention hesablayır. Hər dəfə $K$ və $V$ matrislərini sıfırdan hesablamaq $O(S^2)$ iş deməkdir; buna görə onları **KV-Cache**-də saxlayırıq. Onun baytlarla dəqiq həcmi:

      $$\text{KV}_{\text{bytes}} = \underbrace{2}_{K \text{ və } V} \times L \times n_{\text{kv}} \times d_{\text{head}} \times S \times B \times b_{\text{elem}}$$

      Burada:
      - $L$: Transformer qatlarının sayı (`num_layers`)
      - $n_{\text{kv}}$: Key/Value başlıqlarının sayı (`num_kv_heads`; GQA ilə `num_q_heads`-dən kiçik olur)
      - $d_{\text{head}}$: Hər başlığın ölçüsü (`head_dim`, adətən $128$)
      - $S$: Kontekst uzunluğu (giriş + çıxış token sayı)
      - $B$: Eyni anda xidmət edilən paralel sorğu sayı (`batch_size`)
      - $b_{\text{elem}}$: Bir ədədin bayt ölçüsü (FP16/BF16 üçün $2$, FP8/INT8 KV-cache üçün $1$).

      **Static Batching vs Continuous Batching (vLLM):**
      Static batching-də 4 sorğudan biri 20 tokendə bitsə belə, 500 tokenlik ən uzun sorğu bitənə qədər GPU yaddaşını boş yerə tutur. **Continuous Batching** (iterasiya səviyyəli planlama) bitən sorğunu dərhal çıxarıb növbədəki yeni sorğunu daxil edir; **PagedAttention** isə KV-cache-i sabit bloklara (pages) bölərək 60–80% yaddaş itkisini (internal fragmentation) aradan qaldırır.
  - id: restaurant-tables-analogy
    kind: analogy
    title: "Mental model: Static vs Continuous Batching (Restoran masası) və Parquet (Kitabxana kataloqu)"
    body: |
      - **Static Batching:** 4 nəfərlik masada 3 nəfər yeməyini 10 dəqiqəyə bitirir, amma 4-cü nəfər 1 saat çay içir deyə qapıda gözləyən yeni müştərilərin heç biri boşalan 3 stula otura bilmir!
      - **Continuous Batching (vLLM):** 1 stul boşalan kimi növbədəki yeni müştəri dərhal həmin stula oturur — mətbəx (GPU Tensor Cores) fasiləsiz 100% güclə işləyir.
      - **Parquet vs CSV:** Kitabxanadan yalnız bütün kitabların nəşr ilini toplamaq istəyirsən. CSV hər kitabın bütün 500 səhifəsini oxuyub ili axtarmaqdır; Parquet isə yalnız "Nəşr İlləri" adlı nazik ayrıca cədvəli oxumaqdır.
  - id: distributed-inference-diagram
    kind: diagram
    title: "GPU VRAM Büdcəsi və Continuous Batching (vLLM) Serving Axını"
    body: |
      ```mermaid
      flowchart LR
        REQ["Gələn Sorğular Növbəsi"] --> SCHED["Continuous Batching Scheduler"]
        SCHED --> PAGED["PagedAttention KV-Cache Blokları"]
        subgraph GPU["GPU VRAM (məs. 24 GiB)"]
          W["Model Çəkiləri\n(FP16 ~16 GiB və ya INT4 ~5 GiB)"]
          ACT["CUDA + Aktivasiya Ehtiyatı\n(~2 GiB)"]
          KV["Qalan VRAM = KV-Cache Büdcəsi\n(max B paralel sorğu)"]
        end
        PAGED --> KV
        W --> DEC["Parallel Decode Step"]
        KV --> DEC
        DEC -- "EOS token?" --> OUT["Cavabı bitir, KV bloklarını dərhal azad et!"]
        DEC -- "Davam edir" --> SCHED
      ```

      Göründüyü kimi, model çəkiləri sabitdir, amma **KV-Cache** sorğu sayı ($B$) və kontekst uzunluğu ($S$) ilə xətti böyüyür — serving tutumunu təyin edən əsas limit məhz qalan VRAM-dır.
  - id: worked-kv-cache-budget
    kind: worked_example
    title: "Addım-addım rəqəmlərlə: Llama-3-8B üçün KV-Cache və Maksimum Batch Size hesabı"
    body: |
      Llama-3-8B tipli arxitektura verilib:
      - Qat sayı: $L = 32$
      - GQA KV başlıq sayı: $n_{\text{kv}} = 8$ (32 Query başlığı 8 KV başlığını paylaşır!)
      - Başlıq ölçüsü: $d_{\text{head}} = 128$
      - Dəqiqlik: FP16 ($b_{\text{elem}} = 2$ bayt)

      **Addım 1: Tək 1 tokenin bütün 32 qat üzrə KV-Cache ölçüsü**
      $$\text{bytes/token} = 2 \times 32 \times 8 \times 128 \times 2 = 131{,}072 \text{ bayt} = 128 \text{ KiB}$$

      **Addım 2: $S = 4096$ tokenlik 1 sorğu üçün KV-Cache**
      $$4096 \times 128 \text{ KiB} = 524{,}288 \text{ KiB} = 512 \text{ MiB} = \mathbf{0.5 \text{ GiB / sorğu}}$$

      **Addım 3: $B = 16$ paralel sorğu üçün ümumi KV-Cache**
      $$16 \times 0.5 \text{ GiB} = \mathbf{8.0 \text{ GiB}}$$
      *(Müqayisə: GQA olmasaydı və standart MHA $n_{\text{kv}} = 32$ işlədilsəydi, eyni 16 sorğu $4\times$ çox — düz **$32.0 \text{ GiB}$** tutacaq və 24 GiB GPU-ya heç sığmayacaqdı!)*

      **Addım 4: 24 GiB GPU-da maksimum paralel sorğu sayı ($B_{\max}$)**
      - FP16 model çəkiləri = $16.0 \text{ GiB}$, CUDA + aktivasiya ehtiyatı = $2.0 \text{ GiB}$.
      - KV-Cache üçün qalan sərbəst VRAM = $24.0 - 16.0 - 2.0 = 6.0 \text{ GiB}$.
      - $S = 4096$ kontekstlə maksimum paralel sorğu:
        $$B_{\max} = \left\lfloor \frac{6.0 \text{ GiB}}{0.5 \text{ GiB/sorğu}} \right\rfloor = \mathbf{12 \text{ paralel sorğu}}$$
      - Əgər model çəkilərini **INT4 (AWQ/GPTQ)** ilə ~5.0 GiB-ə sıxsaq: qalan VRAM $= 24.0 - 5.0 - 2.0 = 17.0 \text{ GiB} \implies B_{\max} = \lfloor 17.0 / 0.5 \rfloor = \mathbf{34 \text{ paralel sorğu}}$ ($2.8\times$ daha yüksək throughput!).
  - id: kvcache-and-duckdb-code
    kind: code
    title: "Kod: KV-Cache VRAM Kalkulyatoru + DuckDB/Parquet Analitik Nümunə"
    body: |
      **1. Saf Python-da GPU KV-Cache və Serving Tutumu Kalkulyatoru:**
      ```python
      GIB = 1024 ** 3


      def estimate_kv_cache_capacity(
          num_layers: int,
          num_kv_heads: int,
          head_dim: int,
          seq_len: int,
          bytes_per_elem: int,
          gpu_vram_gib: float,
          model_weights_gib: float,
          overhead_gib: float = 2.0,
      ) -> dict[str, float | int]:
          """Calculate per-request KV-cache size (GiB) and max concurrent batch size on one GPU."""
          if min(num_layers, num_kv_heads, head_dim, seq_len, bytes_per_elem) <= 0:
              raise ValueError("Architecture parameters must be positive integers")
          if gpu_vram_gib <= 0 or model_weights_gib < 0 or overhead_gib < 0:
              raise ValueError("Memory parameters must be valid non-negative numbers")

          bytes_per_seq = 2 * num_layers * num_kv_heads * head_dim * seq_len * bytes_per_elem
          kv_per_seq_gib = bytes_per_seq / GIB
          free_vram_gib = max(0.0, gpu_vram_gib - model_weights_gib - overhead_gib)
          max_batch = int(free_vram_gib // kv_per_seq_gib) if kv_per_seq_gib > 0 else 0

          return {
              "kv_per_seq_gib": round(kv_per_seq_gib, 4),
              "free_vram_gib": round(free_vram_gib, 4),
              "max_batch_size": max_batch,
          }


      print(estimate_kv_cache_capacity(32, 8, 128, 4096, 2, 24.0, 16.0, 2.0))
      # {'kv_per_seq_gib': 0.5, 'free_vram_gib': 6.0, 'max_batch_size': 12}
      ```

      **2. Lokal ML mühitində DuckDB ilə 10M sətirlik Parquet analizi (SQL):**
      ```sql
      -- Yalnız 2 sütunu oxuyur, bütün 10GB faylı RAM-a yükləmir!
      SELECT model_version,
             COUNT(*) AS reqs,
             QUANTILE_CONT(latency_ms, 0.95) AS p95_ms
      FROM read_parquet('logs/predictions_*.parquet')
      WHERE event_date >= DATE '2026-11-01'
      GROUP BY model_version;
      ```
  - id: common-distributed-mistakes
    kind: mistakes
    title: "Ən çox edilən Data Engineering və Inference Optimizasiyası səhvləri"
    body: |
      **1. 2 GB-lıq dataset üçün dərhal Hadoop/Spark klasteri qurmaq**
      "Big Data" terminini görüb 5 milyon sətirlik cədvəl üçün 4 node-lu Spark klasteri işlətmək mühəndislik vaxtını və bulud büdcəsini yandırır. 100 GB-dan kiçik analitik data üçün **Parquet + DuckDB / Polars** tək maşında həm daha sürətli, həm də 10x daha sadədir.

      **2. GPU VRAM büdcəsində yalnız model çəkilərini hesablamaq**
      "Model 16 GB-dır, 24 GB GPU bəsdir" deyib 32k kontekstlə 10 paralel istifadəçini buraxdıqda KV-Cache dərhal VRAM-ı partladır (`CUDA OOM`). Həmişə çəkilər + CUDA overhead + $B \times \text{KV}_{\text{seq}}$ cəmini hesabla.

      **3. `max_model_len` limitini lazımsız yerə 128k saxlamaq**
      Tətbiqin heç vaxt 8k tokendən uzun prompt göndərmirsə, serving engine-də `max_model_len=131072` saxlamaq başlanğıcda yaddaş planlayıcısını sıxır və paralel sorğu sayını məhdudlaşdırır.

      **4. Çox-GPU təlimində şəbəkə bant genişliyini (NVLink vs Ethernet) unutmaq**
      FSDP hər qatda parametrləri `All-Gather` ilə ötürür. Yavaş Ethernet üzərində FSDP işlətsən, GPU-lar hesablamaq əvəzinə vaxtın 80%-ni şəbəkədən çəki gözləməklə keçirər.
  - id: distributed-tradeoffs
    kind: tradeoffs
    title: "Mühəndislik seçimləri: Throughput vs Latency və FP16 vs FP8/INT8 KV-Cache"
    body: |
      - **Throughput vs Per-User Latency (ITL):** Batch ölçüsünü $B = 1$-dən $B = 32$-yə qaldırmaq ümumi saniyədə token sayını (throughput) 15x artıra bilər, lakin tək istifadəçinin token-arası gecikməsini (Inter-Token Latency) bir qədər uzadır. İnteraktiv çat üçün orta batch + Continuous Batching, oflayn sənəd xülasələşdirmə üçün isə maksimum batch seçilir.
      - **FP16 vs FP8/INT8 KV-Cache:** KV-cache-i FP16-dan FP8/INT8-ə endirmək ($b_{\text{elem}}: 2 \to 1$) paralel sorğu tutumunu tam **2 qat** artırır, lakin çox uzun kontekstdə incə faktların (needle-in-a-haystack) xatırlanmasında kiçik keyfiyyət itkisi yarada bilər — mütləq golden eval ilə yoxla.
      - **DuckDB vs Distributed Engine (Spark/BigQuery):** Tək SSD/NVMe üzərinə sığan data (< 100–200 GB Parquet) üçün DuckDB; çox-terabaytlıq komanda data gölləri (Data Lakehouse) üçün Spark / Trino / BigQuery seçilir.
mastery_criteria:
  - Parquet + DuckDB-nin CSV/JSONL və Spark-a nisbətən nə vaxt üstün olduğunu I/O və arxitektura baxımından izah edə bilirsən
  - Verilmiş $L, n_{\text{kv}}, d_{\text{head}}, S, B, b$ parametrləri üçün KV-Cache ölçüsünü və GPU-ya sığan maksimum `batch_size`-ı hesablayan kodu yaza bilirsən
  - GQA-nın KV-cache qənaətini, DDP vs FSDP fərqini və Continuous Batching-in GPU istifadəsini necə artırdığını izah edə bilirsən
