      category: production
      options:
        - id: a
          text: "Parquet sütun əsaslıdır (columnar) — yalnız sorğuda tələb olunan 2 sütunun sıxılmış bloklarını oxuyur və predicate pushdown ilə uyğun olmayan blokları atlayır"
