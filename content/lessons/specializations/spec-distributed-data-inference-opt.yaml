    - id: q-specdist-ddp-vs-fsdp
      type: mcq
      title: "DDP vs FSDP (ZeRO) seçimi"
      prompt: "70 milyard parametrli LLM-i 8 ədəd 80 GB H100 GPU-da fine-tune etmək istəyirsən (FP16 çəkilər ~140 GB, tək GPU-ya sığmır). Hansı paylanmış təlim strategiyası zəruridir?"
      skills: [spec-distributed-inference, dl-architectures]
      category: llm-architecture
      options:
        - id: a
          text: "Standart DDP (Distributed Data Parallel) — hər GPU-da modelin tam surətini saxlamaq"
          feedback: "Yanlışdır — 140 GB-lıq modelin tam surəti 80 GB-lıq tək GPU-ya sığmadığı üçün DDP ilk addımda OOM verəcək."
        - id: b
          text: "FSDP / DeepSpeed ZeRO — model parametrlərini, qradiyentləri və optimizer vəziyyətlərini 8 GPU arasında bölüşdürmək (sharding)"
