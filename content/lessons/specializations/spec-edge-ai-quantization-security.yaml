summary: "Böyük FP32 neyron şəbəkələrini dron, Jetson və ya Raspberry Pi kimi məhdud yaddaşlı cihazlara yerləşdirmək üçün simmetrik INT8 kvantizasiya riyaziyyatını, dekvantizasiya xətasını və fiziki/rəqəmsal adversarial hücumlara qarşı müdafiəni öyrənəcəksən."
level: advanced
estimated_minutes: [50, 75]
