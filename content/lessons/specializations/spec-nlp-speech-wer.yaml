      explanation: "Mətn normalizasiyası, WER + CER kombinasiyası və domain-spesifik termin analizi çoxdilli ASR sistemlərinin əsas qiymətləndirmə standartıdır."
exercises:
  - id: ex-specnlp-wer-calculator
    type: code
    title: "Söz səviyyəsində Levenshtein ilə WER hesablayıcısını (compute_wer) yaz"
    prompt: |
      ASR çıxışlarını qiymətləndirmək üçün `compute_wer(reference: str, hypothesis: str) -> float` funksiyasını implementasiya et:

      **Müqavilə (Contract):**
      1. Hər iki mətni `.lower().split()` ilə kiçik hərfli söz siyahısına çevir (`ref_words`, `hyp_words`).
      2. Əgər `ref_words` boşdursa ($N_{\text{ref}} = 0$), `ValueError` qaldır.
      3. Söz səviyyəsində Levenshtein redaktə məsafəsini ($S + D + I$) dinamik proqramlaşdırma ilə hesabla.
      4. $\text{WER} = \frac{S + D + I}{N_{\text{ref}}}$ nisbətini `float` kimi qaytar.
    skills: [llm-evaluation, llm-tokens-context]
    category: python
    difficulty: 2
    hints:
      - "`ref_words = reference.lower().split()` və `hyp_words = hypothesis.lower().split()` yaz; əgər `not ref_words:` olarsa `raise ValueError(...)`."
      - "Ölçüsü `(m + 1) x (n + 1)` olan `dp` cədvəli qur (`m = len(ref_words)`, `n = len(hyp_words)`). İlk sütunu `0..m`, ilk sətri `0..n` ilə doldur."
      - "İkiqat dövrdə sözlər bərabərdirsə `dp[i][j] = dp[i-1][j-1]`, fərqlidirsə `1 + min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1])` yaz və sonda `dp[m][n] / m` qaytar."
    starter_code: |
      def compute_wer(reference: str, hypothesis: str) -> float:
          # TODO: söz səviyyəsində Levenshtein məsafəsi ilə WER hesabla
          return -1.0
    tests:
      - name: "Tam uyğunluq (case-insensitive) və qismən xəta"
        code: |
          assert compute_wer("Salam Dünya", "salam   dünya") == 0.0
          wer = compute_wer("süni intellekt mühəndisliyi çox maraqlıdır", "süni intellekt mühəndisi maraqlıdır")
          assert abs(wer - 0.4) < 1e-6, f"Gözlənilən 0.4, alınan {wer}"
      - name: "Boş hypothesis (100% deletion) və artıq əlavələr (WER > 1.0)"
        code: |
          assert abs(compute_wer("bir iki üç", "") - 1.0) < 1e-6
          wer_high = compute_wer("bəli tamam", "xeyr mən sabah işə gələcəyəm")
          assert abs(wer_high - 2.5) < 1e-6, f"Gözlənilən 2.5, alınan {wer_high}"
      - name: "Boş reference verildikdə ValueError"
        code: |
          for empty_ref in ["", "   "]:
              try:
                  compute_wer(empty_ref, "salam")
                  assert False, "Boş reference üçün ValueError qaldırılmalıdır"
              except ValueError:
                  pass
    solution: |
      def compute_wer(reference: str, hypothesis: str) -> float:
          ref_words = reference.lower().split()
          hyp_words = hypothesis.lower().split()
          if not ref_words:
              raise ValueError("Reference must contain at least one word.")

          m, n = len(ref_words), len(hyp_words)
          dp = [[0] * (n + 1) for _ in range(m + 1)]
          for i in range(m + 1):
              dp[i][0] = i
          for j in range(n + 1):
              dp[0][j] = j

          for i in range(1, m + 1):
              for j in range(1, n + 1):
                  if ref_words[i - 1] == hyp_words[j - 1]:
                      dp[i][j] = dp[i - 1][j - 1]
                  else:
                      dp[i][j] = 1 + min(
                          dp[i - 1][j - 1],
                          dp[i - 1][j],
                          dp[i][j - 1],
                      )
          return dp[m][n] / m
    explanation: |
      Dinamik proqramlaşdırma cədvəli söz səviyyəsində minimum əvəzləmə ($S$), silmə ($D$) və əlavə etmə ($I$) cəmini tapır, daha sonra onu istinad mətninin söz sayına ($m = N_{\text{ref}}$) bölür.
  - id: ex-specnlp-wer-numeric
    type: numeric
    title: "Verilmiş S, D, I saylarına görə WER-i hesabla"
    prompt: |
      $10$ sözdən ibarət istinad (reference) transkripsiyası üzrə ASR modelinin çıxışı yoxlanılır:
      - İstinad söz sayı: $N_{\text{ref}} = 10$
      - Əvəzləmələr (Substitutions): $S = 1$
      - Silinmələr (Deletions): $D = 1$
      - Əlavələr (Insertions): $I = 0$

      Bu transkripsiya üçün **Word Error Rate (WER)** neçədir? (Cavabı onluq kəsrlə, məsələn `0.2` kimi yaz).
    skills: [llm-evaluation]
    category: ml-metric
    difficulty: 1
    answer: 0.2
    tolerance: 0.001
    hints:
      - "WER düsturunu xatırla: WER = (S + D + I) / N_ref"
      - "Surətdə (1 + 1 + 0) = 2, məxrəcdə isə 10 dayanır."
    explanation: |
      $$\text{WER} = \frac{S + D + I}{N_{\text{ref}}} = \frac{1 + 1 + 0}{10} = \frac{2}{10} = 0.2$$
