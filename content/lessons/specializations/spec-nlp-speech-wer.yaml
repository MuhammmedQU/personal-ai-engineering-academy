      options:
        - id: a
          text: "WER hesablamazdan əvvəl həm reference, həm də hypothesis mətnlərinə eyni normalizasiyanı (lowercase, durğu işarələrinin təmizlənməsi) tətbiq etmək"
          feedback: "Bəli, əks halda böyük/kiçik hərf və nöqtə-vergül fərqləri süni xəta yaradır."
        - id: b
          text: "Aqqlütinativ şəkilçi xətalarını daha həssas ölçmək üçün WER ilə yanaşı CER (Character Error Rate) metrikini də izləmək"
          feedback: "Bəli, CER tək hərf/şəkilçi səhvi ilə tamamilə yanlış söz arasındakı fərqi göstərir."
        - id: c
