id: spec-multimodal-research-papers
track: specializations
module: multimodal-research-reading
title: "Multimodal AI (CLIP, VLM) və Elmi Məqalə Oxuma (3-Pass Paper Reading & Ablation Analysis)"
summary: "Şəkil və mətni vahid vektor fəzasında birləşdirən Contrastive Learning (CLIP / simmetrik InfoNCE loss) riyaziyyatını, Vision-Language modellərin (VLM) şəkilləri visual tokenlərə necə çevirdiyini və arXiv elmi məqalələrini 3-keçidli metodla (ablasion cədvəlləri, gizli compute xərci və benchmark məhdudiyyətləri daxil) tənqidi oxumağı öyrənəcəksən."
level: advanced
estimated_minutes: [55, 80]
prerequisites: [dl-attention-transformers, spec-cnn-computer-vision]
next: null
skills: [spec-multimodal-research, vectors-dot-product, llm-evaluation]
objectives:
  - CLIP arxitekturasında L2-normallaşdırılmış şəkil/mətn embedding-ləri üzərindən kosinus oxşarlığı matrisi və simmetrik InfoNCE (cross-entropy) loss hesabını aparmaq
  - Vision-Language modellərində (ViT + Projection Adapter + LLM) bir şəklin neçə visual token yaratdığını və kontekst pəncərəsinə təsirini hesablamaq
  - "Elmi AI məqalələrini 3-keçidli metodla (Pass 1: struktur və töhfə, Pass 2: ablasion və metod, Pass 3: minimal reproduksiya) sistemli şəkildə təhlil etmək"
  - Benchmark cherry-picking, ədalətsiz baseline və ablasion əskikliyi kimi elmi məqalə zəifliklərini ayırd etmək
why_it_matters: |
  AI mühəndisliyi ildə minlərlə yeni arXiv məqaləsi çıxan sahədir. İki kritik bacarıq səni "hype izləyicisi"ndən real **Senior AI Engineer**-ə çevirir:

  1. **Multimodal arxitektura savadlılığı:** Müasir tətbiqlər yalnız mətn yox — PDF skanları, tibbi görüntülər, məhsul fotoları, dron kamerası və səs axınları ilə işləyir. **CLIP** və **VLM** (LLaVA / Qwen-VL / Gemini Multimodal) mexanizmini bildikdə həm multimodal axtarış (text-to-image), həm də sənəd-şəkil analizini düzgün dizayn edirsən.
  2. **Məqalələri tənqidi oxumaq:** Yeni çıxan bir məqalə *"SOTA-nı +4% üstələdik!"* yaza bilər, amma ablasion cədvəlinə baxanda görürsən ki, 3.8% artım onların təklif etdiyi mürəkkəb alqoritmdən yox, sadəcə 4x daha böyük təlim datasından gəlir! 3-keçidli metod həftələrlə boş yerə tətbiq cəhdinin qarşısını alır.
terms:
  - term: Contrastive Learning (CLIP)
    definition: Uyğun şəkil-mətn cütlərinin (diaqonal) kosinus oxşarlığını maksimuma, uyğun olmayan cütlərin (qeyri-diaqonal) oxşarlığını isə minimuma yaxınlaşdıran ikili-enkoder öyrənmə metodu.
  - term: Symmetric InfoNCE Loss
    definition: $B \times B$ oxşarlıq matrisində həm sətirlər üzrə (şəkildən mətnə), həm də sütunlar üzrə (mətndən şəklə) hesablanan Cross-Entropy itkilərinin ortalaması.
  - term: Vision-Language Model (VLM)
    definition: Şəkli Vision Transformer (ViT) ilə patch vektorlarına bölüb proyeksiya adapteri (MLP) vasitəsilə LLM-in token fəzasına ötürən multimodal model.
  - term: Visual Tokens (Patch Count)
    definition: "$H \\times W$ ölçülü şəklin $P \\times P$ yamaqlara (patches) bölünməsi nəticəsində yaranan $(H/P) \\times (W/P)$ sayda görüntü tokeni."
  - term: Ablation Study (Ablasion Təhlili)
    definition: Təklif olunan sistemin hər bir komponentini bir-bir çıxararaq hansı hissənin nəticəyə həqiqətən töhfə verdiyini ölçən nəzarətli eksperiment cədvəli.
  - term: 3-Pass Paper Reading Method
    definition: "Elmi məqaləni əvvəlcədən sona kor-koranə oxumaq əvəzinə 3 mərhələdə (1: 5–10 dəq skan, 2: 40 dəq dərin metod/ablasion, 3: reproduksiya) təhlil etmə strategiyası."
sections:
  - id: clip-vlm-and-paper-reading
    kind: explanation
    title: "CLIP Contrastive Learning, VLM Visual Tokenləri və 3-Keçidli Məqalə Oxuma"
    body: |
      ### 1. CLIP: Şəkil və Mətni Eyni Fəzada Birləşdirmək
      $B$ ədəd (şəkil, təsvir) cütündən ibarət batch verilib:
      1. **Şəkil Enkoderi (ViT/ResNet)** hər şəkli vektorlaşdırır və L2-normallaşdırır: $\hat{I} \in \mathbb{R}^{B \times d}$.
      2. **Mətn Enkoderi (Transformer)** hər mətni eyni ölçülü fəzaya proyeksiya edib L2-normallaşdırır: $\hat{T} \in \mathbb{R}^{B \times d}$.
      3. **Ölçülənmiş Oxşarlıq Matrisi (Logits):**
         $$S = \frac{\hat{I} \hat{T}^T}{\tau} \in \mathbb{R}^{B \times B}$$
         Burada $\tau > 0$ **temperature** hiperparametridir (kiçik $\tau$ paylanmanı kəskinləşdirir).
      4. **Simmetrik InfoNCE itkisi:** Hər $i$-ci şəkil öz $i$-ci mətnini (diaqonal element $S_{i,i}$) seçməli, hər $j$-ci mətn də öz $j$-ci şəklini seçməlidir:
         $$\mathcal{L}_{I \to T} = -\frac{1}{B} \sum_{i=0}^{B-1} \log \frac{e^{S_{i,i}}}{\sum_{k=0}^{B-1} e^{S_{i,k}}}, \qquad \mathcal{L}_{T \to I} = -\frac{1}{B} \sum_{j=0}^{B-1} \log \frac{e^{S_{j,j}}}{\sum_{k=0}^{B-1} e^{S_{k,j}}}$$
         $$\mathcal{L}_{\text{CLIP}} = \frac{1}{2}\left(\mathcal{L}_{I \to T} + \mathcal{L}_{T \to I}\right)$$

      ---

      ### 2. Vision-Language Modellər (VLM) və Visual Token Büdcəsi
      Müasir VLM-lər (məs. LLaVA tipli) 3 blokdan ibarətdir:
      1. **Vision Encoder (ViT):** $H \times W$ şəkli $P \times P$ yamaqlara (patches) bölür:
         $$N_{\text{patches}} = \left(\frac{H}{P}\right) \times \left(\frac{W}{P}\right)$$
         Məsələn, $336 \times 336$ şəkil $14 \times 14$ yamaqlarla **$24 \times 24 = 576$ visual token** yaradır!
      2. **Projection Adapter (MLP / Cross-Attention):** ViT vektorlarını LLM-in `d_model` ölçüsünə uyğunlaşdırır.
      3. **LLM Backbone:** Visual tokenlərlə mətn tokenlərini eyni ardıcıllıqda emal edib cavab yazır.

      ---

      ### 3. Mühəndislər üçün 3-Keçidli Məqalə Oxuma Metodu (S. Keshav)
      - **Pass 1 (5–10 dəq — "Oxumağa dəyərmi?"):** Yalnız Başlıq, Abstract, Girişin son abzası, Bölmə başlıqları, Əsas diaqram/cədvəl və Nəticəni (Conclusion) oxu. 5 suala cavab ver: *Nə problem? Hansı əsas fikir? Doğru baseline-larla müqayisə olunubmu? Mənim layihəmə tətbiq oluna bilərmi?*
      - **Pass 2 (30–45 dəq — "Həqiqətən niyə işləyir?"):** Metod bölməsini və **Ablation Study** cədvəlini diqqətlə oxu. İki şeyi yoxla: (a) əsas artım təklif olunan metoddan gəlir, yoxsa daha çox data/compute hesabına? (b) **Limitations** bölməsində hansı uğursuzluq halları etiraf olunub?
      - **Pass 3 (1–3 saat — "Reproduksiya"):** Əgər metodu öz layihəndə işlədəcəksənsə, mərkəzi düsturu (məs. CLIP loss və ya yeni attention maskası) sintetik 4 nümunəlik datada özün kodla və əsas fərziyyələri yoxla.
  - id: multilingual-translator-analogy
    kind: analogy
    title: "Mental model: İkidilli lüğət (CLIP) və Ev alarkən texniki ekspertiza (Ablation)"
    body: |
      - **CLIP:** Təsəvvür et ki, iki insan biri yalnız şəkil çəkir (Vision Encoder), digəri isə yalnız cümlə yazır (Text Encoder). Onları elə öyrədirik ki, "qırmızı alma" şəkli ilə `"qırmızı alma"` cümləsi otağın eyni küncünə (eyni koordinata), "yaşıl maşın" isə tam əks küncə düşsün. Təlimdən sonra yeni bir sinif üçün modeli yenidən öyrətmədən (**Zero-Shot Classification**) istənilən mətni vektorlaşdırıb ən yaxın şəkli tapmaq olur!
      - **Ablation Study:** Bir maşın ustası sənə deyir: *"Mühərriki, təkərləri və şüşəsiləni dəyişdim — sürət +30 km/saat artdı!"* Ablasion cədvəli hər dəyişikliyi tək-tək sınaqdan keçirib həqiqəti göstərir: bəlkə +29 km/saat mühərrikdən gəlib, şüşəsilən isə +0 km/saat verib. Ablasion olmadan hansı hissənin əsl səbəb olduğunu bilmək mümkün deyil.
  - id: multimodal-clip-vlm-diagram
    kind: diagram
    title: "CLIP Contrastive Öyrənmə vs VLM Token Birləşməsi Arxitekturası"
    body: |
      ```mermaid
      flowchart TD
        subgraph CLIP["CLIP: Contrastive Dual-Encoder (Search & Zero-Shot)"]
          IMG["B Şəkil"] --> VE["Vision Encoder + L2 Norm"]
          TXT["B Mətn"] --> TE["Text Encoder + L2 Norm"]
          VE --> MAT["Oxşarlıq Matrisi S = (I @ T^T) / tau  [B x B]"]
          TE --> MAT
          MAT --> LOSS["Symmetric InfoNCE Loss\n(Diaqonalı artır, qeyri-diaqonalı azalt)"]
        end

        subgraph VLM["VLM: Multimodal Generation (Şəkil + Sual -> Cavab)"]
          IMG2["Şəkil (336x336)"] --> VIT["ViT Patch Encoder (14x14 -> 576 patch)"]
          VIT --> PROJ["MLP Projection Adapter"]
          PROJ --> LLM["LLM Backbone\n[576 visual token + text prompt] -> Cavab"]
          Q["Mətn Sualı"] --> LLM
        end
      ```

      Diqqət et: **CLIP** sürətli retrieval və zero-shot təsnifat üçün idealdır (vektorlar əvvəlcədən indekslənir), **VLM** isə sənəd/qrafik oxuma və mürəkkəb sual-cavab generasiyası üçün istifadə olunur.
  - id: worked-clip-infonce-example
    kind: worked_example
    title: "Addım-addım rəqəmlərlə: 2x2 CLIP InfoNCE Loss və Ablation Cədvəli Təhlili"
    body: |
      ### Hissə A: $B = 2$ batch üçün CLIP Simmetrik InfoNCE Loss
      Artıq L2-normallaşdırılmış vektorlar və $\tau = 0.5$ ($1/\tau = 2.0$) verilib:
      - $\hat{I}_0 = [1.0, 0.0], \quad \hat{I}_1 = [0.0, 1.0]$
      - $\hat{T}_0 = [0.8, 0.6], \quad \hat{T}_1 = [0.0, 1.0]$

      **Addım 1: Kosinus oxşarlığı $C = \hat{I}\hat{T}^T$ və ölçülənmiş logit-lər $S = C / 0.5$**
      $$C = \begin{bmatrix} 0.8 & 0.0 \\ 0.6 & 1.0 \end{bmatrix} \implies S = 2.0 \cdot C = \begin{bmatrix} 1.6 & 0.0 \\ 1.2 & 2.0 \end{bmatrix}$$

      **Addım 2: Şəkildən Mətnə Cross-Entropy ($\mathcal{L}_{I \to T}$ — sətirlər üzrə)**
      - Sətir 0 (`[1.6, 0.0]`, hədəf `0`): $p_{0,0} = \frac{e^{1.6}}{e^{1.6} + e^0} = \frac{4.953}{5.953} \approx 0.8320 \implies -\ln(0.8320) \approx 0.1839$
      - Sətir 1 (`[1.2, 2.0]`, hədəf `1`): $p_{1,1} = \frac{e^{2.0}}{e^{1.2} + e^{2.0}} = \frac{7.389}{10.709} \approx 0.6900 \implies -\ln(0.6900) \approx 0.3711$
      $$\mathcal{L}_{I \to T} = \frac{0.1839 + 0.3711}{2} = \mathbf{0.2775}$$

      **Addım 3: Mətndən Şəklə Cross-Entropy ($\mathcal{L}_{T \to I}$ — sütunlar üzrə)**
      - Sütun 0 (`[1.6, 1.2]`, hədəf `0`): $p = \frac{4.953}{4.953 + 3.320} \approx 0.5987 \implies -\ln(0.5987) \approx 0.5130$
      - Sütun 1 (`[0.0, 2.0]`, hədəf `1`): $p = \frac{7.389}{1.0 + 7.389} \approx 0.8808 \implies -\ln(0.8808) \approx 0.1269$
      $$\mathcal{L}_{T \to I} = \frac{0.5130 + 0.1269}{2} = \mathbf{0.3200}$$

      **Addım 4: Simmetrik CLIP Loss**
      $$\mathcal{L}_{\text{CLIP}} = \frac{0.2775 + 0.3200}{2} \approx \mathbf{0.2987}$$

      ---

      ### Hissə B: Ablasion Cədvəlini Tənqidi Oxumaq
      Bir məqalənin cədvəli belə görünür:
      | Variant | Təlim Datası | Model | F1 Skoru | Latency |
      |---|---|---|---|---|
      | Baseline (Məqalədəki) | 10k | Standard ViT | 78.0% | 12 ms |
      | + 5x Təlim Datası | 50k | Standard ViT | 83.4% | 12 ms |
      | + Yeni Mürəkkəb Modul X | 50k | ViT + Modul X | 83.7% | 48 ms |

      **Mühəndis diaqnozu:** +5.7% ümumi artımın **5.4%-i sadəcə datanı 5x böyütməkdən** gəlib! Yeni "Modul X" cəmi +0.3% (statistik küy səviyyəsində!) verir, amma gecikməni **4 qat (12 ms -> 48 ms)** pisləşdirir. Production-da Modul X-i tətbiq etmək səhv qərar olar!
  - id: clip-loss-python-code
    kind: code
    title: "Kod: Saf Python-da L2-Normallaşdırılmış CLIP Simmetrik InfoNCE Loss"
    body: |
      ```python
      import math


      def l2_normalize(vec: list[float]) -> list[float]:
          norm = math.sqrt(sum(v * v for v in vec))
          if norm == 0.0:
              raise ValueError("cannot L2-normalize zero vector")
          return [v / norm for v in vec]


      def cross_entropy_row(logits: list[float], target_idx: int) -> float:
          """Numerically stable -log(softmax(logits)[target_idx])."""
          m = max(logits)
          log_denom = m + math.log(sum(math.exp(x - m) for x in logits))
          return -(logits[target_idx] - log_denom)


      def clip_contrastive_loss(
          image_embeds: list[list[float]],
          text_embeds: list[list[float]],
          temperature: float = 0.07,
      ) -> float:
          """Compute symmetric InfoNCE CLIP loss for matched (image_i, text_i) pairs."""
          if not image_embeds or len(image_embeds) != len(text_embeds):
              raise ValueError("image_embeds and text_embeds must be non-empty and same batch size")
          if temperature <= 0:
              raise ValueError("temperature must be positive")

          b = len(image_embeds)
          d = len(image_embeds[0])
          img_n = [l2_normalize(v) for v in image_embeds]
          txt_n = [l2_normalize(v) for v in text_embeds]
          if any(len(v) != d for v in img_n + txt_n):
              raise ValueError("all embeddings must share the same dimension")

          # S[i][j] = (img_n[i] . txt_n[j]) / temperature
          logits = [
              [sum(img_n[i][k] * txt_n[j][k] for k in range(d)) / temperature for j in range(b)]
              for i in range(b)
          ]
          loss_i2t = sum(cross_entropy_row(logits[i], i) for i in range(b)) / b
          loss_t2i = sum(cross_entropy_row([logits[i][j] for i in range(b)], j) for j in range(b)) / b
          return 0.5 * (loss_i2t + loss_t2i)


      print(round(clip_contrastive_loss([[1.0, 0.0], [0.0, 1.0]], [[0.8, 0.6], [0.0, 1.0]], temperature=0.5), 4))
      # 0.2987
      ```
  - id: common-multimodal-paper-mistakes
    kind: mistakes
    title: "Multimodal AI və Elmi Məqalə Oxumada Ən Çox Edilən Səhvlər"
    body: |
      **1. Məqalənin yalnız Abstract və 1-ci cədvəlinə baxıb production arxitekturanı dəyişmək**
      Bir çox məqalə öz metodunu zəif tənzimlənmiş (untuned) baseline-larla müqayisə edir və ya yalnız akademik benchmark-da (ImageNet/MMLU) yüksək nəticə göstərir. Ablasion cədvəlinə, latency/VRAM xərcinə və öz real datanda kiçik pilot testə baxmadan arxitekturanı dəyişmə.

      **2. VLM-lərdə yüksək çözünürlüklü şəkillərin token xərcini unutmaq**
      Bir PDF-in 10 səhifəsini yüksək çözünürlüklü (high-res) şəkil kimi VLM-ə göndərmək səhifə başına 1000–2000 visual token (cəmi 15,000+ giriş tokeni!) yarada bilər. Həm API xərci, həm də TTFT gecikməsi kəskin artır — mətn əsaslı PDF-lərdə əvvəlcə mətni çıxar, VLM-i yalnız cədvəl/diaqram olan səhifələrdə işlət.

      **3. CLIP-dən məkan/sayma məntiqi gözləmək ("bag-of-words" effekti)**
      Standart CLIP *"qırmızı kubun solundakı mavi kürə"* ilə *"mavi kürənin solundakı qırmızı kub"* arasındakı fərqi ayırmaqda zəifdir, çünki kontrastiv itki əsasən qlobal obyekt sözlərinə fokuslanır. Məkan əlaqələri və OCR üçün güclü VLM və ya obyekt detektoru + koordinatlar lazımdır.

      **4. Benchmark Contamination (Data Sızması) riskini görməzdən gəlmək**
      İnternetdən toplanmış nəhəng pretraining korpuslarında açıq benchmark test sualları artıq mövcud ola bilər. Məqalənin nəticəsini həmişə öz gizli (held-out) daxili eval dəstində təsdiqlə.
  - id: multimodal-tradeoffs
    kind: tradeoffs
    title: "Mühəndislik Seçimləri: CLIP vs VLM və OCR+LLM vs End-to-End VLM"
    body: |
      - **CLIP vs VLM:** 1 milyon məhsul şəkli içindən 20 ms ərzində mətnlə axtarış (multimodal retrieval) üçün **CLIP** rəqibsizdir (şəkillər bir dəfə indekslənir). Tək bir faktura şəklinin içindən strukturlaşdırılmış JSON çıxarmaq üçün isə **VLM** lazımdır.
      - **OCR + Mətn LLM vs Birbaşa VLM:** Təmiz skan edilmiş sadə mətn sənədlərində OCR + ucuz mətn LLM daha ucuz və sürətlidir; lakin mürəkkəb cədvəllər, qrafiklər, əl yazısı və vizual sxemlər olan sənədlərdə birbaşa VLM məkan düzülüşünü itirmədiyi üçün daha dəqiq olur.
      - **Tədqiqat Yeniliyi vs Mühəndislik Sadəliyi:** Yeni bir məqalə +0.5% dəqiqlik verib kodu 3x mürəkkəbləşdirirsə və gecikməni 2x artırırsa, məhsul mühəndisliyində 99% halda sadə və dayanıqlı baseline qalib gəlir.
mastery_criteria:
  - Verilmiş şəkil və mətn embedding cütləri üçün L2-normallaşdırılmış simmetrik InfoNCE (CLIP) itkisini kodda yaza bilirsən
  - ViT patch ölçüsünə görə VLM visual token sayını hesablaya bilirsən
  - Elmi məqalənin ablasion cədvəlini təhlil edib həqiqi töhfəni data/compute artımından ayıra bilirsən
quiz:
  pass_threshold: 0.75
  questions:
    - id: q-specmm-clip-symmetry
      type: mcq
      title: "CLIP itkisi niyə simmetrikdir?"
      prompt: "CLIP təlimində $B \\times B$ oxşarlıq matrisində niyə həm sətirlər üzrə (Image -> Text), həm də sütunlar üzrə (Text -> Image) Cross-Entropy itkisi hesablanır?"
      skills: [spec-multimodal-research, vectors-dot-product]
      category: llm-architecture
      options:
        - id: a
          text: "Hər şəklin öz mətnini, eyni zamanda hər mətnin də batch daxilində öz uyğun şəklini seçməsini təmin edərək ikiistiqamətli hizalanma yaratmaq üçün"
          feedback: "Doğrudur! Simmetrik InfoNCE həm image-to-text, həm də text-to-image axtarışını eyni fəzada öyrədir."
        - id: b
          text: "Çünki matrisin diaqonalı həmişə sıfırdır"
          feedback: "Yanlışdır — diaqonal elementlər məhz müsbət (uyğun) cütlərdir və maksimuma çatdırılır."
        - id: c
          text: "Yalnız batch size 1 olduqda işləməsi üçün"
          feedback: "Yanlışdır — kontrastiv öyrənmə mənfi nümunələr (in-batch negatives) üçün böyük batch size ($B \\gg 1$) tələb edir."
      answer: a
      explanation: "Simmetrik InfoNCE itkisi diaqonaldakı uyğun (şəkil, mətn) cütlərini həm sətir, həm sütun istiqamətində qeyri-diaqonal mənfi cütlərdən ayırır."
    - id: q-specmm-vit-tokens
      type: numeric
      title: "VLM Visual Token (Patch) sayı hesabı"
      prompt: |
        Bir Vision-Language modelin ViT enkoderi $448 \\times 448$ ölçülü şəkli $14 \\times 14$ ölçülü üst-üstə düşməyən yamaqlara (patches) bölür.
        Bu tək şəkil LLM-in kontekst pəncərəsinə neçə **visual token** əlavə edir?
      skills: [spec-multimodal-research]
      category: math
      answer: 1024
      tolerance: 0.1
      unit: "token"
      hints:
        - "Üfüqi yamaq sayı $448 / 14 = 32$, şaquli yamaq sayı $448 / 14 = 32$."
        - "Ümumi visual token sayı $32 \\times 32$-dir."
