      skills: [spec-robotics]
      category: concept
      options:
        - id: a
          text: "Integral (I) həddi — zamanla yığılan kiçik xətaları toplayaraq küləyin yaratdığı sabit sürüşməni kompensasiya edir"
          feedback: "Doğrudur! Xəta sıfırdan fərqli qaldıqca inteqral həddi böyüyür və dronu hədəfə çatdırana qədər əlavə itələmə gücü yaradır."
        - id: b
          text: "Derivative (D) həddi — çünki sabit xətanın törəməsi çox böyük olur"
          feedback: "Yanlışdır. Xəta sabit ($15\\text{ sm}$) qaldıqda $e_t - e_{t-1} = 0$ olur, yəni D həddinin çıxışı sıfırdır!"
        - id: c
          text: "Actuator clamping — limiti azaltmaqla sabit xəta yox olur"
          feedback: "Yanlışdır. Clamping yalnız maksimum gücü məhdudlaşdırır."
      answer: a
      explanation: "Sabit xətada törəmə sıfır olur, P həddi isə küləklə tarazlaşdığı üçün çatmır. Yalnız Integral ($K_i \\sum e_k \\Delta t$) zaman keçdikcə artaraq steady-state xətanı sıfırlayır."
    - id: q-specrob-ema-numeric
      type: numeric
      title: "EMA sensor filtrasiyası"
      prompt: |
        Dronun əvvəlki yüksəklik təxmini $\hat{x}_{t-1} = 10.0\text{ m}$-dir. Yeni sensor ölçüsü $z_t = 14.0\text{ m}$ gəlir.
        Əgər EMA hamarlama əmsalı $\alpha = 0.25$ olarsa, yeni qiymətləndirilmiş yüksəklik $\hat{x}_t$ neçə metr olar?
      skills: [spec-robotics]
      category: math
      answer: 11.0
      tolerance: 0.01
      hints:
        - "EMA düsturu: x_hat_t = alpha * z_t + (1 - alpha) * x_hat_{t-1}"
        - "0.25 * 14.0 + 0.75 * 10.0 ifadəsini hesabla."
      explanation: "$\\hat{x}_t = 0.25 \\times 14.0 + (1 - 0.25) \\times 10.0 = 3.5 + 7.5 = 11.0\\text{ m}$."
    - id: q-specrob-derivative-role
      type: mcq
      title: "Törəmə (Derivative) həddinin işarəsi"
      prompt: "Robot hədəfə doğru sürətlə yaxınlaşır: əvvəlki addımda müsbət xəta $e_{t-1} = 5.0\\text{ m}$ idi, cari addımda isə $e_t = 2.0\\text{ m}$-ə düşdü. Bu anda Derivative ($D$) həddi idarəetmə əmrinə necə təsir edir?"
      skills: [spec-robotics, derivatives-chain-rule]
      category: math
      options:
        - id: a
          text: "Xətanın dəyişməsi mənfi olduğu üçün ($e_t - e_{t-1} = -3.0$) D həddi mənfi olur və mühərrik əmrini azaldaraq əyləc (damping) rolunu oynayır"
          feedback: "Doğrudur! Xəta hələ müsbət olsa da, sürətlə azaldığı üçün D həddi mənfi işarə ilə P həddinə əks çıxır və overshoot-un qarşısını alır."
        - id: b
          text: "Xəta müsbət olduğu üçün D həddi də müsbət olur və robotu daha da sürətləndirir"
          feedback: "Yanlışdır. D həddi xətanın özünə yox, onun dəyişməsinə ($e_t - e_{t-1}$) baxır."
        - id: c
          text: "D həddi yalnız xəta mənfi olduqda işə düşür"
          feedback: "Yanlışdır. D həddi xətanın dəyişdiyi hər bir addımda aktivdir."
      answer: a
      explanation: "$e_t - e_{t-1} = 2.0 - 5.0 = -3.0 < 0$. Buna görə $K_d \\frac{e_t - e_{t-1}}{\\Delta t}$ mənfi olur və robot hədəfə çatmazdan əvvəl sürəti yumşaldır."
    - id: q-specrob-safety-practices
      type: multi
      title: "Real-zamanlı avtonom idarəetmə təhlükəsizliyi"
      prompt: "Fiziki robot və ya dron üçün idarəetmə dövrəsi yazarkən aşağıdakılardan hansılar **məcburi təhlükəsizlik təcrübəsidir**? Hamısını seç."
      skills: [spec-robotics]
      category: production
      options:
        - id: a
          text: "PID çıxışını icraçı mexanizmin fiziki hədlərinə (`[-limit, +limit]`) sıxmaq (actuator clamping)"
          feedback: "Bəli, mühərrik sürücüsünə icazəli həddən artıq siqnal göndərmək həm təhlükəlidir, həm də qeyri-xətti pozuntular yaradır."
        - id: b
          text: "Kamera hədəfi ardıcıl $K$ kadrdan çox itirdikdə failsafe (stop / hover) rejiminə keçmək"
          feedback: "Bəli, kor-koranə köhnə əmrlə hərəkətə davam etmək qəzaya səbəb olur."
        - id: c
          text: "Zaman addımı $\\Delta t \\le 0$ olduqda xətanı tutmaq və sıfıra bölmənin qarşısını almaq"
          feedback: "Bəli, saat sinxronizasiyası və ya dublikat timestamp zamanı $\\Delta t = 0$ `ZeroDivisionError` və ya `inf` əmr yarada bilər."
        - id: d
          text: "Sensor küyünü azaltmaq üçün $\\Delta t$-ni həmişə $10\\text{ saniyə}$ götürmək"
          feedback: "Xeyr! $10$ saniyəlik idarəetmə gecikməsi ilə heç bir dinamik robot və ya dron tarazlıqda qala bilməz."
      answers: [a, b, c]
      explanation: "Actuator saturation clamping, failsafe timeout və $\\Delta t > 0$ validasiyası hər bir avtonom idarəetmə proqramının təməl təhlükəsizlik müqaviləsidir."
exercises:
  - id: ex-specrob-pid-controller
    type: code
    title: "Diskret PID Kontroller addımını (pid_control_step) implementasiya et"
    prompt: |
      Avtonom robotun idarəetmə dövrəsi üçün `pid_control_step` funksiyasını yaz:

      ```python
      def pid_control_step(
          setpoint: float,
          measurement: float,
          prev_error: float,
          integral: float,
          dt: float,
          kp: float,
          ki: float,
          kd: float,
          limit: float,
      ) -> tuple[float, float, float]:
      ```

      **Müqavilə (Contract):**
      1. Əgər `dt <= 0` və ya `limit <= 0` olarsa, `ValueError` qaldırmalıdır.
      2. Cari xətanı hesabla: `error = setpoint - measurement`.
      3. Yeni inteqralı hesabla: `new_integral = integral + error * dt`.
      4. Xətanın törəməsini hesabla: `derivative = (error - prev_error) / dt`.
      5. Xam PID əmrini hesabla: `u = kp * error + ki * new_integral + kd * derivative`.
      6. Əmri `[-limit, limit]` aralığına sıx (`clamped_command`).
      7. `(clamped_command, error, new_integral)` tuple-nı qaytar.
    skills: [spec-robotics, derivatives-chain-rule]
    category: python
    difficulty: 2
    hints:
      - "Əvvəlcə `if dt <= 0 or limit <= 0: raise ValueError(...)` yoxlamasını yaz."
      - "`error = setpoint - measurement`, `new_integral = integral + error * dt` və `derivative = (error - prev_error) / dt` ardıcıllığı ilə P, I, D komponentlərini tap."
      - "Çıxışı sıxmaq üçün `clamped = max(-limit, min(limit, raw_u))` ifadəsindən istifadə et və `(clamped, error, new_integral)` qaytar."
    starter_code: |
      def pid_control_step(
          setpoint: float,
          measurement: float,
          prev_error: float,
          integral: float,
          dt: float,
          kp: float,
          ki: float,
          kd: float,
          limit: float,
      ) -> tuple[float, float, float]:
          # TODO: PID hesablamasını və [-limit, limit] clamping-i implementasiya et
          return 0.0, 0.0, 0.0
    tests:
      - name: "Dərsdəki nümunə ilə dəqiq PID hesabı"
        code: |
          u, err, integ = pid_control_step(10.0, 9.0, 4.0, 2.0, 0.5, 2.0, 0.5, 0.5, 20.0)
          assert abs(u - 0.25) < 1e-6, f"Gözlənilən u=0.25, alınan {u}"
          assert abs(err - 1.0) < 1e-6, f"Gözlənilən err=1.0, alınan {err}"
          assert abs(integ - 2.5) < 1e-6, f"Gözlənilən integ=2.5, alınan {integ}"
      - name: "Yuxarı və aşağı doyma hədlərinə sıxılma (Clamping)"
        code: |
          u_hi, _, _ = pid_control_step(100.0, 0.0, 0.0, 0.0, 1.0, 2.0, 0.0, 0.0, 15.0)
          assert u_hi == 15.0, f"Yuxarı limit 15.0 gözlənilirdi, alınan {u_hi}"
          u_lo, _, _ = pid_control_step(-100.0, 0.0, 0.0, 0.0, 1.0, 2.0, 0.0, 0.0, 15.0)
          assert u_lo == -15.0, f"Aşağı limit -15.0 gözlənilirdi, alınan {u_lo}"
      - name: "Yanlış dt və ya limit üçün ValueError"
        code: |
          for bad_dt, bad_limit in [(0.0, 10.0), (-0.1, 10.0), (0.1, 0.0), (0.1, -5.0)]:
              try:
                  pid_control_step(1.0, 0.0, 0.0, 0.0, bad_dt, 1.0, 0.1, 0.1, bad_limit)
                  assert False, f"ValueError gözlənilirdi: dt={bad_dt}, limit={bad_limit}"
              except ValueError:
                  pass
    solution: |
      def pid_control_step(
          setpoint: float,
          measurement: float,
          prev_error: float,
          integral: float,
          dt: float,
          kp: float,
          ki: float,
          kd: float,
          limit: float,
      ) -> tuple[float, float, float]:
          if dt <= 0 or limit <= 0:
              raise ValueError("dt and limit must be strictly positive.")
          error = setpoint - measurement
          new_integral = integral + error * dt
          derivative = (error - prev_error) / dt
          raw_u = kp * error + ki * new_integral + kd * derivative
          clamped_command = max(-limit, min(limit, raw_u))
          return clamped_command, error, new_integral
    explanation: |
      Funksiya əvvəlcə $\Delta t > 0$ və $\text{limit} > 0$ şərtlərini yoxlayır, daha sonra diskret PID tənliyini hesablayıb çıxışı $[-\text{limit}, +\text{limit}]$ parçasına sıxır və növbəti dövrə üçün lazım olan `(clamped_command, error, new_integral)` vəziyyətini qaytarır.
  - id: ex-specrob-pd-numeric
    type: numeric
    title: "PD kontrollerin çıxış əmrini hesabla"
    prompt: |
      Mobil robotun sükan idarəetməsində yalnız **PD kontroller** ($K_i = 0$) istifadə olunur.
      Verilənlər:
      - Cari xəta: $e_t = 4.0$
      - Əvvəlki xəta: $e_{t-1} = 2.0$
      - Zaman addımı: $\Delta t = 0.5\text{ s}$
      - Əmsallar: $K_p = 1.5$, $K_d = 0.5$

      İdarəetmə əmri $u_t = K_p e_t + K_d \frac{e_t - e_{t-1}}{\Delta t}$ neçəyə bərabərdir?
    skills: [spec-robotics, derivatives-chain-rule]
    category: math
    difficulty: 1
    answer: 8.0
    tolerance: 0.01
    hints:
      - "Proportional hissəni hesabla: $K_p \\times e_t = 1.5 \\times 4.0 = 6.0$."
      - "Törəməni tap: $(4.0 - 2.0) / 0.5 = 4.0$. Sonra $K_d \\times 4.0 = 0.5 \\times 4.0 = 2.0$ əlavə et."
    explanation: |
      $P = 1.5 \times 4.0 = 6.0$.
      $D = 0.5 \times \frac{4.0 - 2.0}{0.5} = 0.5 \times 4.0 = 2.0$.
      Yekun əmr: $u_t = 6.0 + 2.0 = 8.0$.
