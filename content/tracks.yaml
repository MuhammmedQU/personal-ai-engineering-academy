        title: CNN və Computer Vision Engineering
        summary: 2D konvolyusiya riyaziyyatı, stride/padding ölçü düsturu, object detection bounding box-ları, IoU və Non-Maximum Suppression.
        status: authored
        level: specialization
        optional: true
        prerequisites: [neural-network-basics]
        outcomes:
          - "Konvolyusiya çıxış ölçüsünü ($\\lfloor (W - K + 2P)/S \\rfloor + 1$) və parametr sayını hesablamaq"
          - "İki bounding box üçün Intersection over Union (IoU) göstəricisini sıfırdan hesablamaq"
          - Non-Maximum Suppression (NMS) və mAP-ın iş prinsipini izah etmək
        effort_hours: [12, 24]
        practical_task: "Mini-Project: 2D konvolyusiya ölçü yoxlayıcısı və bounding box IoU + NMS filtri yaz, video/şəkil deteksiyalarını qiymətləndir."
        mastery_criteria:
          - Kəsişməyən və qismən kəsişən qutular üçün IoU-nu həm əl ilə, həm kodla səhvsiz hesablayırsan
        lessons:
          - spec-cnn-computer-vision
      - id: robotics-autonomy
        title: Robotics, Autonomous Systems və Control Loops
        summary: Perception → state estimation (EMA/Kalman) → PID control dövrü, aktuatorda doyma (saturation) və təhlükəsiz dayanma (failsafe).
        status: authored
        level: specialization
        optional: true
        prerequisites: [neural-network-basics]
        outcomes:
          - Küylü sensor ölçmələrini EMA / 1D Kalman filtri ilə hamarlamaq və kadr itkisində failsafe tətbiq etmək
          - "Diskret PID tənzimləyicisini ($K_p e + K_i \\int e + K_d de/dt$) anti-windup və çıxış sərhədi ilə kodlamaq"
        effort_hours: [14, 28]
        practical_task: "Mini-Project: Simulyasiyada hədəfi izləyən dron/robot üçün EMA state estimator + sərhədlənmiş PID controller dövrü qur."
        mastery_criteria:
          - Verilmiş setpoint, ölçmə və dt üçün PID çıxışını əl ilə və kodla hesablaya bilirsən
          - Sensor siqnalı kəsildikdə robotun niyə son komandada ilişib qalmamalı olduğunu (failsafe) izah edə bilirsən
        lessons:
